  <script>
window.QUESTION_BANK = [{"id":"1-1-1","subject":"教育学","chapter":"第一章 教育及教育学的产生与发展","number":1,"stem":"以下不属于广义教育的是( )。","options":["妈妈教孩子洗衣服","社团活动","参观美术馆","小鸟学飞"],"answer":"D","explanation":"广义教育的定义是凡是增进人们的知识和技能.影响人们的想品德的活动都是教育。教育只局限于人，所以小鸟学飞不属于广义教育。"},{"id":"1-1-2","subject":"教育学","chapter":"第一章 教育及教育学的产生与发展","number":2,"stem":"狭义的教育主要是指( )。","options":["家庭教育","职业教育","学校教育","社会教育"],"answer":"C","explanation":"狭义的教育就是学校教育。"},{"id":"1-1-3","subject":"教育学","chapter":"第一章 教育及教育学的产生与发展","number":3,"stem":"在一定的社会背景下发生的促使个体的社会化和社会的个性化的实践活动即( )。","options":["教育","教学","德育","智育"],"answer":"A","explanation":"题干描述的是“教育”的定义。“教学”一般指的是课堂教学，但个体社会化和社会个性化的活动不仅仅是课堂教学，所以不符合。"},{"id":"1-1-4","subject":"教育学","chapter":"第一章 教育及教育学的产生与发展","number":4,"stem":"教育学史上第一个正式提出并把教育起源问题作为一个学术问题来认识的是( )。","options":["神话起源说","生物起源说","心理起源说","劳动起源说"],"answer":"B","explanation":"教育学史上第一个正式提出的教育起源学说是生物起源说。"},{"id":"1-1-5","subject":"教育学","chapter":"第一章 教育及教育学的产生与发展","number":5,"stem":"利托尔诺认为：教育活动不仅存在于人类社会之中，而且存在于人类社会之外，甚至存在于动物界。这是教育的( )的观点。","options":["生物起源说","神话起源说","心理起源说","劳动起源说"],"answer":"A","explanation":"教育也存在于动物界是生物起源说的观点。"},{"id":"1-1-6","subject":"教育学","chapter":"第一章 教育及教育学的产生与发展","number":6,"stem":"认为教育起源于儿童对成年人无意识的模仿的是( )。","options":["神话起源说","生物起源说","心理起源说","劳动起源说"],"answer":"C","explanation":"认为教育产生于儿童对成年人无意识模仿的是孟禄的心理起源说。"},{"id":"1-1-7","subject":"教育学","chapter":"第一章 教育及教育学的产生与发展","number":7,"stem":"教育是人类特有的一种社会活动，这是______的观点。( )","options":["生物起源说","神话起源说","心理起源说","劳动起源说"],"answer":"D","explanation":"认为教育是人类特有的社会活动是劳动起源说的观点。"},{"id":"1-1-8","subject":"教育学","chapter":"第一章 教育及教育学的产生与发展","number":8,"stem":"下列哪个社会的教育没有阶级性( )","options":["封建社会","奴隶社会","原始社会","资本主义社会"],"answer":"C","explanation":"原始社会还没有产生阶级，所以教育没有阶级性。"},{"id":"1-1-9","subject":"教育学","chapter":"第一章 教育及教育学的产生与发展","number":9,"stem":"自( ) 阶段开始，自然科学就成为学校教学内容的组成部分。","options":["原始教育","近代教育","现代教育","古代教育"],"answer":"B","explanation":"古代自然科学不发达，自然科学知识从近代开始呈现大幅度膨胀，所以自然科学成为教学内容也是从近代开始。"},{"id":"1-1-10","subject":"教育学","chapter":"第一章 教育及教育学的产生与发展","number":10,"stem":"教育从生产劳动中第一次分离的标志是( )。","options":["学校的产生","剩余产品的出现","有了国家","创造了文字"],"answer":"A","explanation":"学校产生之后，学校内的教师和学生就不用从事生产劳动而只专心于知识的传授和学习，所以教育与生产劳动相分离。"},{"id":"1-1-11","subject":"教育学","chapter":"第一章 教育及教育学的产生与发展","number":11,"stem":"学校教育与生产劳动相脱离是______教育的一个主要特征。( )","options":["古代社会","近代社会","资本主义社会","社会主义社会"],"answer":"A","explanation":"教育与生产劳动相脱离是古代社会教育的特征。"},{"id":"1-1-12","subject":"教育学","chapter":"第一章 教育及教育学的产生与发展","number":12,"stem":"古代中国学校教育的主要内容是六艺，它包括( )。","options":["礼.乐.射.辞.书.数","文法.修辞.辩证法.书数.射御","算术.几何.文法.辩证法.天文.书数","礼.乐.射.御.书.数"],"answer":"D","explanation":"“六艺”是礼乐射御书数。"},{"id":"1-1-13","subject":"教育学","chapter":"第一章 教育及教育学的产生与发展","number":13,"stem":"以培养有文化修养和多种才能的政治家和商人为教育目的的是古代 ( )","options":["斯巴达","埃及","希腊","雅典"],"answer":"D","explanation":"题干描述的是雅典的教育特点。"},{"id":"1-1-14","subject":"教育学","chapter":"第一章 教育及教育学的产生与发展","number":14,"stem":"以培养忠于统治阶级的强悍的军人为教育目的是古代 ( )","options":["希腊","埃及","斯巴达","雅典"],"answer":"C","explanation":"斯巴达教育以培养军人为主要教育目的。"},{"id":"1-1-15","subject":"教育学","chapter":"第一章 教育及教育学的产生与发展","number":15,"stem":"古代西欧教育，( )处于全部学科的“王冠”地位。","options":["神学","算术","文法","辩证学"],"answer":"A","explanation":"中世纪西欧是基督教整体控制整个社会的时期，所以那个时候，处于全部学科“王冠”的是神学。“七艺”教育是为学习神学做准备。"},{"id":"1-1-16","subject":"教育学","chapter":"第一章 教育及教育学的产生与发展","number":16,"stem":"强调身心和谐发展，教育内容比较丰富，方法比较灵活的教育是( )。","options":["古代印度","古代埃及","斯巴达","雅典"],"answer":"D","explanation":"雅典教育强调身心和谐发展，教学方法比较灵活。"},{"id":"1-1-17","subject":"教育学","chapter":"第一章 教育及教育学的产生与发展","number":17,"stem":"下列说法错误的是( )。","options":["斯巴达教育特别重视对其子女进行体操和军事训练。","雅典教育只重视读写算.音乐.文学.政治和哲学方面的教育","儒家的经典著作“四书”和“五经”是我国封建社会教育的主要内容","在欧洲封建社会里，教会教育的内容是“七艺”"],"answer":"B","explanation":"雅典教育注重人身心和谐发展，除了B项中提到的以外，也注重体育教育。A.C.D三项都正确。"},{"id":"1-1-18","subject":"教育学","chapter":"第一章 教育及教育学的产生与发展","number":18,"stem":"在欧洲封建社会，宗教成了封建制度的精神支柱和统治人民的工具，因而教育上出现了两种类型的教育：( )和骑士教育。","options":["斯巴达教育","宗教教育","教会教育","雅典教育"],"answer":"C","explanation":"欧洲中世纪是基督教全面掌控社会的时期，所有教会教育是中世纪教育的重要类型。宗教教育是所有宗教都具有的，而教会教育是基督 心发展的( )。","options":["互补性","个别差异性","不平衡性","阶段性"],"answer":"B","explanation":"不同的人取得成就的时间不同，这说明人的身心发展有个别差异性。"},{"id":"1-3-32","subject":"教育学","chapter":"第三章 教育与人的发展","number":32,"stem":"教育教学中搞“一刀切”、“齐步走”，违背了个体身心发展的( )。","options":["顺序性","个别差异性","阶段性","互补性"],"answer":"B","explanation":"教育中搞“一刀切”违背了个体身心发展的差异性。"},{"id":"1-3-33","subject":"教育学","chapter":"第三章 教育与人的发展","number":33,"stem":"教育工作中，要做到“因材施教”、“长善救失”，这说明( )。","options":["教育要适应年青一代身心发展的顺序性","教育要适应年青一代身心发展的阶段性","教育要适应年青一代身心发展的个别差异性","教育要遵循学生身心发展的规律"],"answer":"C","explanation":"人的身心发展的个体差异性决定了教育要因材施教。"},{"id":"1-3-34","subject":"教育学","chapter":"第三章 教育与人的发展","number":34,"stem":"教育要适应人的发展的个别差异性，做到( )。","options":["循序渐进","因材施教","教学相长","防微杜渐"],"answer":"B","explanation":"教育要适应人的个别差异，做到因材施教。"},{"id":"1-4-1","subject":"教育学","chapter":"第四章 教育与社会发展","number":1,"stem":"教育和经济的关系，总的来说是( )。","options":["经济决定教育，教育反作用于经济","教育决定经济，经济反作用于教育","经济决定教育，教育对经济没有影响","教育决定经济，经济对教育没有影响"],"answer":"A","explanation":"根据马克思的理论，经济基础决定上层建筑，上层建筑反作用于经济基础。教育属于上层建筑之一，所以经济决定教育，教育反作用于经济。"},{"id":"1-4-2","subject":"教育学","chapter":"第四章 教育与社会发展","number":2,"stem":"( )水平决定教育的规模和速度。","options":["政治经济制度","科学技术","生产力发展","文化发展"],"answer":"C","explanation":"教育发展的规模和速度主要由生产力发展水平来决定。古代生产力发展低下，所以只有少数人能够接受教育。自近代以来，生产力得到极大发展，国家才能够普及义务教育。"},{"id":"1-4-3","subject":"教育学","chapter":"第四章 教育与社会发展","number":3,"stem":"一个国家教育经费投入的多少，最终取决于( )。","options":["文化传统","受教育者的需求","生产力的水平","教育的规模"],"answer":"C","explanation":"一个国家教育经费投入的多少主要受这个国家本身经济发展水平的影响，而经济发展水平主要受生产力水平的制约，所以选C。"},{"id":"1-4-4","subject":"教育学","chapter":"第四章 教育与社会发展","number":4,"stem":"社会生产力与教育内容的关系是( )。","options":["社会生产力制约所有教育内容","社会生产力制约与劳动能力有关的教育内容","社会生产力与教育内容无关","社会生产力制约与意识形态有关的教育内容"],"answer":"A","explanation":"生产力决定生产关系，生产力和生产关系合起来形成经济基础。经济基础决定上层建筑。教育是上层建筑的一部分，所以生产力决定教育，制约着所有的教育内容。"},{"id":"1-4-5","subject":"教育学","chapter":"第四章 教育与社会发展","number":5,"stem":"教育的经济功能受( )的制约。","options":["社会经济制度","社会生产力水平","科学技术和文化背景","文化传统"],"answer":"B","explanation":"教育的经济功能受社会生产力水平的制约。"},{"id":"1-4-6","subject":"教育学","chapter":"第四章 教育与社会发展","number":6,"stem":"对教育结构的变化具有制约作用的是( )。","options":["专业结构","学科结构","科技结构","生产力水平"],"answer":"D","explanation":"对教育结构的变化具有制约作用的是生产力水平。专业.学科.科技只能对教育内容产生影响，而无法对教育结构产生影响。"},{"id":"1-4-7","subject":"教育学","chapter":"第四章 教育与社会发展","number":7,"stem":"提出高等教育大众化的要求在( )。","options":["第一次工业革命后","第二次工业革命后","二战前","信息革命后"],"answer":"D","explanation":"注意题目里强调“高等教育”，高等教育的大众化是信息革命后开始的。"},{"id":"1-4-8","subject":"教育学","chapter":"第四章 教育与社会发展","number":8,"stem":"关于生产力对教育的制约作用，说法错误的是( )。","options":["生产力的发展制约着教育事业发展的规模和速度","生产力的发展水平制约着人才培养的规格和教育结构","生产力的发展促进着教学内容.教学方法和教学组织形式的发展与改革","生产力的发展决定着受教育的权利"],"answer":"D","explanation":"政治决定着受教育的权利。"},{"id":"1-4-9","subject":"教育学","chapter":"第四章 教育与社会发展","number":9,"stem":"设立什么样的学校，开设什么样的专业，各级各类学校之间的比例如何，各种专业之间的比例如何，都受生产力发展水平和产业结构所制约。这说明了( )。","options":["生产力的发展决定着教育目的的性质","生产力的发展必然引起教育结构的变化","生产力的发展制约着人才培养的规格","生产力的发展促进着教学方法发展与改革"],"answer":"B","explanation":"各级各类学校之间的比例.专业比例都属于教育结构，所以生产力的发展必然引起教育结构的变化。"},{"id":"1-4-10","subject":"教育学","chapter":"第四章 教育与社会发展","number":10,"stem":"教育能把可能的劳动力转化为现实的劳动力，是( )再生产的重要手段。","options":["生产力","人才","劳动力","科学知识"],"answer":"C","explanation":"题干两次强调“劳动力”一词，所以选C。"},{"id":"1-4-11","subject":"教育学","chapter":"第四章 教育与社会发展","number":11,"stem":"“建国君民，教学为先”这句话反映了( )","options":["教育与政治的关系","教育与经济的关系","教育与文化的关系","教育与科技的关系"],"answer":"A","explanation":"这句话的意思是建设国家，管理公众事务，教育为最优先重要的事情。所以反映的是教育与政治的关系。"},{"id":"1-4-12","subject":"教育学","chapter":"第四章 教育与社会发展","number":12,"stem":"决定教育领导权的是( )。","options":["生产力","政治经济制度","文化","科学技术"],"answer":"B","explanation":"教育的领导权由政治经济制度决定。"},{"id":"1-4-13","subject":"教育学","chapter":"第四章 教育与社会发展","number":13,"stem":"直接决定教育目的的因素是( )。","options":["生产力","文化","科学技术","政治经济制度"],"answer":"D","explanation":"决定教育目的的直接因素是政治经济制度。决定教育目的的根本因素是生产力。"},{"id":"1-4-14","subject":"教育学","chapter":"第四章 教育与社会发展","number":14,"stem":"政治与教育内容的关系是( )。","options":["政治决定一切教育内容","政治决定与劳动能力有关的教育内容","政治与教育内容无关","政治决定与思想意识有关的教育内容"],"answer":"D","explanation":"政治与经济不同，只能决定与思想意识有关的教育内容。"},{"id":"1-4-15","subject":"教育学","chapter":"第四章 教育与社会发展","number":15,"stem":"小学开展经典诵读活动时，对传统文化要取其精华，去其糟粕。这说明教育对文化具有( )","options":["继承功能","传递功能","选择功能","创造功能"],"answer":"C","explanation":"教育对文化具有筛选功能，即“取其精华，去其糟粕”，因此答案选 C。"},{"id":"1-4-16","subject":"教育学","chapter":"第四章 教育与社会发展","number":16,"stem":"环境文化和设施文化属于( )。","options":["学校精神文化","学校物质文化","学校组织和制度文化","学生亚文化"],"answer":"B","explanation":"环境和设施都是客观存在的，所以是学校物质文化。"},{"id":"1-4-17","subject":"教育学","chapter":"第四章 教育与社会发展","number":17,"stem":"文化（精神文化）对教育的影响，最直接的方面就是( )。","options":["教育制度","教育规模","教育方法","学校课程内容二、简答题1.简述生产力对教育的作用。2.简述教育对生产力的反作用。3.简述社会政治经济制度对教育的制约。4.简述教育的文化功能。"],"answer":"D","explanation":"文化对教育最直接的影响就是对学校课程内容的影响。二、简答题1.简述生产力对教育的作用：（1）生产力的发展水平制约着教育事业发展的规模和速度；（2）生产力的发展水平制约着人才培养的规格和教育结构；（3）生产力的发展促进着教学内容、教学方法和教学组织形式的发展与改革。2.简述教育对生产力的反作用：（1）教育能把可能的劳动力转化为现实的劳动力，是劳动力再生产的重要手段；（2）教育是促进科学知识再生产的重要手段；（3）教育是发展科学的一个重要手段。3.简述社会政治经济制度对教育的制约：（1）社会政治经济制度决定教育的性质；（2）社会政治经济制度决定受教育权；（3）社会政治经济制度决定教育目的；（4）社会政治经济制度决定着教育内容的取舍；（5）社会政治经济制度决定着教育体制；（6）教育相对独立于政治经济制度。4.简述教育的文化功能：（1）传递——保存文化的功能；（2）传播——交流文化的功能；（3）选择——提升文化的功能；（4）创造——更新文化的功能。"},{"id":"1-5-1","subject":"教育学","chapter":"第五章 学校教育制度","number":1,"stem":"教育主体确定，教育对象相对稳定，形成系列的文化传播活动，有相对稳定的活动场所和设施等特点的出现意味着( )。","options":["教育现象刚刚萌芽","教育形态已趋于定型","教育制度初步形成","教育活动趋于完善"],"answer":"B","explanation":"题干阐述的其实是学校的出现这一历史现象。学校的出现意味着教育形态已趋于定型，但还没有发展成为教育制度。教育制度指的是形成的各级各类学校，如小学、中学、大学、职业学校等。"},{"id":"1-5-2","subject":"教育学","chapter":"第五章 学校教育制度","number":2,"stem":"“教育不应再限于学校的围墙之内”是( )的教育理想。","options":["非制度化","前制度化","制度化","义务教育"],"answer":"A","explanation":"认为教育不能局限于学校之内是非制度化教育的思想。"},{"id":"1-5-3","subject":"教育学","chapter":"第五章 学校教育制度","number":3,"stem":"我国的学制类型属于( )","options":["双轨制","单轨制","分支制","多轨制"],"answer":"C","explanation":"我国的学制类型跟前苏联一致，都是分支制。"},{"id":"1-5-4","subject":"教育学","chapter":"第五章 学校教育制度","number":4,"stem":"我国第一个颁布并实施的学制是( )","options":["《壬寅学制》","《癸卯学制》","《壬子癸丑学制》","《壬戌学制》"],"answer":"B","explanation":"1903年颁布的《癸卯学制》，也称为《奏定学堂章程》，是我国历史上第一个颁布并实施的学制。"},{"id":"1-5-5","subject":"教育学","chapter":"第五章 学校教育制度","number":5,"stem":"根据1993年颁发的《中国教育改革和发展纲领》的相关规定，小学实行( )","options":["校长负责制","党支部领导下的校长负责制","书记负责制","教职工代表大会制"],"answer":"A","explanation":"当前我国小学的教育管理体制是校长负责制。"},{"id":"1-5-6","subject":"教育学","chapter":"第五章 学校教育制度","number":6,"stem":"“金字塔”的等级制教育制度属于( )。","options":["网络教育","学校教育","社会教育","大众教育"],"answer":"B","explanation":"学校教育具有“金字塔”的等级制：参加基础教育的学生最多，参加高等教育的学生最少。"},{"id":"1-5-7","subject":"教育学","chapter":"第五章 学校教育制度","number":7,"stem":"学校物质文化.制度文化.精神文化的统一体是( )。","options":["校训","班风","校风","学风"],"answer":"C","explanation":"校风是学校物质文化.制度文化.精神文化的统一体。"},{"id":"1-5-8","subject":"教育学","chapter":"第五章 学校教育制度","number":8,"stem":"校园文化的核心是学校的( )文化。","options":["观念和制度","精神和观念","组织和制度","物质"],"answer":"B","explanation":"校园文化的核心是学校的精神和观念文化。"},{"id":"1-5-9","subject":"教育学","chapter":"第五章 学校教育制度","number":9,"stem":"学校文化以传递文化传统为己任，这一点突出表现在它所传递的( )上。","options":["教学思想","教学内容","教学方法","教学手段"],"answer":"B","explanation":"学校传递文化传统的主要载体是教学内容。"},{"id":"1-5-10","subject":"教育学","chapter":"第五章 学校教育制度","number":10,"stem":"学校各群体所具有的思想观念和行为方式是学校文化的( )。","options":["特征","表象","核心","内容"],"answer":"C","explanation":"学校各群体说具有的思想观念和行为方式是学校的校风，是学校文化的核心。"},{"id":"1-5-11","subject":"教育学","chapter":"第五章 学校教育制度","number":11,"stem":"人们为了保证学校中教育活动顺利进行而创立和形成的一种特有的文化是( )。","options":["校园文化","学生文化","教师文化","活动文化"],"answer":"A","explanation":"校园文化的内涵最广，包括学生文化.教师文化和活动文化。"},{"id":"1-5-12","subject":"教育学","chapter":"第五章 学校教育制度","number":12,"stem":"学校物质文化是校园文化的空间物态形式，是学校( )文化的物质载体。","options":["组织","制度","精神","观念"],"answer":"C","explanation":"学校的物质文化是学校精神文化的载体。"},{"id":"1-6-1","subject":"教育学","chapter":"第六章 教师与学生","number":1,"stem":"世界上最早的师范教育机构诞生于( )。","options":["法国","英国","德国","美国"],"answer":"A","explanation":"世界上最早的师范教育机构诞生于法国。"},{"id":"1-6-2","subject":"教育学","chapter":"第六章 教师与学生","number":2,"stem":"教师首次被列入“专家.技术人员有关工作者”类别的文件是( )。","options":["《关于教师地位的建议》","《中华人民共和国国家标准职业分类与代码》","《教师资格条例》","《中华人民共和国教师法》"],"answer":"B","explanation":"把教师首次列入“专家.技术人员”的文件是《国家标准职业分类与代码》。"},{"id":"1-6-3","subject":"教育学","chapter":"第六章 着重探讨人的心理的共同性。主要包括认知、情绪和意志三个方面，即：常说的知、情、意。"},{"id":"2-1-7","subject":"心理学","chapter":"第一章 心理学概述","number":7,"stem":"心理过程包括( )","options":["认识过程、情感过程、行为过程","知觉过程、情感过程、行为过程","感觉过程、知觉过程、意志过程","认识过程、情感过程、意志过程"],"answer":"D","explanation":"心理过程是指心理现象发生、发展和消失的过程，它具有时间上的延续性。包括认识过程、情感过程和意志过程。"},{"id":"2-1-8","subject":"心理学","chapter":"第一章 心理学概述","number":8,"stem":"下列心理活动中，属于个性倾向性的是( )。","options":["感知","情绪","兴趣","气质"],"answer":"C","explanation":"人的个性包括个性倾向性和个性心理特征。个性倾向性是指人对客观现实的态度，是人进行活动的基本动力，主要包括需要、动机、兴趣、理想、世界观、人生观、价值观。"},{"id":"2-1-9","subject":"心理学","chapter":"第一章 心理学概述","number":9,"stem":"( )是个性倾向性的集中表现，是个人行为的最高调节器。","options":["需要","兴趣","自我意识","世界观"],"answer":"D","explanation":"世界观是一个人对整个世界的看法和态度，并指导着人的行动，世界观是个性倾向性的集中表现，一经形成就成为个人行为举止的调机器。"},{"id":"2-1-10","subject":"心理学","chapter":"第一章 心理学概述","number":10,"stem":"个性心理特征是在（ ）实践的基础上形成和发展起来的。","options":["认知过程","情感过程","意志过程","认知过程.情感过程.意志过程"],"answer":"D","explanation":"个性心理特征是在认知过程、情感过程、意志过程实践的基础上形成和发展起来的。"},{"id":"2-1-11","subject":"心理学","chapter":"第一章 心理学概述","number":11,"stem":"下列心理活动中，属于个性心理特征的是( )。","options":["思维","意志","兴趣","气质"],"answer":"D","explanation":"个性心理特征指能力、气质和性格等方面的特征和差异。"},{"id":"2-1-12","subject":"心理学","chapter":"第一章 心理学概述","number":12,"stem":"下列属于个性心理特征的是( )","options":["情感","意志","感觉","气质"],"answer":"D","explanation":"个性心理特征包括个体的气质、性格、能力等。"},{"id":"2-1-13","subject":"心理学","chapter":"第一章 心理学概述","number":13,"stem":"个性结构中的核心成分是( )。","options":["能力","气质","性格","兴趣"],"answer":"C","explanation":"性格是人与人互相区别的主要方面，是人格的核心。"},{"id":"2-1-14","subject":"心理学","chapter":"第一章 心理学概述","number":14,"stem":"教育心理学具体研究范畴是围绕( )相互作用的过程中而展开的。","options":["学生与教师","学生与学习","学与教","教师与教学"],"answer":"C","explanation":"教育心理学的具体研究范畴是围绕学与教相互作用过程展开的。学与教相互作用过程是一个系统过程，该系统包含学生、教师、教学内容、教学媒体和教学环境等五种要素；由学习过程、教学过程和评价/反思过程这三种活动过程交织在一起。"},{"id":"2-1-15","subject":"心理学","chapter":"第一章 心理学概述","number":15,"stem":"冯特在德国莱比锡大学建立第一个心理学实验室是在( )年。","options":["1897","1879","1789","1798"],"answer":"B","explanation":"1875年，冯特应聘出任莱比锡大学哲学教授，1879年，冯特在莱比锡大学建立了世界上第一个心理学实验室。该实验室的出现，应该说是心理学史上的一个里程碑，标志着新心理科学的诞生。"},{"id":"2-1-16","subject":"心理学","chapter":"第一章 心理学概述","number":16,"stem":"被称为“教育心理学之父”的是( )","options":["弗洛伊德","柏拉图","布鲁纳","桑代克"],"answer":"D","explanation":"桑代克是教育心理学的创始人，被称为教育心理学之父。"},{"id":"2-1-17","subject":"心理学","chapter":"第一章 心理学概述","number":17,"stem":"教育心理学作为一门独立的心理学分支学科，诞生于( )","options":["19世纪末20世纪初","20世纪20年代","20世纪30年代","20世纪60年代"],"answer":"A","explanation":"1903 年，美国心理学家桑代克继续了众多教育家和思想家对教育与心理相互关系研究 的结果，在自己实验研究的基础上出版了《教育心理学》一书，使教育心理学成为了一门独立的学科。"},{"id":"2-1-18","subject":"心理学","chapter":"第一章 心理学概述","number":18,"stem":"行为主义产生以后很快风行美国乃至全球,还引发了一场心理学史上的“行为主义革命”,因此被称为西方心理学的( )","options":["第一势力","第二势力","第三势力","第四势力"],"answer":"A","explanation":"从20世纪20年代至50年代这长达40余年的时间里，行为主义几乎一统天下，因此被称为西方心理学的“第一势力”。"},{"id":"2-1-19","subject":"心理学","chapter":"第一章 心理学概述","number":19,"stem":"行为主义理论的创始人是( )。","options":["冯特","华生","弗洛依德","马斯洛"],"answer":"B","explanation":"冯特是科学心理学的创始人。华生是行为主义心理学的创始人。弗洛伊德是精神分析学派的创始人。马斯洛是人本主义心理学的主要发起人。"},{"id":"2-1-20","subject":"心理学","chapter":"第一章 心理学概述","number":20,"stem":"精神分析学派的创始人是( )。","options":["冯特","华生","弗洛依德","马斯洛"],"answer":"C","explanation":"弗洛伊德是奥地利医生、心理学家，是精神分析学派的创始人。"},{"id":"2-1-21","subject":"心理学","chapter":"第一章 心理学概述","number":21,"stem":"把人看成一个信息加工者,一个具有丰富的内在资源,并能利用这些资源与周围环境发生相的.积极的有机体是( )的观点。","options":["行为主义心理学","生物学","现象学","认知心理学"],"answer":"D","explanation":"现代认知心理学把人的心理活动看作是信息加工系统，由感官搜集的信息，经过分析、存储、转换，然后加以利用。"},{"id":"2-1-22","subject":"心理学","chapter":"第一章 心理学概述","number":22,"stem":"人本主义心理学的代表人物是( )","options":["华生","马斯洛","霍尔","杜威"],"answer":"B","explanation":"马斯洛是人本主义心理学的代表人物。"},{"id":"2-1-23","subject":"心理学","chapter":"第一章 心理学概述","number":23,"stem":"每个学生的本质都是好的,每个孩子都会成为好孩子.这体现了( )的思想。","options":["行为主义","人本主义","认知心理学","精神分析"],"answer":"B","explanation":"人本主义心理学认为人的本质是好的、善良的，他们不是受无意识欲望驱使的野兽.人有自由意志，有自我实现的需要.由此可得，正确答案为B项。"},{"id":"2-1-24","subject":"心理学","chapter":"第一章 心理学概述","number":24,"stem":"建构主义发展观的提出者是( )。","options":["皮亚杰","维果斯基","埃里克森","斯滕伯格"],"answer":"A","explanation":"建构主义最早提出者可追溯至瑞士的皮亚杰。"},{"id":"2-1-25","subject":"心理学","chapter":"第一章 心理学概述","number":25,"stem":"构造主义心理学主张研究人的( )","options":["认知","意识","行为","无意识"],"answer":"B","explanation":"构造主义心理学主张研究人的直接经验即意识，并把人的经验分为感觉、意象和激情状态三种元素。"},{"id":"2-1-26","subject":"心理学","chapter":"第一章 心理学概述","number":26,"stem":"下列心理学派与其代表人物，正确匹配的是（ ）","options":["机能主义——冯特","格式塔——铁钦纳","人本主义—— 罗杰斯","构造主义——詹姆斯"],"answer":"C","explanation":"人本主义心理学兴起于20世纪五、六十年代的美国。由马斯洛创立，以罗哲斯为代表，被称为除行为学派和精神分析以外，心理学上的“第三势力”。"},{"id":"2-1-27","subject":"心理学","chapter":"第一章 心理学概述","number":27,"stem":"心理学属于( )","options":["自然科学","社会科学","自然科学和社会科学双重性质的科学","哲学"],"answer":"C","explanation":"心理学研究对象的极其特殊性与研究方法的极其复杂性，决定了心理学不同于任何一门具有某种固定研究范式的、纯粹的自然科学或纯粹的社会科学。它是属于既有自然性，又有社会性的边缘性学科。"},{"id":"2-1-28","subject":"心理学","chapter":"第一章 心理学概述","number":28,"stem":"心理科学体系中的基础学科是( )","options":["实验心理学","普通心理学","发展心理学","生理心理学"],"answer":"B","explanation":"普通心理学是心理学的基础学科或总学科。它的主要任务是依据并归纳心理学在各个方面的研究成果，阐明心理现象中各种最基本的事实与最一般的问题，探索心理活动的普遍规律。"},{"id":"2-1-29","subject":"心理学","chapter":"第一章 心理学概述","number":29,"stem":"教育心理学的具体研究范畴是围绕学与教相互作用的过程展开的,要知道教师该如何教,首先就要理解学生该怎样学。因此，( )是教育心理学的核心。","options":["学习心理","教学心理","学生心理","教师心理"],"answer":"A","explanation":"教育心理学的具体研究范畴是围绕学与教相互作用的过程展开的.学与教的相互作用过程是一个系统过程，该系统包含学生、教师、教学内容、教学媒体和教学环境五种要素，由学习过程、教学过程和评价/反思过程这三种活动过程交织在一起组成.学与教实际上是对同一过程的不同理解，要知道教师该如何教，首先就要理解学生该怎样学，故学习心理是教育心理学的核心。"},{"id":"2-1-30","subject":"心理学","chapter":"第一章 心理学概述","number":30,"stem":"（ ）在深度上对基本理论问题进行细致研究。","options":["普通心理学","发展心理学","理论心理学","生理心理学"],"answer":"C","explanation":"理论心理学是研究心理现象、探讨心理科学基本原理的一门学科。它关注心理现象的实质、机制和过程，追求普遍的解释、科学的理论和预期的指导力量。"},{"id":"2-1-31","subject":"心理学","chapter":"第一章 心理学概述","number":31,"stem":"运用心理学的原理和方法来诊断与治疗个体的心理障碍，改善人们的行为模式的心理学分支学科是（ ）","options":["教育心理学","发展心理学","生理心理学","临床心理学"],"answer":"D","explanation":"临床心理学属于应用心理学的范畴，临床心理学注重对人类个体的能力和特点的测量和评估并根据所收集到的资料对个体进行分析，以支持其所得的有关结论。"},{"id":"2-1-32","subject":"心理学","chapter":"第一章 心理学概述","number":32,"stem":"（ ）在广度上研究各个社会领域内的心理。","options":["社会心理学","应用心理学","发展心理学","比较心理学"],"answer":"B","explanation":"应用心理学研究心理学基本原理在各种实际领域的应用，包括工业、工程、组织管理、市场消费、社会生活、医疗保健、体育运动以及军事、司法、环境等各个领域。"},{"id":"2-2-1","subject":"心理学","chapter":"第二章 认知过程","number":1,"stem":"下列哪种是外部感觉？( )","options":["运动觉","平衡觉","皮肤觉","内脏觉"],"answer":"C","explanation":"内部感受指反映机体内部状态和内部变化的感觉，包括运动感觉、平衡感觉和内脏感觉。外部感觉接受外部刺激，反映外界事物特性的感觉，如视觉、听觉、嗅觉、味觉和皮肤感觉。其感受器位于体表。"},{"id":"2-2-2","subject":"心理学","chapter":"第二章 认知过程","number":2,"stem":"觉察刺激之间微弱差别的能力称为( )","options":["绝对感觉阈限","绝对感受性","差别感觉阈限","差别感受性"],"answer":"D","explanation":"人类感觉的强度对于刺激物的刺激强度到了一定的范围界限才能够感觉到，而不同刺激之间有着不同的反角刺激底线，人类能够从中发现这里面的细微差别，我们把这种细微的差别就叫做差别感受性。"},{"id":"2-2-3","subject":"心理学","chapter":"第二章 认知过程","number":3,"stem":"“入芝兰之室，久而不闻其香”描述的是( )","options":["适应现象","听觉适应","嗅觉刺激","味觉刺激"],"answer":"A","explanation":"适应现象是指感觉器官在同一刺激持续作用下敏感性发生变化的现象。整个过程中刺激物的性质、强度没有变化但由于连续或重复刺激使感觉器官的敏感性发生暂时的变化。"},{"id":"2-2-4","subject":"心理学","chapter":"第二章 认知过程","number":4,"stem":"“甜蜜的噪音”.“温暖的色彩”这种感觉现象是( )","options":["适应","对比","后像","联觉"],"answer":"D","explanation":"联觉是指一种感觉伴随着另一种或多种感觉而生的情况，例如听觉伴随着景象而生，另一种联觉是将字、形状、数字或人名等事物和感官如味道、颜色或口味等连在一起。"},{"id":"2-2-5","subject":"心理学","chapter":"第二章 认知过程","number":5,"stem":"知觉条件在一定范围内变化，人对客观事物的知觉映像仍保持相对不变的特性是知觉的( )。","options":["选择性","整体性","理解性","恒常性"],"answer":"D","explanation":"当客观条件在一定范围内改变时，我们的知觉映象在相当程度上却保持着它的稳定性，即知觉恒常性， 例如远处的一个人向你走近时，他在你视网膜中的图像会越来越大，但你感知到他的身材却没有什么变化。"},{"id":"2-2-6","subject":"心理学","chapter":"第二章 认知过程","number":6,"stem":"教师在写板书时，尽量要用白色粉笔，所依据的感知规律是（ ）","options":["强度律","活动律","差异律","组合律"],"answer":"C","explanation":"教师在书写板书时，要求尽量用白色粉笔，主要突出与黑板颜色的差异，方便学生识别，因此所依据的感知规律是差异律。"},{"id":"2-2-7","subject":"心理学","chapter":"第二章 认知过程","number":7,"stem":"注意是人的心理活动对一定对象的( )。","options":["需要与态度","观察与思考","分配与稳定","指向与集中"],"answer":"D","explanation":"注意有两个基本特征，一个是指向性，是指心理活动有选择的反映一些现象而离开其余对象。二是集中性，是指心理活动停留在被选择对象上的强度或紧张。"},{"id":"2-2-8","subject":"心理学","chapter":"第二章 认知过程","number":8,"stem":"听到一声巨响，马上转过头去看，这属于( )。","options":["无意注意","有意注意","有意后注意","随意注意"],"answer":"A","explanation":"无意注意，又称不随意注意，是指没有预定目的，也不需要意志努力的注意。"},{"id":"2-2-9","subject":"心理学","chapter":"第二章 认知过程","number":9,"stem":"有预定目的，需要一定意志努力的注意是( )","options":["随意注意","不随意注意","随意后注意","无意注意"],"answer":"A","explanation":"随意注意指的是有预定目的、需要一定意志努力的注意。它是注意的一种积极、主动的形式。是在不随意注意的基础上发展起来的，是人类所特有的心理现象。"},{"id":"2-2-10","subject":"心理学","chapter":"第二章 认知过程","number":10,"stem":"有预定目的.需要意志努力的注意是( )。","options":["无意注意","有意注意","有意后注意","不随意注意"],"answer":"B","explanation":"无意注意，又称不随意注意，是指没有预定目的，也不需要意志努力的注意。有意注意，又称随意注意，是指有预定目的、也需要意志努力的注意。有意后注意，又称随意后注意，是指有预定目的，但不需要意志努力的注意。"},{"id":"2-2-11","subject":"心理学","chapter":"第二章 认知过程","number":11,"stem":"有预定目的.不需要意志努力的注意是( )。","options":["无意注意","有意注意","有意后注意","不随意注意"],"answer":"C","explanation":"有意后注意，又称随意后注意，是指有预定目的，但不需要意志努力的注意。"},{"id":"2-2-12","subject":"心理学","chapter":"第二章 认知过程","number":12,"stem":"“一目十行”反映的是注意的哪个品质？( )","options":["注意的广度","注意的稳定性","注意的分配","注意的转移"],"answer":"A","explanation":"注意的广度指在同一时间内一个人能够清楚地觉察或认识客体的数量，也叫注意范围。注意广度也表明知觉的范围。在同一时间内注意广度越大，知觉的对象就越多，注意广度越小，知觉的对象也越少。"},{"id":"2-2-13","subject":"心理学","chapter":"第二章 认知过程","number":13,"stem":"“一心二用”反映的是注意的哪个品质？( )","options":["注意的广度","注意的稳定性","注意的分配","注意的转移"],"answer":"C","explanation":"“一心二用”体现了注意品质特性是“注意分配”，其含义是在同一时间内，人把注意分配到两种或两种以上活动中去的能力。所以选C。"},{"id":"2-2-14","subject":"心理学","chapter":"第二章 认知过程","number":14,"stem":"和注意的稳定性相反的不良注意品质是( )。","options":["注意的转移","注意的分散","注意的分配","注意的动摇"],"answer":"B","explanation":"注意的稳定性是指注意在同一对象或活动上所保持时间的长短。同注意的稳定性相反的表现是注意的分散。注意的分散是指在注意过程中，由于无关刺激的干扰或者单调刺激的持续作用引起的偏离注意对象的状态。"},{"id":"2-2-15","subject":"心理学","chapter":"第二章 认知过程","number":15,"stem":"“万绿丛中一点红”容易被注意到是利用刺激物的( )。","options":["强度","对比","变化","活动"],"answer":"B","explanation":"红绿对比，易引起人们的无意注意。"},{"id":"2-2-16","subject":"心理学","chapter":"第二章 认知过程","number":16,"stem":"瞬时记忆的储存时间为（ ）","options":["0.2秒—2秒","0.25秒—2秒","0.5秒—2秒","5秒—1分钟"],"answer":"B","explanation":"瞬时记忆保留时间为0.25-2秒；短时记忆为一分钟以内的记忆；长时记忆：保持时间1分钟以上的记忆。"},{"id":"2-2-17","subject":"心理学","chapter":"第二章 认知过程","number":17,"stem":"信息在短时记忆中一般只保持( )秒钟。","options":["1～2","20～40","60～70","70～80"],"answer":"B","explanation":"短时记忆的保持时间在无复述的情况下只有20～40秒，最长也不超过1分钟。有复述的情况下，保持在短时记忆中的学习材料会向长时记忆转移。"},{"id":"2-2-18","subject":"心理学","chapter":"第二章 认知过程","number":18,"stem":"将储存在长时记忆中的信息提取出来解决当前问题的记忆是（ ）","options":["瞬时记忆","直接记忆","工作记忆","长时记忆"],"answer":"C","explanation":"工作记忆可以将储存在长时记忆中的信息提取出来解决当前问题。"},{"id":"2-2-19","subject":"心理学","chapter":"第二章 认知过程","number":19,"stem":"短时记忆容量有限，为了使其包含更多的信息，可采用的方式是( )","options":["感觉登记","注意","组块","复述"],"answer":"C","explanation":"组块策略就是将零散的构件组成有意义的单元。从信息加工的角度来看，组块是人对信息进行组织或再编码。可以说，要想增加阅读的容量，提高阅读教学的信息加工效率，组块是关键。"},{"id":"2-2-20","subject":"心理学","chapter":"第二章 认知过程","number":20,"stem":"信息保持在1分钟以上乃至终生，经过复习转化来的记忆称为( )。","options":["瞬时记忆","短时记忆","长时记忆","感觉登记"],"answer":"C","explanation":"瞬时记忆又叫感觉记忆，保持时间不超过一秒钟。短时记忆指保持在一分钟之内的记忆。长时记忆指学习过的材料在人脑中保持一分钟以上乃至终生的记忆。"},{"id":"2-2-21","subject":"心理学","chapter":"第二章 认知过程","number":21,"stem":"以经历过的运动或动作为内容的记忆称为( )。","options":["形象记忆","逻辑记忆","情绪记忆","动作记忆"],"answer":"D","explanation":"A形象记忆是以感知过的事物形象为内容的记忆。B逻辑记忆是以语词、概念、原理为内容的记忆。C情绪记忆是以体验过的某种情绪和情感为内容的记忆。"},{"id":"2-2-22","subject":"心理学","chapter":"第二章 认知过程","number":22,"stem":"有预定目的，而又自觉地运用方法的识记是( )。","options":["有意识记","无意识记","意义识记","机械识记"],"answer":"A","explanation":"题干是有意识记的概念。B无意识记是无特定的记忆目的和任务，也不采用专门的记忆方法 ，自然而然地记住某一事物，留下痕迹的记忆。C意义识记是根据事物内部联系，反复领会、理解，揭示其实际意义的记忆。D机械记忆是根据事物外部联系，机械重复，死记硬背的记忆。"},{"id":"2-2-23","subject":"心理学","chapter":"第二章 认知过程","number":23,"stem":"根据材料的外部联系，采取简单重复的方式进行的识记叫( )。","options":["有意识记","无意识记","意义识记","机械识记"],"answer":"D","explanation":"机械记忆是根据事物外部联系，机械重复，死记硬背的记忆。"},{"id":"2-2-24","subject":"心理学","chapter":"第二章 认知过程","number":24,"stem":"有研究表明，学习熟练程度达到( )左右时，记忆效果最好。","options":["80%","100%","120%","150%"],"answer":"D","explanation":"一般来说，过度学习越多，保持效果越好。而且保持的时间越长。但也并非越多越好，有研究表明，学习熟练程度达到150%左右时，记忆效果最好；超过150%时，效果不仅不递增，反而可能引起疲倦、疲劳等，从而成为无效劳动。"},{"id":"2-2-25","subject":"心理学","chapter":"第二章 认知过程","number":25,"stem":"根据过度学习的研究，如果小学生读4遍后能够完整背诵一首诗，要想达到最佳记忆效果，还应再背诵( )","options":["2遍","4遍","6遍","8遍"],"answer":"A","explanation":"一般说来，学习程度以150%为佳，其效应也最大。"},{"id":"2-2-26","subject":"心理学","chapter":"第二章 认知过程","number":26,"stem":"感知过的事物或对象再度出现时，人能够识别出来称为( )。","options":["再认","回忆","表象","想象"],"answer":"A","explanation":"对曾经感知过的事物再度感知的时候，觉得熟悉，认得它是从前感知过的，叫做再认。"},{"id":"2-2-27","subject":"心理学","chapter":"第二章 认知过程","number":27,"stem":"校庆时两位老同学相会，虽然叫不出名字，但彼此能认识，此时的记忆活动主要是（ ）。","options":["回忆","再认","识记","保持"],"answer":"B","explanation":"对曾经感知过的事物再度感知的时候，觉得熟悉，认得它是从前感知过的，叫做再认。"},{"id":"2-2-28","subject":"心理学","chapter":"第二章 认知过程","number":28,"stem":"无意义音节的首创者和遗忘曲线的最先提出者是( )。","options":["巴甫洛夫","艾宾浩斯","弗洛依德","冯特"],"answer":"B","explanation":"德国心理学家艾宾浩斯1885年用单音节制作的记忆实验材料，每个音节包括3个外文字母。第1个和第3个都是辅音，中间是元音，这3个字母的组合以在德语字典中查不到为准，因此称作无意义音节。"},{"id":"2-2-29","subject":"心理学","chapter":"第二章 认知过程","number":29,"stem":"遗忘的规律是( )。","options":["进程均衡","先慢后快","先快后慢","先少后多"],"answer":"C","explanation":"德国心理学家艾宾浩斯研究发现，遗忘在学习之后立即开始，而且遗忘是进程并不是均匀的。最初遗忘速度很快，以后逐渐缓慢，并根据他的实验结果绘成描述遗忘进程的曲线，即著名的艾宾浩斯记忆遗忘曲线。"},{"id":"2-2-30","subject":"心理学","chapter":"第二章 认知过程","number":30,"stem":"对遗忘原因的一种最古老的解释理论是（ ）","options":["痕迹衰退说","干扰说","同化说","动机说"],"answer":"A","explanation":"痕迹衰退说是对遗忘原因的最古老的解释。按照这种理论，遗忘是由记忆痕迹衰退引起的，消退随时间的推移自动发生。它源于亚里士多德，由桑代克进一步发展。"},{"id":"2-2-31","subject":"心理学","chapter":"第二章 认知过程","number":31,"stem":"现代认知心理学认为，知识不能回忆或再认的原因主要是（ ）","options":["无适当提取线索","信息相互干扰","痕迹消退","信息相互覆盖"],"answer":"A","explanation":"现代认知心理学认为，无适当提取线索是知识不能回忆或再认的主要原因。"},{"id":"2-2-32","subject":"心理学","chapter":"第二章 认知过程","number":32,"stem":"遗忘就其实质来说，是知识的组织与认知结构简化的过程，这一遗忘理论是( )","options":["痕迹衰退说","干扰说","同化说","动机说"],"answer":"C","explanation":"同化说认为遗忘是学习到更高级的概念与规律以后，高级的可代替低级的，使低级的观念遗忘，从而简化知识，减轻记忆量，是积极的遗忘，相反，若巩固原有知识导致新旧知识混淆，导致记忆错误，是消极的遗忘。"},{"id":"2-2-33","subject":"心理学","chapter":"第二章 认知过程","number":33,"stem":"动机遗忘理论是由（ ）提出的。","options":["艾宾浩斯","奥苏伯尔","班杜拉","弗洛伊德"],"answer":"D","explanation":"动机遗忘理论源于弗洛伊德的精神分析，他认为由于一些记忆会让自己内心感觉痛苦，所以潜意识会把这些记忆排除在外，以避免自己受到这种困扰。"},{"id":"2-2-34","subject":"心理学","chapter":"第二章 认知过程","number":34,"stem":"小孩子边搭积木边思考，这属于（ ）。","options":["直觉思维","直观动作思维","形象思维","抽象思维"],"answer":"B","explanation":"动作陪伴思考，动作停止后思维也停止了，是一种初级的思维。"},{"id":"2-2-35","subject":"心理学","chapter":"第二章 认知过程","number":35,"stem":"尽可能多地说出\"砖\"的不同用途，这主要属于（ ）。","options":["发散思维","聚合思维","直觉思维","分析思维"],"answer":"A","explanation":"发散思维又称求异思维、辐射思维，是指从一个目标出发，沿着各种不同的途径去思考，探求多种答案的思维，与聚合思维相对。"},{"id":"2-2-36","subject":"心理学","chapter":"第二章 认知过程","number":36,"stem":"提问者要求列举木材的用途。回答可能是：桌椅材料.做成艺术品.筷子等等，这种寻求答案的思维方式是（ ）","options":["抽象思维","联想思维","发散思维","逻辑思维"],"answer":"C","explanation":"发散思维又称求异思维、辐射思维，是指从一个目标出发，沿着各种不同的途径去思考，探求多种答案的思维，故本题选C。"},{"id":"2-2-37","subject":"心理学","chapter":"第二章 认知过程","number":37,"stem":"聚合思维又称为（ ）。","options":["形象思维","抽象思维","求同思维","求异思维"],"answer":"C","explanation":"聚合思维又称为求同思维、集中思维、辐合思维和同一思维等。"},{"id":"2-2-38","subject":"心理学","chapter":"第二章 认知过程","number":38,"stem":"一个人面对问题情境时，能独具匠心，想出不同寻常的.超越自己也超越同辈的新奇性意见，表明其思维具有（ ）","options":["变通性","独创性","流畅性","指向性"],"answer":"B","explanation":"思维的独创性是指一个人面对问题情境时，能独具匠心，想出不同寻常的、超越自己也超越同辈的新奇性意见。"},{"id":"2-2-39","subject":"心理学","chapter":"第二章 认知过程","number":39,"stem":"以下说法中正确的是 ( )","options":["在学校教学条件下，儿童掌握概念的主要方式是概念形成","思维过程的基本操作是分析和综合","思维的基本形式是比较.抽象和具体化","根据思维探索答案方向的不同，思维可分为感性思维和理性思维"],"answer":"B","explanation":"A项，在学校教学条件下，儿童掌握概念的主要方式是命题学习。C项，思维的基本形式是比较、抽象和概括。D项，根据思维探索答案方向的不同，思维可分为辐合思维和发散思维。"},{"id":"2-2-40","subject":"心理学","chapter":"第二章 认知过程","number":40,"stem":"（ ）是思维的基本过程","options":["抽象与概括","比较与分类","分析与综合","系统化与具体化"],"answer":"C","explanation":"思维的过程是人们运用概念，判断，推理的形式对外界信息不断进行分析，综合，比较，抽象，概括的过程。分析与综合是思维的最基本过程，抽象与概括是思维的重要过程。"},{"id":"2-2-41","subject":"心理学","chapter":"第二章 认知过程","number":41,"stem":"根据吉尔福特的观点，发散思维的三个特征是（ ）。","options":["流畅性.应用性.灵活性","流畅性.变通性.独特性","整体性.具体性.灵活性","变通性.独特性.可操作性"],"answer":"B","explanation":"发散思维的三个特征是：⑴流畅性。是指能产生大量念头的能力特征。⑵变通性。是指改变思维方向的能力特征。⑶独特性。是指能够产生不同寻常的新念头的能力特征。"},{"id":"2-2-42","subject":"心理学","chapter":"第二章 认知过程","number":42,"stem":"创造性是指个体产生新奇、独特，有社会价值的产品的（ ）","options":["思维突破","思维创新","能力或特性","能力或经验"],"answer":"C","explanation":"此题考查创新性的定义。"},{"id":"2-2-43","subject":"心理学","chapter":"第二章 认知过程","number":43,"stem":"创造性思维的核心是（ ）","options":["创新性思维","发散性思维","逻辑性思维","想象思维"],"answer":"B","explanation":"发散思维又称求异思维、辐射思维，是指从一个目标出发，沿着各种不同的途径去思考，探求多种答案的思维，与聚合思维相对。不少心理学家认为，发散思维是创造性思维的最主要的特点，是测定创造力的主要标志之一。"},{"id":"2-2-44","subject":"心理学","chapter":"第二章 认知过程","number":44,"stem":"问题解决的首要环节是（ ）","options":["提出假设","检验假设","发现和提出问题","分析和明确问题"],"answer":"C","explanation":"问题解决的过程包括发现和提出问题、理解问题、提出假设和检验假设，其中发现和提出问题是解决问题的首要环节。"},{"id":"2-2-45","subject":"心理学","chapter":"第二章 认知过程","number":45,"stem":"一般性解决问题阶段的第三阶段是（ ）","options":["提出假设","分析问题","检验假设","发现问题"],"answer":"A","explanation":"问题解决的过程包括发现和提出问题、理解问题、提出假设和检验假设。"},{"id":"2-2-46","subject":"心理学","chapter":"第二章 认知过程","number":46,"stem":"下列不属于问题解决的认知操作的一类是( )","options":["回忆","分析","联想","比较"],"answer":"A","explanation":"问题解决包含一系列的心理活动，即认知操作，如分析、联想、比较、推论等。仅仅是简单的记忆提取等单一的认知活动，都不能称之为问题解决，排除A。"},{"id":"2-2-47","subject":"心理学","chapter":"第二章 认知过程","number":47,"stem":"有关审题的研究发现，对问题加以分析的程度与解决问题所需时间之间的相关在( )以上。","options":["0.75","O.85","0.95","1.00"],"answer":"A","explanation":"对问题加以分析的程度与解决问题所需时间之间的相关在0、75 以上。"},{"id":"2-2-48","subject":"心理学","chapter":"第二章 认知过程","number":48,"stem":"（ ）是给定信息和要达到的目标之间有某些障碍需要被克服的刺激情境。","options":["疑问","限制","创造","问题"],"answer":"D","explanation":"此题考查问题的定义：给定信息和要达到的目标之间有某些障碍需要被克服的刺激情境。"},{"id":"2-2-49","subject":"心理学","chapter":"第二章 认知过程","number":49,"stem":"创设问题情境的核心是( )","options":["熟悉教材","了解学生","实施启发式教学","多种形式创设问题情境并贯穿始终"],"answer":"B","explanation":"创设问题必须首先了解学生，从学生的经验和已有知识出发。"},{"id":"2-2-50","subject":"心理学","chapter":"第二章 认知过程","number":50,"stem":"在解决问题过程中，对解答问题有启示作用的相类似的事物叫( )。","options":["定势","功能固着","原型","问题情境"],"answer":"C","explanation":"A定势是指重复先前的心理操作所引起的对活动的准备状态 。B功能固着是指人们把某种功能赋予某种物体的倾向，认定原有的行为就不会再去考虑其他方面的作用。 D问题情境是指教师有目的的、有意识地创设的各种情境，以促使学生去质疑问难、探索求解。"},{"id":"2-2-51","subject":"心理学","chapter":"第二章 认知过程","number":51,"stem":"鲁班借助丝茅草划破手这一现象发明了锯，这类创造活动的主要心理影响机制是（ ）","options":["功能固着","迁移","定势","原型启发"],"answer":"D","explanation":"在问题解决过程中，问题解决者在“原型”中获得一些原理的启发，使其结合当前问题的有关知识，形成解决方案，从而创造性地解决问题，这类心理影响机制是原型启发。"},{"id":"2-2-52","subject":"心理学","chapter":"第二章 认知过程","number":52,"stem":"由于看到鸟的飞翔而发明了飞机，这类创造活动的主要心理影响机制是( )","options":["原型启发","功能固着","负向迁移","定势影响"],"answer":"A","explanation":"原型启发意指根据事物的本质特征而产生新的设想和创意。问题解决者在“原型”中获得一些原理的启发，使其结合当前问题的有关知识，形成解决方案，从而创造性的解决问题。"},{"id":"2-2-53","subject":"心理学","chapter":"第二章 认知过程","number":53,"stem":"受先前活动影响而产生的心理活动的特殊准备状态称为（ ）","options":["定势","功能固着","原型启发","迁移"],"answer":"A","explanation":"此题考查定势的定义。"},{"id":"2-2-54","subject":"心理学","chapter":"第二章 认知过程","number":54,"stem":"某人对某种制品的用途总是有一种惯常的固定模式，很难想到它的其他用途，这在心理学上称为（ ）","options":["定势","功能固着","认知态度","顿悟"],"answer":"B","explanation":"定势是在解决问题过程中心理活动的一种准备状态。功能固着是个体在解决问题时只看到某些事物的通常功能，而看不到它的其他方面的功能。依据题目要求，选B。"},{"id":"2-2-55","subject":"心理学","chapter":"第二章 认知过程","number":55,"stem":"人们一般采用通常采用（ ）方法解决问题。","options":["算法式与启发式","手段—目的分析法与爬山法","目标递进与目标递归","讲座式与算法式"],"answer":"A","explanation":"在寻求解答时，可能存在这样两种一般的途径：算法式和启发式。"},{"id":"2-2-56","subject":"心理学","chapter":"第二章 认知过程","number":56,"stem":"把解决问题的所有可能方案都列出来，逐一尝试的假设方法为（ ）方法。","options":["推理式","启发式","算法式","演绎式"],"answer":"C","explanation":"此题考查算法式的定义。算法式是把解决问题的一切做法步骤都列出来，然后逐一加以尝试，最终使问题得到一个正确的解。若用穷尽一切可能的步骤去尝试，很费时间，但可以保证成功。"},{"id":"2-2-57","subject":"心理学","chapter":"第二章 认知过程","number":57,"stem":"能保证成功地解决问题，但却费时费力的方法是（ ）","options":["算法式","启发式","手段—目的分析法","爬山法"],"answer":"A","explanation":"算法式是把解决问题的一切做法步骤都列出来，然后逐一加以尝试，最终使问题得到一个正确的解。算法是有规则的，有固定的运算步骤。若用穷尽一切可能的步骤去尝试，很费时间，但可以保证成功。"},{"id":"2-2-58","subject":"心理学","chapter":"第二章 认知过程","number":58,"stem":"将所有可能的针对问题解决的方法都一一列举出来并进行尝试是（ ）。","options":["手段-目的分析法","算法策略","爬山法","逆推法"],"answer":"B","explanation":"算法策略就是在问题空间中随机搜索所有可能的解决问题的方法，直至选择一种有效的方法解决问题。"},{"id":"2-2-59","subject":"心理学","chapter":"第二章 认知过程","number":59,"stem":"根据经验或直觉选择解法的假设方式称为（ ）方法","options":["算法式","推理式","启发式","爬山法"],"answer":"C","explanation":"启发式即依据经验和直觉选择解法，它可以迅速地解决问题，但不排除失败的可能。"},{"id":"2-2-60","subject":"心理学","chapter":"第二章 认知过程","number":60,"stem":"把大的目标状态分成一个一个的小目标，然后进行算子搜索是（ ）方法","options":["算法式","手段—目的分析法","目标递进策略","爬山法"],"answer":"B","explanation":"手段一目的分析法是指把大的目标状态分成一个一个的小目标。然后进行算子搜索。算子是指在思维中用以指导进行操作的计划和方法。其目的在于减少当前的问题状态与目标状态之间的差异。"},{"id":"2-2-61","subject":"心理学","chapter":"第二章 认知过程","number":61,"stem":"先有一个目标(目的)，它与当前的状态之间存在着差异，人们认识到这个差异，就要想出某种办法采取活动(手段)来减小这个差异。这种解决问题的方法或策略( )","options":["爬山法","逆向工作法","手段—目的分析法","尝试错误法"],"answer":"C","explanation":"采用手段-目的分析法解决问题时首先要确定目标，然后考虑要达到这一目标，先要实现什么子目标，再考虑要达到该子目标，又必须先实现什么子目标，由此类推下去。当所有的子目标都达到了效果时，问题也就解决了。"},{"id":"2-2-62","subject":"心理学","chapter":"第二章 认知过程","number":62,"stem":"不断明确当前状态与目标状态之间的差距，并不断通过一定的运算操作来缩减这种差 距，从而找到实现目标的方法是( )。","options":["问题类比","“手段一目的”分析","问题分解","想法"],"answer":"B","explanation":"“手段一目的”分析是指不断明确当前状态与目标状态之间的差距， 并不断通过一定的运算操作来缩减这种差距，从而找到实现目标的方法。"},{"id":"2-2-63","subject":"心理学","chapter":"第二章 认知过程","number":63,"stem":"常常用于证明几何题的反证法，实际上是（ ）","options":["算法式","爬山法","目标递进策略","目标递归策略"],"answer":"D","explanation":"几何证明中的反证法实际上就是问题解决中的目标递归策略，也称为逆向工作法，这种策略常用于证明几何题，故选D。"},{"id":"2-2-64","subject":"心理学","chapter":"第二章 认知过程","number":64,"stem":"从目标状态出发，按照子目标组成的逻辑顺序逐级向初始状态递归，这种解决问题的方法是（ ）","options":["爬山法","手段—目的分析法","逆向工作法","尝试法"],"answer":"C","explanation":"爬山法：经过评价当前的问题状态后，限于条件，不是去缩小，而是去增加这一状态与目标状态的差异，经过迂回前进，最终达到解决问题的总目标。逆向工作法：目标递归策略，从目标状态出发，按照子目标组成的逻辑顺序逐级向初始状态递归。"},{"id":"2-2-65","subject":"心理学","chapter":"第二章 认知过程","number":65,"stem":"梦属于一种（ ）。","options":["无意想象","有意想象","记忆表象","再造想象"],"answer":"A","explanation":"梦是在人睡眠状态下产生的一种漫无目的、不由自主的奇异的想象，它是无意想象的最极端的例子。"},{"id":"2-2-66","subject":"心理学","chapter":"第二章 认知过程","number":66,"stem":"根据言语描述或图形描绘，在人脑中产生新形象的过程是（ ）。","options":["思维","表象","再造想象","创造想象"],"answer":"C","explanation":"思维是在表象、概念的基础上进行分析、综合、判断、推理等认识活动的过程。B 表象是事物不在面前时，人们在头脑中出现的关于事物的形象。D创造想象是在创造活动中，根据一定的目的、任务，在人脑中独立地创造出新形象的过程。"},{"id":"2-2-67","subject":"心理学","chapter":"第二章 认知过程","number":67,"stem":"艺术家创作时的构想活动主要是（ ）。","options":["无意想象","记忆表象","再造想象","创造想象"],"answer":"D","explanation":"艺术家进行创作是根据一定的目的任务，在其脑中独立地创造出新形象。"},{"id":"2-2-68","subject":"心理学","chapter":"第二章 认知过程","number":68,"stem":"一种与生活愿望相结合并指向未来的想象是（ ）。","options":["表象","联想","做梦","幻想"],"answer":"D","explanation":"幻想是一种与生活愿望相结合并指向于未来的想象，它所创造的是人类所期望的未来的事物形象。"},{"id":"2-3-1","subject":"心理学","chapter":"第三章 情感和意志过程","number":1,"stem":"情绪和情感是人对客观事物是否符合自己的( )而产生的态度的体验。","options":["个性","需要","兴趣","自我概念"],"answer":"B","explanation":"此题考查情感和情绪的定义。"},{"id":"2-3-2","subject":"心理学","chapter":"第三章 情感和意志过程","number":2,"stem":"情绪反映的是( )","options":["客观事物的本质属性","客观事物的外部现象","客观事物之间的关系","客观事物与人的需要之间的关系"],"answer":"D","explanation":"需要是引发情绪情感的中介.那些满足人们需要的事物和对象，能引起各种肯定的态度，使人产生满意、愉快的情绪体验.不同的态度体验反映着客观事物与人的需要之间的不同关系。"},{"id":"2-3-3","subject":"心理学","chapter":"第三章 情感和意志过程","number":3,"stem":"( )是人和动物都具有的。","options":["情绪","情感","道德感","理智感"],"answer":"A","explanation":"情绪是人和动物共有的，但只有人才会有情感、道德感、理智感。"},{"id":"2-3-4","subject":"心理学","chapter":"第三章 情感和意志过程","number":4,"stem":"测谎仪的使用原理主要是( )","options":["情绪情感是一种主观体验","人在情绪反应时,常常伴随一定的生理唤醒","情绪产生时,伴随外部表现","情绪情感是一种自我察觉"],"answer":"B","explanation":"测谎仪是一种记录多项生理反应的仪器，一定的情绪状态`总伴有内脏器官、内分泌腺或神经系统的生理变化，情绪状态产生时的生理反应称为生理唤醒.因此答案选C项。"},{"id":"2-3-5","subject":"心理学","chapter":"第三章 情感和意志过程","number":5,"stem":"有爱就有恨,有喜悦就有悲伤,有紧张就有轻松。这说明情绪和情感( )","options":["具有两极对立性","具有不可调和性","其两极是不相容的","其两极是绝对对立的"],"answer":"A","explanation":"情绪和情感的两极性是指每一种情绪和情感都能找到与之对立的情绪和情感。"},{"id":"2-3-6","subject":"心理学","chapter":"第三章 情感和意志过程","number":6,"stem":"从发生早晚的角度看情绪与情感的差异,下列说法正确的是( )","options":["情绪发生早,情感产生晚","情绪发生晚,情感产生早","情绪情感同时产生","情绪情感都是与生俱来的"],"answer":"A","explanation":"情感依赖于情绪.人的情感是在大量情绪体验的基础上形成和发展起来的，也是通过情绪表达出来的。"},{"id":"2-3-7","subject":"心理学","chapter":"第三章 情感和意志过程","number":7,"stem":"情绪状态划分的主要依据是( )","options":["强度.速度.紧张度.持续性","需要.动机.社会性.感染性","时间.信念.外显性.敏感性","动机.时间.内隐性.感染性"],"answer":"A","explanation":"依据情绪发生的强度、持续性和紧张度的不同，可以把情绪状态划分为情调、心境、激情、应激和热情五种。"},{"id":"2-3-8","subject":"心理学","chapter":"第三章 情感和意志过程","number":8,"stem":"强度较小.持续时间较长的情绪状态是( )。","options":["心境","激情","应激","情感"],"answer":"A","explanation":"心境是一种微弱的，持久而又有弥散性的情绪体验状态。激情是一种强烈的，爆发式的，持续时间较短的情绪状态，具有明显的生理反应和外部行为表现。应激是在出现意外事件或遇到危险情景时出现的高度紧张的情绪状态。情感则具有深刻性和稳定性。"},{"id":"2-3-9","subject":"心理学","chapter":"第三章 情感和意志过程","number":9,"stem":"具有感染性的，比较平稳而相对持久的情绪状态是( )","options":["热情","心境","激情","应激"],"answer":"B","explanation":"心境是指强度较低但持续时间较长的情感，它是一种微弱、平静而持久的情感，如绵绵柔情、闷闷不乐、耿耿于怀等。"},{"id":"2-3-10","subject":"心理学","chapter":"第三章 情感和意志过程","number":10,"stem":"“积极的心态像太阳，照到哪里哪里亮；消极的心态像月亮,初一十五不一样。”这属于( )","options":["心境","激情","应激","热情"],"answer":"A","explanation":"心境是一种微弱的、持续时间较长的，带有弥漫性的情绪状态.心境一经产生就不只表现在某一特定对象上，而是在相当长的一段时间内，使人的整个心理活动都染上某种情绪色彩，影响人的整个行为表现，成为情绪生活的背景。"},{"id":"2-3-11","subject":"心理学","chapter":"第三章 情感和意志过程","number":11,"stem":"“易感情用事”一般发生在( )情绪状态下。","options":["心境","紧张","激情","应激"],"answer":"C","explanation":"激情是一种爆发式的、猛烈而时间短暂的情绪状态.激情发生时，意识范围缩小，意识对行为的控制作用明显降低，理解力降低，判断力减弱，易感情用事，不考虑后果。"},{"id":"2-3-12","subject":"心理学","chapter":"第三章 情感和意志过程","number":12,"stem":"由意外的紧急情况引起的情绪状态是( )。","options":["心境","激情","应激","情感"],"answer":"C","explanation":"应激是指在意外的紧急情况下所产生的适应性反应， 故选C。"},{"id":"2-3-13","subject":"心理学","chapter":"第三章 情感和意志过程","number":13,"stem":"好奇心和成就感属于情感中的( )","options":["美感","道德感","理智感","荣誉感"],"answer":"C","explanation":"理智感是人认识事物和探求真理的需要是否得到满足而产生的主观体验.例如，人们在探求未知的事物时所表现的求知欲、认识兴趣和好奇心，发现问题的惊奇感、问题解决的喜悦感、为真理献身的自豪感、问题不解的苦闷感等。"},{"id":"2-3-14","subject":"心理学","chapter":"第三章 情感和意志过程","number":14,"stem":"学到知识之后产生的喜悦和满足感属于( )。","options":["理智感","道德感","美感","是非感"],"answer":"A","explanation":"理智感是在智力活动中，认识和评价事物时所产生的情感体验。例如，人们在探索未知事物时表现出的兴趣、好奇心和求知欲，问题得以解决并有新的发现时的喜悦感和幸福感。"},{"id":"2-3-15","subject":"心理学","chapter":"第三章 情感和意志过程","number":15,"stem":"列宁说，没有人的情感就从来没有也不可能有人们对真理的追求。这种情感是( )","options":["道德感","美感","理智感","责任感"],"answer":"C","explanation":"理智感是人认识事物和探求真理的需要是否得到满足而产生的主观体验。"},{"id":"2-3-16","subject":"心理学","chapter":"第三章 情感和意志过程","number":16,"stem":"帮助了他人觉得高兴，这属于哪种情感？( )","options":["理智感","道德感","美感","荣誉感"],"answer":"B","explanation":"道德感是一种高级情感。同情、反感、眷恋、疏远、尊敬、轻视、感激、爱、憎、背信弃义等属于道德感。"},{"id":"2-3-17","subject":"心理学","chapter":"第三章 情感和意志过程","number":17,"stem":"“义务感.责任感.荣誉感”是情感中的( )","options":["道德感","美感","理智感","喜悦感"],"answer":"A","explanation":"道德感是根据一定的道德标准评价人的思想、意图和言行时所产生的主观体验.它表现在对待国家、集体、工作、事业、学习以及人与人之间的关系等各个方面，如爱国主义情感、集体主义情感、责任感、事业心、荣誉感、自尊心等。"},{"id":"2-3-18","subject":"心理学","chapter":"第三章 情感和意志过程","number":18,"stem":"对优美的自然风景的欣赏,对良好社会品行的赞美属于( )","options":["美感","道德感","理智感","激情"],"answer":"A","explanation":"美感是人们根据一定的审美标准对自然或社会现象及其在艺术上的表现予以评价时所产生的情感体验。"},{"id":"2-3-19","subject":"心理学","chapter":"第三章 情感和意志过程","number":19,"stem":"课堂教学中,教师以点头.轻拍肩膀来表示赞赏的交流方式体现了情感的( )功能。","options":["调节功能","传递功能","信号功能","感染功能"],"answer":"C","explanation":"情绪和情感在人际间具有传递信`息、沟通思想的功能.情绪的信号功能体现在个体将自己的愿望、要求、观点、态度通过一定的情感表达方式传递给别人并加以影响.这是情绪的信号功能。"},{"id":"2-3-20","subject":"心理学","chapter":"第三章 情感和意志过程","number":20,"stem":"“富贵不能淫,威武不能屈”是意志( )品质的表现。","options":["自觉性","果断性","自制性","坚韧性"],"answer":"D","explanation":"意志的坚韧性是一个人在行动中坚持决定，百折不挠地克服重重困难去达到行动目的的。"},{"id":"2-3-21","subject":"心理学","chapter":"第三章 情感和意志过程","number":21,"stem":"与动摇性和执拗性相反的意志品质是( )","options":["自觉性","果断性","坚韧性","自制性"],"answer":"C","explanation":"意志的坚韧性是一个人在行动中坚持决定，百折不挠地克服重重困难去达到行动目的的品质.坚持是对行动目的的坚持.与坚韧性相反的意志品质是动摇性和执拗性.具有动摇性的人或缺乏坚定的行动目的，对既定的目的持怀疑态度，或对实现目的缺乏信心和决心.具有执拗性的人不能根据形势的变化而灵活调整自己的思想行为。"},{"id":"2-3-22","subject":"心理学","chapter":"第三章 情感和意志过程","number":22,"stem":"魏征曾对唐太宗李世民说:“嗜欲喜怒之情,贤愚皆同,贤者能节之,不使过度,愚者纵之,每至所失。”这说的是意志的( )","options":["自制性","果断性","坚韧性","自觉性"],"answer":"A","explanation":"意志的自制性是一个人善于控制和支配自己的情绪，约束自己言行的品质。题干中的“节之”“纵之”说的是一个人是否善于控制自己，约束自己。"},{"id":"2-3-23","subject":"心理学","chapter":"第三章 情感和意志过程","number":23,"stem":"下列活动属于意志行动的是( )","options":["吹口哨","背诵课文","摇头晃脑","膝跳反射"],"answer":"B","explanation":"意志是指人自觉地确定目的，有意识地根据目的、动机调节支配行动，努力克服困难，实现目标的心理过程.背诵课文强调克服困难，需要人的积极控制能力；吹口哨和摇头晃脑都不需要意志努力；膝跳反射是本能行为。"},{"id":"2-3-24","subject":"心理学","chapter":"第三章 情感和意志过程","number":24,"stem":"袁老师中途接手小学主年级三班的班主任工作,有几个学生经常缺交数学作业,经过了解发现,只要题目难一点或计算量大一点,这几个学生就不能按时完成作业,不仅如此,在各项活动中也有一些同学叫苦叫累。如果你是班主任的话,会在全班进行( )","options":["积极的情感教育","意志品质的培养","人际交往教育","良好性格教育"],"answer":"B","explanation":"学生畏难退缩，是缺乏意志力的表现。"},{"id":"2-4-1","subject":"心理学","chapter":"第四章人格心理","number":1,"stem":"气质概念的最早提出者是( )。","options":["亚里斯多德","希波克拉底","柏拉图","克瑞奇米尔"],"answer":"B","explanation":"最早对气质加以分类并给予细致的描述，其分类被后人接受认可的，是希波克拉底对气质的分类。"},{"id":"2-4-2","subject":"心理学","chapter":"第四章人格心理","number":2,"stem":"某学生活泼.好动.乐观.灵活，喜欢交朋友，爱好广泛，稳定性差，缺少毅力，见异思迁。他的气质类型属于( )","options":["多血质","胆汁质","粘液质","抑郁质"],"answer":"A","explanation":"多血质的人表现出这样的特点：容易形成有朝气、热情、活泼、爱交际、有同情心、思想灵活等品质；也容易出现变化无常、粗枝大叶、浮躁、缺乏一贯性等特点。这种人活泼、好动、敏感、反应迅速、喜欢与人交往、注意力容易转移、兴趣和情感易变换等等。"},{"id":"2-4-3","subject":"心理学","chapter":"第四章人格心理","number":3,"stem":"某人安静沉稳.寡言少语.反应缓慢.情绪不外露.注意稳定不易转移，他是属于哪种气质类型？( )","options":["胆汁质","多血质","粘液质","抑郁质"],"answer":"C","explanation":"粘液质的心理特点：稳重，考虑问题全面；安静，沉默，善于克制自己；善于忍耐。情绪不易外露；注意力稳定而不容易转移，外部动作少而缓慢。"},{"id":"2-4-4","subject":"心理学","chapter":"第四章人格心理","number":4,"stem":"小张是一个多愁善感.孤僻内向的人，即使遇到一些小事情，也会产生深刻的情绪体验。他的气质类型是","options":["多血质","胆汁质","抑郁质","黏液质"],"answer":"C","explanation":"抑郁质的人神经类型属于弱型，他们体验情绪的方式较少，稳定的情感产生也很慢，但对情感的体验深刻、有力、持久，而且具有高度的情绪易感性。"},{"id":"2-4-5","subject":"心理学","chapter":"第四章人格心理","number":5,"stem":"胆汁质的人的神经类型是( )。","options":["强而不平衡型","强、平衡、灵活型","强、平衡、不灵活型","弱型"],"answer":"A","explanation":"胆汁质的特点是情感发生迅速、强烈、持久，动作的发生也是迅速、强烈、有力。属于这一类型的人都热情，直爽，精力旺盛，脾气急躁，心境变化剧烈，易动感情，具有外倾性。"},{"id":"2-4-6","subject":"心理学","chapter":"第四章人格心理","number":6,"stem":"抑郁质的人的神经类型是( )。","options":["强而不平衡型","强、平衡、灵活型","强、平衡、不灵活型","弱型"],"answer":"D","explanation":"抑郁质的人神经类型属于弱型，他们体验情绪的方式较少，稳定的情感产生也很慢，但对情感的体验深刻、有力、持久，而且具有高度的情绪易感性。"},{"id":"2-4-7","subject":"心理学","chapter":"第四章人格心理","number":7,"stem":"( )受生理影响大。","options":["性格","气质","动机","需要"],"answer":"B","explanation":"气质受生理影响大，性格、动机、需要受社会影响大。"},{"id":"2-4-8","subject":"心理学","chapter":"第四章人格心理","number":8,"stem":"某人善于思考.头脑冷静.常用理智来控制感情与行为，这属于哪种性格类型？( )","options":["意志型","理智型","情绪型","胆汁型"],"answer":"B","explanation":"理智型性格的人冷静，机智，分析力强，好学不倦，善于思考，有理性地去处理问题并将情感控制。"},{"id":"2-4-9","subject":"心理学","chapter":"第四章人格心理","number":9,"stem":"个性倾向性的基础是( )。","options":["动机","兴趣","需要","信念"],"answer":"C","explanation":"个性倾向性由需要、动机、兴趣、信念和世界观等多种心理成分组成，其中，需要是个性倾向性的源泉和基础。"},{"id":"2-4-10","subject":"心理学","chapter":"第四章人格心理","number":10,"stem":"需要的基本特征是( )。","options":["动力性","发展性","无穷性","层次性"],"answer":"A","explanation":"需要具有对象性、动力性、独特性、社会性、指向性。"},{"id":"2-4-11","subject":"心理学","chapter":"第四章人格心理","number":11,"stem":"提出需要层次理论的是美国人本主义心理学家（ ）","options":["斯金纳","洛厄尔","马斯洛","瓦拉斯"],"answer":"C","explanation":"马斯洛需求层次理论是行为科学的理论之一，由美国心理学家马斯洛于1943年提出，人类需求象阶梯一样从低到高按层次分为五种，分别是：生理需求、安全需求、社交需求、尊重需求和自我实现需求五类，是行为科学理论之一。"},{"id":"2-4-12","subject":"心理学","chapter":"第四章人格心理","number":12,"stem":"儿童爱看连环画.爱听故事并好问“为什么”，这是儿童的( )。","options":["生理需要","安全需要","成就需要","认识需要"],"answer":"D","explanation":"生理上的需要是人们最原始、最基本的需要，如空气、水、吃饭、穿衣等。"},{"id":"2-4-13","subject":"心理学","chapter":"第四章人格心理","number":13,"stem":"希望得到他人的关心和认可并获得一定的地位，这是人的 ( )","options":["生理的需要","归属的需要","尊重和爱的需要","自我实现的需要"],"answer":"C","explanation":"希望得到他人的关心和认可并获得一定的地位，是人们尊重和爱的需。"},{"id":"2-4-14","subject":"心理学","chapter":"第四章人格心理","number":14,"stem":"马斯洛认为需要的最高层次是( )。","options":["安全需要","归属和爱的需要","尊重需要","自我实现"],"answer":"D","explanation":"马斯洛理论把需求分成生理需求、安全需求、爱和归属感、尊重和自我实现五类，依次由较低层次到较高层次排列。"},{"id":"2-4-15","subject":"心理学","chapter":"第四章人格心理","number":15,"stem":"( )是成长需要","options":["生理需要","安全需要","归属与爱的需要","审美需要"],"answer":"D","explanation":"人本主义心理学家马斯洛认为，人有两种植根于生物学的需要：缺失需要和成长需要。缺失需要又称基本需要，基本需要的满足比成长需要更迫切，基本需要按照力量的大小排列为：生理需要、安全需要、归属和爱的需要以及自尊需要。只有在所有的缺失需要满足后才会出现成长需要。"},{"id":"2-4-16","subject":"心理学","chapter":"第四章人格心理","number":16,"stem":"智力就是( )。","options":["观察能力","记忆能力","一般能力","特殊能力"],"answer":"C","explanation":"一般能力就是智力，包括观察力、注意力、记忆力和想象力。它是人成功完成各种活动所必需的能力。特殊能力则是人完成某种专门活动所必需的能力。"},{"id":"2-4-17","subject":"心理学","chapter":"第四章人格心理","number":17,"stem":"下列选项中哪种是一般能力？( )","options":["观察力","曲调感","节奏感","色调感"],"answer":"A","explanation":"一般能力就是智力，包括观察力、注意力、记忆力和想象力。"},{"id":"2-4-18","subject":"心理学","chapter":"第四章人格心理","number":18,"stem":"( )是一般能力的核心","options":["创造力","观察力","记忆力","抽象概括能力"],"answer":"D","explanation":"一般能力指在不同的活动中表现出的共同的能力， 它是从事一切活动所必备的能力的综合，如观察力、 记忆力、抽象概括能力等，其中抽象概括能力是一般能力的核心。"},{"id":"2-4-19","subject":"心理学","chapter":"第四章人格心理","number":19,"stem":"通常认为，一般能力的核心成分是( )","options":["观察能力","记忆能力","思维能力","想象能力"],"answer":"C","explanation":"能力是一种基本心理特征，顺利实现某种活动的心理条件，它的核心成分是思维能力。"},{"id":"2-4-20","subject":"心理学","chapter":"第四章人格心理","number":20,"stem":"一个人智力的核心应该是( )。","options":["观察力","记忆力","想象力","思维力"],"answer":"D","explanation":"思维能力是智力的核心，是考察一个人智力素质高低的主要标志。良好的思维素质能力和思维品质，决定着人的智力发展和行为能力。"},{"id":"2-4-21","subject":"心理学","chapter":"第四章人格心理","number":21,"stem":"各种能力的完备结合成为( )。","options":["技能","才能","天才","智力"],"answer":"B","explanation":"在实践活动中，把各种能力的完备结合称之为才能。例如，教师要成功地完成教学 教学活动就必须具备教材的组织能力、逻辑思维能力、语言表达能力、敏锐的观察能力和注意分配能力等。"},{"id":"2-4-22","subject":"心理学","chapter":"第四章人格心理","number":22,"stem":"下列选项中哪种是特殊能力？( )","options":["观察力","记忆力","节奏感","注意力"],"answer":"C","explanation":"特殊能力是人完成某种专门活动所必需的能力，故选C。A、B、D属于一般能力。"},{"id":"2-4-23","subject":"心理学","chapter":"第四章人格心理","number":23,"stem":"才能的高度发展称为( )。","options":["技能","才能","天才","智力"],"answer":"C","explanation":"天才是多种能力在实践活动中最完美地结合，使人能经常地、创造性地完成一种或多种活动。"},{"id":"2-4-24","subject":"心理学","chapter":"第四章人格心理","number":24,"stem":"比奈一西蒙量表和斯坦福一比奈量表可以用来测量 ( )","options":["意志","情绪","智力","行为"],"answer":"C","explanation":"比奈一西蒙量表和斯坦福一比奈量表都是常用的智力量表。"},{"id":"2-4-25","subject":"心理学","chapter":"第四章人格心理","number":25,"stem":"智商(IQ)等于( )","options":["智力年龄与实际年龄之比乘以100","实际年龄与智力年龄之比乘以100","心理年龄与生理年龄之比乘以100","生理年龄与实际年龄之比乘以100"],"answer":"A","explanation":"智力测验中的一个重要概念是智商，简称IQ。智商等于智力年龄与实际年龄之比乘以100。"},{"id":"2-4-26","subject":"心理学","chapter":"第四章人格心理","number":26,"stem":"某生的智力年龄为10岁，实际年龄为8岁。按照斯坦福-比纳量表的智商计算公式，该生的智商为( )","options":["80","100","120","81"],"answer":"C","explanation":"按照斯坦福-比纳量表的智商计算公式智商=心理年龄/实际年龄×100，可知该生智商为120。"},{"id":"2-4-27","subject":"心理学","chapter":"第四章人格心理","number":27,"stem":"流体智力和晶体智力说是由美国心理学家( )提出来的。","options":["斯皮尔曼","卡特尔","瑟斯顿","吉尔福特"],"answer":"B","explanation":"美国心理学家卡特尔等人主张智力由两种成分构成，一种是流体智力，另一种是晶体智力。"},{"id":"2-4-28","subject":"心理学","chapter":"第四章人格心理","number":28,"stem":"( )有可能随着年龄的增长而升高。","options":["运动智力","言语智力","晶体智力","流体智力"],"answer":"C","explanation":"晶体智力在大半个成年期持续逐渐稳定地增长，直到60岁以后才开始下降；流体智力则在成年初期达到峰值，随后逐渐下降。"},{"id":"2-4-29","subject":"心理学","chapter":"第四章人格心理","number":29,"stem":"( )流体智力发展达到最高峰。","options":["少年期","成年早期","中年晚期","老年期"],"answer":"B","explanation":"晶体智力在大半个成年期持续逐渐稳定地增长，直到60岁以后才开始下降；流体智力则在成年初期达到峰值，随后逐渐下降。"},{"id":"2-4-30","subject":"心理学","chapter":"第四章人格心理","number":30,"stem":"我国古代思想家王充所说的“施用累能”是指( )","options":["学校教育对智力的影响","社会实践对智力的影响","遗传对智力的影响","家庭环境对智力的影响"],"answer":"B","explanation":"王充所说的\"施用累能\"是指社会实践对智力的影响，即能力是在使用中积累的。"},{"id":"2-4-31","subject":"心理学","chapter":"第四章人格心理","number":31,"stem":"教师对学生的错误不能持完全否定态度，更不应指责，要给予一定的肯定。这体现了在 塑造创造性的个性时要注意( )。","options":["解除个体对答错问题的恐惧心理","保护学生的好奇心","鼓励学生的独立性和创新精神","给学生提供具有创造性的榜样"],"answer":"A","explanation":"教师对学生出现的问题不应全盘否定，更不应指责，应鼓励学生正视并反思错误，引导学生尝试新的探索，而不循规蹈矩。这样才能避免学生出现“怕回答问题”、“不愿回答问题”等的现象，有利于学生充分发挥自己的想象力，提出自己的想法，从而促进其创造性个性的塑造。"},{"id":"2-4-32","subject":"心理学","chapter":"第四章人格心理","number":32,"stem":"下列关于能力发展与知识获得特点的表述，正确的是( )","options":["能力发展慢，知识获得慢","能力发展慢，知识获得快","能力发展快，知识获得快","能力发展快，知识获得慢"],"answer":"B","explanation":"知识与能力之间的转化需要具备一定的条件 知识的掌握是形成能力不可缺少的前提。但是，学生能力的发展不是在传授知识的过程中自发地进行的。认为学习了知识就自然而然地发展了能力，或有了能力就自然掌握了知识的看法都不符合实际。"},{"id":"2-5-1","subject":"心理学","chapter":"第五章 人的全程发展","number":1,"stem":"美国心理学家霍尔说：“一两的遗传胜过一吨的教育”。这种观点的实质是( )","options":["环境决定论","二因素论","遗传决定论","相互作用论"],"answer":"C","explanation":"“一两遗传胜过一吨教育”这个观点是美国教育家和心理学家霍尔提出来的，这是一种遗传决定论的观点。"},{"id":"2-5-2","subject":"心理学","chapter":"第五章 人的全程发展","number":2,"stem":"俗话说“龙生龙，凤生凤，老鼠生儿打地洞”。这是民众对( )的形象概括","options":["教育","环境","变异","遗传"],"answer":"D","explanation":"“龙生龙，凤生凤，老鼠生儿会打洞”，体现了生物亲子代之间具有相同的性状，因此体现了生物的遗传现象。"},{"id":"2-5-3","subject":"心理学","chapter":"第五章 人的全程发展","number":3,"stem":"环境决定论的代表人物是 ( )","options":["格塞尔","霍尔","高尔顿","华生"],"answer":"D","explanation":"环境决定论的代表人物主要有华生和斯基纳等。"},{"id":"2-5-4","subject":"心理学","chapter":"第五章 人的全程发展","number":4,"stem":"“给我12个体形良好的婴儿和一个由我指定的抚育他们的环境.我从这些婴儿中随机选取任何一个，保证能把他训练成我所选定的任何一类专家——医生.律师.商人和领袖人物，甚至训练成乞丐或小偷”华生这段话的实质是( )","options":["二因素论","遗传决定论","环境决定论","相互作用论"],"answer":"C","explanation":"华生是环境决定论的代表人物，他认为儿童是被动的个体，其成长决定于所处的环境。儿童成长为什么样的人，教育者负有很大的责任。"},{"id":"2-5-5","subject":"心理学","chapter":"第五章 人的全程发展","number":5,"stem":"20世纪中叶，人们发现，遗传因素和环境因素在心理发展中的作用都不可否认，只是两者间的作用不同而已，心理发展是两者的相加或相乘。这种观点属于 ( )","options":["环境决定论","二因素论","相互作用论","遗传决定论"],"answer":"B","explanation":"二因素论认为制约心理发展的因素通常可分为两类：一类是先天遗传因素和生物因素；另一类是后天环境因素和文化因素。"},{"id":"2-5-6","subject":"心理学","chapter":"第五章 人的全程发展","number":6,"stem":"20世纪30~40年代以来，多数学者认为遗传与环境在心理发展中的作用是相互依存.相互渗透的，这种心理发展观是 ( )","options":["相互作用论","遗传决定论","环境决定论","二因素论"],"answer":"A","explanation":"相互作用论是阐述个人与其环境之间相互关系的社会心理学理论。它主张人的行为是由个人因素和情境因素联合决定的。"},{"id":"2-5-7","subject":"心理学","chapter":"第五章 人的全程发展","number":7,"stem":"在一般情况下对儿童身心发展起主导作用的因素是( )。","options":["遗传素质","生理成熟","社会环境","学校教育"],"answer":"D","explanation":"教育是特殊的社会环境，在人的发展中起主导作用。"},{"id":"2-5-8","subject":"心理学","chapter":"第五章 人的全程发展","number":8,"stem":"( )教养方式容易养成儿童自私.骄傲.任性和依赖的性格特征。","options":["民主型","专制型","放任型","溺爱型"],"answer":"D","explanation":"溺爱下的孩子会形成依赖、任性、冲动、幼稚、没有恒心、不能吃苦、不能体谅别人等不良的人格品质。"},{"id":"2-5-9","subject":"心理学","chapter":"第五章 人的全程发展","number":9,"stem":"我国心理学家通常将个体的发展划分为8个阶段。其中，小学生主要处于( )","options":["幼儿期","童年期","少年期","青年期"],"answer":"B","explanation":"我国心理学家通常将个体的心理发展划分为8个阶段。即：乳儿期(0~1岁)；婴儿期(1～3岁)；幼儿期(3~6、7岁)；童年期(6、7岁~11、12岁)；少年期(11、12岁～14、15岁)；青年期(14、15岁~25岁)；成年期(25～65岁)；老年期(65岁以后)。"},{"id":"2-5-10","subject":"心理学","chapter":"第五章 人的全程发展","number":10,"stem":"童年时期的年龄范围是 ( )","options":["6.7岁~11.12岁","0~1岁","1~3岁","3~6.7岁"],"answer":"A","explanation":"童年期的年龄范围在6、7岁～11、12岁，属于小学阶段，是为一生的学习活动奠定基础知识和学习能力的时期，是心理发展一个重要阶段。"},{"id":"2-5-11","subject":"心理学","chapter":"第五章 人的全程发展","number":11,"stem":"童年期的主导活动是 ( )","options":["交往","劳动","游戏","学习"],"answer":"D","explanation":"童年期儿童以学习为主，其主要任务是通过学校教学系统地掌握学习方法和学习态度，学会学习。"},{"id":"2-5-12","subject":"心理学","chapter":"第五章 人的全程发展","number":12,"stem":"少年期的年龄范围是 ( )","options":["11.12~14.15","13.14~15.16","15.16~17.18","15.16~18.19"],"answer":"A","explanation":"少年期年龄范围为11岁左右至15岁左右这一时期，相当于初中教育阶段。"},{"id":"2-5-13","subject":"心理学","chapter":"第五章 人的全程发展","number":13,"stem":"在小学教育中，往往把学生分为高.中.低三个年级段，这遵循的儿童心理发展规律是（ ）","options":["同一年龄阶段的儿童心理年龄特征是相对稳定的","发展是跳跃的","发展是平均进行的","发展是有个别差异的"],"answer":"A","explanation":"小学教育中把学生分高、中、低三个年级段，这种做法循序的是儿童心理发展同一年龄阶段心理年龄特征相对稳定。"},{"id":"2-5-14","subject":"心理学","chapter":"第五章 人的全程发展","number":14,"stem":"社会自我基本成熟的时期在( )","options":["婴儿期","幼儿期","童年期","少年期"],"answer":"D","explanation":"在少年期社会自我基本成熟。"},{"id":"2-5-15","subject":"心理学","chapter":"第五章 人的全程发展","number":15,"stem":"心理自我开始形成和发展的时期为( )","options":["幼儿期","童年期","少年期","青年初期"],"answer":"D","explanation":"青年初期是心理自我开始形成和发展的时期。"},{"id":"2-5-16","subject":"心理学","chapter":"第五章 人的全程发展","number":16,"stem":"提出“关键期”概念的心理学家是( )","options":["加涅","韦那","劳伦兹","奥苏伯尔"],"answer":"C","explanation":"人的身心的不同方面有不同的发展期现象(发展的不平衡性)，越来越引起心理学家的重视，劳伦兹提出了发展的关键期或最佳期的概念。"},{"id":"2-5-17","subject":"心理学","chapter":"第五章 人的全程发展","number":17,"stem":"皮亚杰划分儿童心理发展阶段的标准是 ( )","options":["生理发展","人格发展","主导发展","认知发展"],"answer":"D","explanation":"皮亚杰根据儿童认知发展水平把儿童心理发展分为：感知运动阶段(0～2岁)，前运算阶段(2～7岁)；具体运算阶段(7～12岁)；形式运算阶段(12～15岁)。"},{"id":"2-5-18","subject":"心理学","chapter":"第五章 人的全程发展","number":18,"stem":"儿童对具体问题可以进行逻辑运算，思维具有可逆性，此属于皮亚杰关于儿童心理发展的 ( )","options":["形式运算阶段","具体运算阶段","前运算阶段","感知运动阶段"],"answer":"B","explanation":"具体运算阶段在前运算阶段之后，从7岁到12岁，此时儿童从表象性思维中解脱出来，认知结构中已经具有了抽象概念，因而能够进行逻辑推理，但运算仍离不开具体事物的支持。其认知活动具有了守恒性和可逆性，也逐渐学会从他人角度去看问题，即去自我中心主义。"},{"id":"2-5-19","subject":"心理学","chapter":"第五章 人的全程发展","number":19,"stem":"去过几次小朋友的家，就能画出具体的路线图来。认知发展到哪一阶段的儿童能做到这种程度 ( )","options":["感知运动阶段","前运算阶段","具体运算阶段","形式运算阶段"],"answer":"C","explanation":"可以这样理把做过的事情（去小朋友家），用某种方式（画出）表达出来，这是实践的运用与认知的结合。"},{"id":"2-5-20","subject":"心理学","chapter":"第五章 人的全程发展","number":20,"stem":"守恒指物体不论形态如何变化，其质量恒定不变。皮亚杰认为，儿童开始具有守恒观念的年龄阶段是( )","options":["0-2岁","2-7岁","7-11岁","11-15岁"],"answer":"C","explanation":"皮亚杰认为儿童7-11岁开始具有守恒观念。"},{"id":"2-5-21","subject":"心理学","chapter":"第五章 人的全程发展","number":21,"stem":"由形象思维向抽象思维过渡的转折期是 ( )","options":["12岁左右","10岁左右","14岁左右","15岁左右"],"answer":"B","explanation":"10左右，形象思维开始向抽象思维过度。"},{"id":"2-5-22","subject":"心理学","chapter":"第五章 人的全程发展","number":22,"stem":"青少年期的思维发展水平属于 ( )","options":["感知运动水平","前运算水平","形式运算水平","具体运算水平"],"answer":"C","explanation":"这个阶段属于形式运算阶段，这个阶段在具体运算阶段之后，从大约11岁~15岁，表现为获得抽象思维能力和从可得到的信息得出结论。"},{"id":"2-5-23","subject":"心理学","chapter":"第五章 人的全程发展","number":23,"stem":"一个孩子帮妈妈洗碗，不小心打破了五个碗；另一个孩子在柜子上拿糖吃，打破了一个碗。谁犯错的要大一些?这是皮亚杰研究道德发展阶段经常采用的方法，属于( )","options":["两难故事法","对偶故事法","个案分析法","文献研究法"],"answer":"B","explanation":"皮亚杰根据所要研究的道德现象，设计编拟一些包含道德价值的对偶故事，组成不同的结构形式，要求儿童辨认是非对错，从他们对特定行为情境中的评价中去查明他们的道德观念，这种方法被称为对偶故事法或间接故事法。"},{"id":"2-5-24","subject":"心理学","chapter":"第五章 人的全程发展","number":24,"stem":"艾里克森划分儿童心理发展阶段的标准是 ( )","options":["生理发展","人格特征","认知发展","主动活动"],"answer":"B","explanation":"艾里克森以人格特征为标准把个体一生划分为八个阶段，同时指出了每一个阶段的主要发展任务。"},{"id":"2-5-25","subject":"心理学","chapter":"第五章 人的全程发展","number":25,"stem":"发展任务是获得自主感，克服羞耻感和疑虑，养成自主的能力，这是艾里克森关于个体心理发展 ( )的任务","options":["学龄期","学前期","幼儿早期","婴儿期"],"answer":"C","explanation":"考查埃里克森八阶段理论，幼儿早期（1.5～3岁）：自主与害羞（或怀疑）的冲突。"},{"id":"2-5-26","subject":"心理学","chapter":"第五章 人的全程发展","number":26,"stem":"根据埃里克森的人格发展阶段，6～11岁的儿童要解决的主要矛盾是( )","options":["勤奋感对自卑感","自我同一性对角色混乱","主动感对内疚感","基本的信任感对基本的不信任感"],"answer":"A","explanation":"埃里克森人格发展的八个阶段：⑴婴儿期（0～1.5岁）：基本信任和不信任的心理冲突 ⑵儿童期（1.5～3岁）：自主与害羞和怀疑的冲突 ⑶学龄初期（3～5岁）：主动对内疚的冲突 ⑷学龄期（6～12岁），勤奋对自卑的冲突 ⑸青春期（12～18岁）：自我同一性和角色混乱的冲突 ⑹成年早期（18～25岁）：亲密对孤独的冲突 ⑺成年期（25～65岁）：生育对自我专注的冲突 ⑻成熟期（65岁以上）：自我调整与绝望期的冲突。"},{"id":"2-5-27","subject":"心理学","chapter":"第五章 人的全程发展","number":27,"stem":"对青年期人格发展和自我发展予以系统论述的著名的自我同一性理论提出者是 ( )","options":["弗洛伊德","荣格","罗杰斯","艾里克森"],"answer":"D","explanation":"艾里克森是美国著名的精神分析自我心理学家，自我同一性是他提出的一个核心概念，其意义是指个体在过去、现在、将来的连续性、一致性。"},{"id":"2-5-28","subject":"心理学","chapter":"第五章 人的全程发展","number":28,"stem":"采用道德两难故事研究儿童道德发展的心理学家是( )。","options":["斯滕伯格","柯尔伯格","埃里克森","弗洛伊德"],"answer":"B","explanation":"柯尔伯格把皮亚杰的研究方法改进为道德两难故事法，他所设计的故事中包含着一个在道德价值上具有矛盾冲突的故事，让被试听完故事后对故事中人物的行为进行评价，他还设计了相当完备的评价标准体系，以此来测评被试道德发展的水平。"},{"id":"2-5-29","subject":"心理学","chapter":"第五章 人的全程发展","number":29,"stem":"柯尔伯格道德判断发展阶段论的观点，只根据行为后果来判断对错的儿童，其道德判断发展水平处于( )","options":["“好孩子”取向阶段","惩罚和服从取向阶段","良心或原则取向阶段","权威和社会秩序取向阶段"],"answer":"B","explanation":"柯尔伯格道德判断发展阶段论的观点，只根据行为后果来判断对错的儿童，其道德判断发展水平处于惩罚和服从取向阶段。"},{"id":"2-5-30","subject":"心理学","chapter":"第五章 人的全程发展","number":30,"stem":"根据科尔伯格的理论，道德发展的最高阶段是( )","options":["法律和秩序的取向","社会契约的取向","工具性的相对主义","普遍的道德原则取向"],"answer":"D","explanation":"科尔伯格提出了三水平六阶段理论。三水平是指前习俗水平、习俗水平、后习俗水平。六阶段是指每个水平中又可划分为两个不同的阶段。其中最高阶段是普遍的道德原则取向阶段。"},{"id":"2-6-1","subject":"心理学","chapter":"第六章 小学生的心理发展特点","number":1,"stem":"在人体各系统的发育中,最早发育成熟的是( )","options":["骨骼肌肉系统","心血管系统","神经系统","生殖系统"],"answer":"C","explanation":"人体各系统的发育是协调一致的，但在时间和速度上有所不同.各系统发育成熟的顺序是:神经系统最早成熟，骨骼肌肉系统和心血管系统次之，生殖系统最晚成熟。"},{"id":"2-6-2","subject":"心理学","chapter":"第六章 小学生的心理发展特点","number":2,"stem":"下列选项中,不属于小学生身体发育特征的是( )","options":["脑细胞分化基本完成","骨骼逐渐骨化,肌肉力量较强","心跳速度减慢,呼吸力量增强","生殖器官发育,性激素增加"],"answer":"B","explanation":"小学生的身体发育主要体现在四个方面:（1）神经系统方面，脑细胞分化基本完成，感觉器官正在发育成熟；（2）骨骼肌肉系统方面，骨骼逐渐骨化，肌肉力量尚弱；（3）心血管组织，方面心跳速度减慢，呼吸力量增强；（4）生殖系统方面，生殖器官发育，性激素增加。"},{"id":"2-6-3","subject":"心理学","chapter":"第六章 小学生的心理发展特点","number":3,"stem":"小学阶段的男孩在( )技能方面的优势很微弱,之后优势越来越明显。","options":["动作","言语","心智","实践"],"answer":"A","explanation":"青春期前的男孩在动作技能方面的优势很微弱，之后优势越来越明显。"},{"id":"2-6-4","subject":"心理学","chapter":"第六章 小学生的心理发展特点","number":4,"stem":"儿童心理发展趋势和顺序( )","options":["没有规律","根据不同个体而不同","大致相同","有时相同,有时不同"],"answer":"C","explanation":"每一个个体的发展曲线都具有相同的发展趋势，但绝不会完全重合，个体发展的差异不能否定他们有共同的趋势。"},{"id":"2-6-5","subject":"心理学","chapter":"第六章 小学生的心理发展特点","number":5,"stem":"小学生的注意广度存在着性别差异,无论低年级或高年级,女生的注意广度( )男生。","options":["低于","等于","高于","无法确定"],"answer":"C","explanation":"小学生的注意广度存在着性别差异，无论低年级或高年级，女生的注意广度均高于男生。"},{"id":"2-6-6","subject":"心理学","chapter":"第六章 小学生的心理发展特点","number":6,"stem":"小学儿童玩游戏机的水平不亚于成人,这是因为他们注意的( )有较好的发展.","options":["广度","稳定性","转移","分配"],"answer":"D","explanation":"儿童注意分配能力的发展，有助于他们在游戏中的协调性。"},{"id":"2-6-7","subject":"心理学","chapter":"第六章 小学生的心理发展特点","number":7,"stem":"从记忆方法来讲,小学低年级儿童较多地运用( )","options":["无意记忆","有意记忆","机械记忆","意义记忆"],"answer":"C","explanation":"从记忆方法来看，小学低年级儿童较多地运用机械记忆，随着年龄增长，意义记忆逐步增加，而机械记忆相对减少。"},{"id":"2-6-8","subject":"心理学","chapter":"第六章 小学生的心理发展特点","number":8,"stem":"下列对小学生知觉发展的特点表述不正确的是( )","options":["有意性.目的性明显发展","分析与综合水平提高","策略性逐渐发展","能够确定较远的空间距离"],"answer":"D","explanation":"小学生知觉发展的特点有:(1)知觉的有意性、目的性明显发展；(2)知觉的分析与综合水平提高；(3)知觉的策略性逐渐发展.对于距离知觉，小学儿童对空间环境中对象间比较近的距离一般都可以确定，而对比较远的空间距离则往往混淆不清，难以确定。"},{"id":"2-6-9","subject":"心理学","chapter":"第六章 小学生的心理发展特点","number":9,"stem":"小学儿童思维发展的基本特征是( )","options":["以具体形象思维为主","从直观动作思维为主逐步过渡到具体形象思维为主","以抽象逻辑思维为主","从具体形象思维为主逐步过渡到抽象逻辑思维为主"],"answer":"D","explanation":"小学生思维发展的基本特征是从具体形象思维为主逐步向抽象逻辑思维为主过渡，但仍带有较大的具体性、不自觉性和不平衡性。"},{"id":"2-6-10","subject":"心理学","chapter":"第六章 小学生的心理发展特点","number":10,"stem":"小学生由具体形象思维过渡到抽象逻辑思维的转折期是在( )","options":["三年级","四年级","五年级","六年级"],"answer":"B","explanation":"小学生在从具体形象思维为主逐渐向抽象逻辑思维为主的过渡中出现“飞跃”或“质变”.一般认为，这个关键年龄出现在小学四年级(约10～1I岁).如果教育条件适当，这个关键年龄可以提前到三年级。"},{"id":"2-6-11","subject":"心理学","chapter":"第六章 小学生的心理发展特点","number":11,"stem":"小学生的情绪.情感由冲动转向稳定的关键时期是在( )","options":["小学二年级","小学三年级","小学四年级","小学六年级"],"answer":"B","explanation":"小学生的情绪、情感逐步从冲动性、易变性向平衡性、稳定性方向发展，一般来讲，小学三年级是这种转变的关键时期。"},{"id":"2-6-12","subject":"心理学","chapter":"第六章 小学生的心理发展特点","number":12,"stem":"下列与小学生情绪情感发展的特点不相符的是( )","options":["调节控制能力增强","冲动性增强","内容不断丰富","友谊感逐渐发展"],"answer":"B","explanation":"本题考查小学生情绪情感发展的特点，其情绪冲动性减弱。"},{"id":"2-6-13","subject":"心理学","chapter":"第六章 小学生的心理发展特点","number":13,"stem":"品德是个体依据一定的社会道德行为规范行动时表现出来的心理特征和倾向,它是( )","options":["比较不稳定的","受先天因素制约的","时稳时变的","比较稳定的"],"answer":"D","explanation":"品德又称道德品质，是个体依据一定的社会道德准则规范自己行动时所表现出来的稳定的心理倾向和特征。"},{"id":"2-6-14","subject":"心理学","chapter":"第六章 小学生的心理发展特点","number":14,"stem":"我国小学生品德发展所表现出来的基本特点是( )","options":["分化性","矛盾性","一致性","协调性"],"answer":"D","explanation":"小学生晶德发展具有明显的形象性、过渡性和协调性。"},{"id":"2-6-15","subject":"心理学","chapter":"第六章 小学生的心理发展特点","number":15,"stem":"下列与小学生品德发展特点不相符的是( )","options":["随着年龄增长,言行逐渐一致","年龄越小,言行越一致","出现自觉纪律","关键期大致在三年级下学期"],"answer":"A","explanation":"小学时期的道德言行从比较协调向逐步分化发展，年龄越小，言行越一致，随着年龄的增长，逐渐出现言行不一致的现象。"},{"id":"2-6-16","subject":"心理学","chapter":"第六章 小学生的心理发展特点","number":16,"stem":"使人格各部分整合和统一起来的核心力量是( )","options":["自我意识","自我认知","性格特征","能力"],"answer":"A","explanation":"自我意识是使人格各部分整合和统一起来的核心力量。"},{"id":"2-6-17","subject":"心理学","chapter":"第六章 小学生的心理发展特点","number":17,"stem":"自我体验是自我意识的( )成分。","options":["认知","情感","意志","动机"],"answer":"B","explanation":"自我体验是伴随自我认识而产生的内心体验，是自我意识在情感上的表现，即主我对客我所持有的一种态度。"},{"id":"2-6-18","subject":"心理学","chapter":"第六章 小学生的心理发展特点","number":18,"stem":"自我控制属于自我意识中的( )成分。","options":["认知","情感","意志","动机"],"answer":"C","explanation":"自我控制是一个人对自身心理与行为的主动的掌握，是意志的具体体现。"},{"id":"2-6-19","subject":"心理学","chapter":"第六章 小学生的心理发展特点","number":19,"stem":"( )是一种消极的自我评价，是认为自己不如他人而产生的消极情感。","options":["自信","自卑","自尊","自负"],"answer":"B","explanation":"自卑感是个体对自己能力和品质评价偏低的一种消极情感。"},{"id":"2-6-20","subject":"心理学","chapter":"第六章 小学生的心理发展特点","number":20,"stem":"小学生可以借助网络的“私密空间”和( )的特征,倾诉自己心中的矛盾和困惑,得到更多朋友的帮助,释放因学习等带来的压力。","options":["个性化","去个性化","独特性","广泛性"],"answer":"B","explanation":"网络中去个性化就是指在以互联网为基础的空间内，个体丧失其同一性和责任感的一种现象.在网络中去个性化状态下个体的行为责任意识会明显丧失，从而导致个体做出在现实社会中通常不会做出的事情.去个性化具有三个特征:(1)成员的匿名性；(2)责任分散；(3)相互感染.故本题选B项。"},{"id":"2-6-21","subject":"心理学","chapter":"第六章 小学生的心理发展特点","number":21,"stem":"人际交往的主要工具是( )。","options":["语言符号","非语言符号","面部表情","身体姿态"],"answer":"A","explanation":"人际交往过程必须以一定的符号系统为交往工具才有可能实现，其主要交往工具是语言符号。"},{"id":"2-6-22","subject":"心理学","chapter":"第六章 小学生的心理发展特点","number":22,"stem":"“物以类聚，人以群分”说的是什么因素对人际吸引的影响？( )","options":["相互性","相似性","互补性","接近性"],"answer":"A","explanation":"人际交往过程必须以一定的符号系统为交往工具才有可能实现，其主要交往工具是语言符号。"},{"id":"2-6-23","subject":"心理学","chapter":"第六章 小学生的心理发展特点","number":23,"stem":"麦克斯白将亲子关系的变化分为( )三个阶段。","options":["父母控制、共同控制、儿童控制","父母控制、儿童控制、共同控制","儿童控制、共同控制、父母控制","共同控制、父母控制、儿童控制"],"answer":"A","explanation":"麦克斯白提出一个亲子关系发生变化的三阶段模式:第一阶段，父母控制(6岁以前)；第二阶段，共同控制(612岁)；第三阶段，儿童控制(12岁以上)。"},{"id":"2-6-24","subject":"心理学","chapter":"第六章 小学生的心理发展特点","number":24,"stem":"小学生亲社会行为的利他行为的核心是( )","options":["成人的榜样","对他人设身处地的设想能力","掌握利他的知识","掌握利他的技能"],"answer":"B","explanation":"亲社会行为，即准备帮助他人或采取有益于他人的行为。对他人设身处地的设想能力是其核心。"},{"id":"2-6-25","subject":"心理学","chapter":"第六章 小学生的心理发展特点","number":25,"stem":"下列对儿童社会性发展的特点表述不正确的是( )","options":["社会技能不够完善","观点采择能力有了发展","印象形成依据从具体特征转向心理特征","攻击行为增多"],"answer":"D","explanation":"小学阶段，儿童的攻击性行为明显减少，这主要是由于社会认知能力的增加，儿童能够区分有意或者偶然的目的，能够宽容他人的过失行为。"},{"id":"2-7-1","subject":"心理学","chapter":"第七章 学习心理","number":1,"stem":"个体在特定情况下，由于练习或反复经验而产生的行为或行为潜能的较持久的变化是（ ）","options":["实践","反应","反射","学习"],"answer":"D","explanation":"通过反复练习、训练使个体行为或行为潜能发生相对持久的变化称为学习。"},{"id":"2-7-2","subject":"心理学","chapter":"第七章 学习心理","number":2,"stem":"通过学习而形成的合法则的心智活动方式即是( )","options":["智力技能","知识迁移","智力","思维程序"],"answer":"A","explanation":"智力技能是指借助于内部言语在人脑内部进行的认识方式，是以思维为核心的认识加工的具体方式。"},{"id":"2-7-3","subject":"心理学","chapter":"第七章 学习心理","number":3,"stem":"根据加涅的学习结果分类，你认为利用符号与环境相互作用的能力，即学习“怎么做”的一些知识，是属于( )","options":["智慧技能","认知策略","言语信息","态度"],"answer":"A","explanation":"智慧技能的学习：解决“怎么做”的问题，以处理外界的符号和信息，又称过程知识。按学习水平及其所包含的心理运算的不同复杂速度依次分为：辨别—概念—规则—高级规则（解决问题）等智慧技能。"},{"id":"2-7-4","subject":"心理学","chapter":"第七章 学习心理","number":4,"stem":"按照加涅的学习结果分类观点，调节和控制自己的注意.学习.记忆.思维和问题解决过程的内部组织起来的能力称为( )","options":["智慧技能","认知策略","言语信息","动作技能"],"answer":"B","explanation":"按照加涅的学习结果分类的观点，调节和控制自己的注意、学习、记忆、思维和问题解决过程的内部组织起来的能力称为认知策略。"},{"id":"2-7-5","subject":"心理学","chapter":"第七章 学习心理","number":5,"stem":"根据加涅的学习结果分类，表现为影响着个体对人.对物或对某些事件的选择倾向的学习类型为( )。","options":["智慧技能","认知策略","言语信息","态度"],"answer":"D","explanation":"态度的学习。态度是通过学习获得的内部状态，这种状态影响着个人对某种事物、人物及事件所采取的行动。"},{"id":"2-7-6","subject":"心理学","chapter":"第七章 学习心理","number":6,"stem":"心智技能是借助于( )而实现的。","options":["动作","原型操作","个别差异","言语"],"answer":"D","explanation":"心智技能是借助于内部言语而实现的，因此言语在心智技能形成中具有十分重要的作用。"},{"id":"2-7-7","subject":"心理学","chapter":"第七章 学习心理","number":7,"stem":"下列哪种技能不属于心智技能( )","options":["书写技能","阅读技能","写作技能","心算技能"],"answer":"A","explanation":"心智技能指经过练习巩固起来的、接近自动化的智力活动方式。它是借助于内部语言在头脑中进行认识活动的技能。如运算、阅读、作文等等都属于心智技能。"},{"id":"2-7-8","subject":"心理学","chapter":"第七章 学习心理","number":8,"stem":"小丁原来很怕见陌生人，上幼儿园后这种行为消失了。根据加涅的学习结果分类，在小丁身上发生了( )的学习。","options":["态度","智慧技能","认知策略","言语信息"],"answer":"A","explanation":"态度表现为影响着个体对人、对物或对某些事件的选择倾向。"},{"id":"2-7-9","subject":"心理学","chapter":"第七章 学习心理","number":9,"stem":"按照加涅的学习层次分类的观点，学生将“苹果”.“梨”.“葡萄”等概括为“水果”的学习属于( )","options":["信号学习","言语联结学习","概念学习","规则或原理学习"],"answer":"C","explanation":"概念学习就是学习把具有共同属性的事物集合在一起并冠以一个名称，把不具有此类属性的事物排除出去。"},{"id":"2-7-10","subject":"心理学","chapter":"第七章 学习心理","number":10,"stem":"掌握同类事物的共同的关键特征和本质属性的学习称为( )","options":["符号学习","概念学习","命题学习","规则学习"],"answer":"B","explanation":"概念学习实质上是掌握同类事物的共同的关键特征。例如学习“圆”这一概念，就是掌握所有圆共同的关键特征，而与它的大小、形状、颜色等特征无关。"},{"id":"2-7-11","subject":"心理学","chapter":"第七章 学习心理","number":11,"stem":"对自然界中定理定律的学习是( )","options":["规则学习","概念掌握","概念获得","问题解决学习"],"answer":"A","explanation":"规则学习指理解概念之间的关系，并能运用这些规则来支配个人的行动。"},{"id":"2-7-12","subject":"心理学","chapter":"第七章 学习心理","number":12,"stem":"奥苏伯尔认为，适用于年幼的儿童以及年长的学生学习新学科或新材料早期的学习方式是（ ）","options":["发现学习","接受学习","机械学习","上位学习"],"answer":"B","explanation":"接受学习，即学习者把以现成的定论的形式呈现给自己的学习材料，与其已形成的认识结构联系起来，以实现对这种学习材料的掌握的学习方式。"},{"id":"2-7-13","subject":"心理学","chapter":"第七章 学习心理","number":13,"stem":"高级神经活动类型说的提出者是( )。","options":["巴甫洛夫","希波克拉底","加伦","克瑞奇米尔"],"answer":"A","explanation":"巴甫洛夫认为人的气质是由人的高级神经活动类型决定的。大脑皮层的基本神经过程有强度、均衡性和灵活性三种基本特性。"},{"id":"2-7-14","subject":"心理学","chapter":"第七章 学习心理","number":14,"stem":"最早提出经典性条件反射的人是( )","options":["布鲁纳","斯金纳","巴甫洛夫","奥苏伯尔"],"answer":"C","explanation":"俄国生理学家巴甫洛夫是最早提出经典性条件反射的人。巴甫洛夫注意到狗在嚼吃食物时淌口水，或者说分泌大量的唾液，唾液分泌是一种本能的反射，巴甫洛夫还观察到，较老的狗一看到食物就淌口水，而不必尝到食物的刺激，也就是说，单是视觉就可以使狗产生分泌唾液的反应。"},{"id":"2-7-15","subject":"心理学","chapter":"第七章 学习心理","number":15,"stem":"第一个对问题解决过程进行实验研究，并明确提出解释的理论叫做( )","options":["试误说","顿悟说","定位说","发现说"],"answer":"A","explanation":"试误说是第一个对问题解决过程进行实验研究，并明确提出解释的理论。"},{"id":"2-7-16","subject":"心理学","chapter":"第七章 学习心理","number":16,"stem":"教育心理学史上第一个较为完整的心理理论为( )","options":["试误说","顿悟说","操作性条件作用说","发现说"],"answer":"A","explanation":"最早提出完整的心理理论的是美国的桑代克，认为学习的实质是经过尝试错误在刺激S与反应R之间形成连结。所谓学习就是在一定情境的影响下，唤起“原本连结”中的一种连结倾向，并使之加强。连结学习的过程是渐进的“尝试与错误”直至最后成功的过程。这个学说也被称为试误说。"},{"id":"2-7-17","subject":"心理学","chapter":"第七章 学习心理","number":17,"stem":"提出操作性条件反射理论和提倡程序教学与机器教学的是( )","options":["斯金纳","巴夫洛夫","布鲁纳","苛勒"],"answer":"A","explanation":"斯金纳是美国著名的行为主义心理学家， 他的杰出贡献就是提出操作性条件反射理论和提倡程序教学与机器教学。因此，答案选 A。"},{"id":"2-7-18","subject":"心理学","chapter":"第七章 学习心理","number":18,"stem":"斯金纳认为行为分两类，分别是( )","options":["学习行为和操作性行为","操作性行为和反应行为","应答性行为和操作性行为","刺激行为和应答性行为"],"answer":"C","explanation":"从对动物的研究中，斯金纳认为，行为分为两类：应答性行为和操作性行为。应答性行为是由已知的刺激引起的；操作性行为则是由有机体自身发出的。"},{"id":"2-7-19","subject":"心理学","chapter":"第七章 学习心理","number":19,"stem":"儿童因有改正错误的行为表现，家长便取消了限制儿童看电视的禁令，这种能提高反应概率的刺激是( )","options":["正强化","负强化","正弱化","负弱化"],"answer":"B","explanation":"负强化是积极行为预期增加或者已经增加，为了巩固那些已经增加积极行为，撤销原来的那些惩罚那些与组织不相容的行为带来的痛苦。"},{"id":"2-7-20","subject":"心理学","chapter":"第七章 学习心理","number":20,"stem":"一个学生不敢同教师说话，也没有勇气向教师求教，当他一旦敢于主动向教师请教，教师就给予表扬并耐心解答，他就能学会向老师请教的行为方式。这种方法属于( )。","options":["强化法","代币奖励法","行为塑造法","示范法"],"answer":"A","explanation":"这种方法属于强化法，当一种行为的后果对学生有利时，这种行为就会在以后重复出现；不利时，这种行为就减弱或消失。人们可以用这种正强化或负强化的办法来影响行为的后果，从而修正其行为。"},{"id":"2-7-21","subject":"心理学","chapter":"第七章 学习心理","number":21,"stem":"教师对一个同学的助人行为进行表扬，这对其他同学就是一种( )。","options":["直接强化","强化的程式","替代性强化","自我强化"],"answer":"C","explanation":"替代性强化是通过一定得榜样来强化相对应的行为或行为倾向。“身教重于言传”是替代性强化的作用在教育实践中的表现。例如当教师强化一个学生的助人行为时，班上的其他人也将花一定时间互帮互助。"},{"id":"2-7-22","subject":"心理学","chapter":"第七章 学习心理","number":22,"stem":"一个学生上课讲话，老师要他写“我上课讲话，真丑”1000遍，这属于 ( )","options":["正强化","负强化","惩罚","替代强化"],"answer":"C","explanation":"建立操作反应时，在有机体的操作反应后，如果呈现某一后继的刺激物，有机体的操作反应概率增加，那么该刺激产生的作用就是正强化。建立操作反应时，在有机体的操作反应后，如果撤走某一刺激物，有机体的操作反应概率增加，那么该刺激产生的作用就是负强化。而撤消正强化物和呈现负强化物都会导致反应概率下降，是对操作行为进行惩罚的过程。因此答案是C。"},{"id":"2-7-23","subject":"心理学","chapter":"第七章 学习心理","number":23,"stem":"妈妈要求小华必须完成作业以后才能看动画片。这种做法符合( )","options":["负强化原则","替代强化原则","自我强化原则","普雷马克原则"],"answer":"D","explanation":"普雷马克原则是指用高频行为（喜欢的行为）作为低频行为（不喜欢的行为）的有效强化物。"},{"id":"2-7-24","subject":"心理学","chapter":"第七章 学习心理","number":24,"stem":"某教室对喜欢打小报告的学生采取故意不理会的方式，这是一种( )","options":["正强化","负强化","消退","惩罚"],"answer":"C","explanation":"消退是行为矫正的基本技术之一，指的是已经形成的行为，由于撤掉强化而减弱以至消失的过程。"},{"id":"2-7-25","subject":"心理学","chapter":"第七章 学习心理","number":25,"stem":"提出社会学习理论的心理学家是( )","options":["斯金纳","巴甫洛夫","桑代克","班杜拉"],"answer":"D","explanation":"所谓社会学习理论，班杜拉认为是探讨个人的认知、行为与环境因素三者及其交互作用对人类行为的影响。按照班杜拉的观点，以往的学习理论家一般都忽视了社会变量对人类行为的制约作用。"},{"id":"2-7-26","subject":"心理学","chapter":"第七章 学习心理","number":26,"stem":"认为社会学习是通过观察.模仿而完成的，态度与品德作为社会学习的一项内容，也可以通过观察.模仿榜样的行为而习得的是( )","options":["布鲁纳","班杜拉","皮亚杰","加里培林"],"answer":"B","explanation":"班杜拉的社会学习理论以及大量的实践经验都证明，社会学习是通过观察、模仿而完成的，态度与品德作为社会学习的一项内容，也可以通过观察、模仿榜样的行为而习得。"},{"id":"2-7-27","subject":"心理学","chapter":"第七章 学习心理","number":27,"stem":"认知目的说，社会学习理论属于( )","options":["认知派的学习理论","联结派的学习理论","人本主义学习理论","联结—认知派的学习理论"],"answer":"D","explanation":"认知目的说、社会学习理论应属于联结-认知派的学习理论，故选D。"},{"id":"2-7-28","subject":"心理学","chapter":"第七章 学习心理","number":28,"stem":"个体通过理解事物之间的关系.结构与性质而突然觉察到问题解决的办法，这种学习是( )","options":["试误","顿悟","发现","强化"],"answer":"B","explanation":"格式塔心理学家认为，学习是个体利用自身的智慧与理解力对情境及情境与自身关系的顿悟，而不是动作的累积或盲目的尝试。"},{"id":"2-7-29","subject":"心理学","chapter":"第七章 学习心理","number":29,"stem":"顿悟说是由心理学家( )提出的。","options":["杜威","苛勒","西蒙","桑代克"],"answer":"B","explanation":"格式塔心理学家苛勒曾在1913—1917年间，对黑猩猩的问题解决行为进行了一系列的实验研究，从而提出了与尝试—错误学习理论相对立的完形—顿悟说。"},{"id":"2-7-30","subject":"心理学","chapter":"第七章 学习心理","number":30,"stem":"( )强调学习的主动性和认知结构的重要性，主张教学的最终目标是促进学生对学科 结构的一般理解。","options":["斯金纳","布鲁纳","苛勒","加涅"],"answer":"B","explanation":"题干是布鲁纳认知结构说的核心思想。"},{"id":"2-7-31","subject":"心理学","chapter":"第七章 学习心理","number":31,"stem":"美国心理学家布鲁纳认为，学习的实质在于( )","options":["构造—完形","对环境条件的认知","主动地构建认知结构","形成刺激与反应间的联结"],"answer":"C","explanation":"布鲁纳认为，学习的实质是一个人把同类事物联系起来，并把它们组织成赋予一定意义的结构，亦即是学习者主动的通过感知、领会和推理，主动形成认知结构或表征。"},{"id":"2-7-32","subject":"心理学","chapter":"第七章 学习心理","number":32,"stem":"强调有意义学习，认为知识应该能够引起变化，全面渗入人格和人的行动之中的是( )。","options":["奥苏伯尔","罗杰斯","马斯洛","斯金纳"],"answer":"B","explanation":"罗杰斯的有意义学习和奥苏伯尔的有意义学习是有区别的。前者关注的是学习内容与个人之间的关系；而后者则强调新旧知识之间的联系，它只涉及理智，而不涉及个人意义。"},{"id":"2-7-33","subject":"心理学","chapter":"第七章 学习心理","number":33,"stem":"奥苏贝尔认为，学生学习的实质是( )","options":["有意义接受学习","有意义发现学习","发现学习","探究学习"],"answer":"A","explanation":"奥苏贝尔认为，学生学习的实质是有意义接受学习。"},{"id":"2-7-34","subject":"心理学","chapter":"第七章 学习心理","number":34,"stem":"奥苏伯尔认为学生的学习主要是( )","options":["接受学习","发现学习","机械学习","有意义接受学习"],"answer":"D","explanation":"奥苏伯尔主张接受学习，他认为接受学习必须按“有意义学习”的标准和条件进行，接受学习的目的是建立起相应的认知结构。"},{"id":"2-7-35","subject":"心理学","chapter":"第七章 学习心理","number":35,"stem":"奥苏伯尔根据学习进行的方式把学习分为( )","options":["知识学习和技能学习","接受学习和发现学习","概念学习和意义学习","机械学习和意义学习"],"answer":"B","explanation":"在学习的认知领域、奥苏伯尔根据学习进行的方式，把学习分为接受学习和发现学习。根据学习材料与学习者原有知识的关系，把学习分为机械学习和有意义学习。"},{"id":"2-7-36","subject":"心理学","chapter":"第七章 学习心理","number":36,"stem":"奥苏伯尔根据学习材料与学习者原有知识结构的关系把学习分为( )","options":["知识学习和技能学习","接受学习和发现学习","概念学习和意义学习","机械学习和意义学习"],"answer":"D","explanation":"奥苏伯尔根据学习进行的方式，把学习分为接受学习与发现学习，又根据学习材料与学习者原有知识结构的关系把学习分为机械学习与意义学习，并认为学生的学习主要是有意义接受学习。"},{"id":"2-7-37","subject":"心理学","chapter":"第七章 学习心理","number":37,"stem":"在有指导的情境下，借成人的帮助所能达到的解决问题的水平与独立活动中所能达到的解决问题的水平之间的差异，叫做 ( )","options":["最近发展区","个别差异","群体差异","关键区"],"answer":"A","explanation":"此题考查最近发展区的定义。"},{"id":"2-7-38","subject":"心理学","chapter":"第七章 学习心理","number":38,"stem":"“最近发展区”概念的提出者是 ( )","options":["维果茨基","皮亚杰","列昂节夫","弗洛伊德"],"answer":"A","explanation":"苏联著名心理学家（教育家）维果茨基 依据一系列实验的结果，指出了学龄期的教学与发展问题具有重要价值的观念——“最近发展区”。"},{"id":"2-8-1","subject":"心理学","chapter":"第八章 知识的学习与迁移","number":1,"stem":"根据反映活动的深度不同，知识分为（ ）","options":["外部知识和内部知识","感性知识和理性知识","直接知识和间接知识","陈述性知识与程序性知识"],"answer":"B","explanation":"根据反映活动的深度不同，把知识分为感性知识和理性知识。根据知识的概括水平划分为具体知识和抽象知识。根据知识的功能划分为陈述性知识和程序性知识。根据获得知识的方式不同分为直接知识与间接知识。"},{"id":"2-8-2","subject":"心理学","chapter":"第八章 知识的学习与迁移","number":2,"stem":"反映活动本质特征与内在联系的知识称为（ ）","options":["感性知识","理性知识","程序性知识","描述性知识"],"answer":"B","explanation":"理性知识是对事物的本质特征与内在联系的反映，包括概念和命题两种形式。感性知识是对活动的外表特征和外部联系的反映。可分为感知和表象两种水平。"},{"id":"2-8-3","subject":"心理学","chapter":"第八章 知识的学习与迁移","number":3,"stem":"知道“三角形的内角和等于180°”，属于（ ）","options":["策略性知识","陈述性知识","条件性知识","程序性知识"],"answer":"B","explanation":"陈述性知识主要说明事物是什么、为什么、怎么样，是个人可以有意识地回忆出来的关于事物及其关系的知识。例如历史事实、数学原理、观点信念都属于陈述性知识。"},{"id":"2-8-4","subject":"心理学","chapter":"第八章 知识的学习与迁移","number":4,"stem":"知道“三角形任意两边长之和都大于第三边”，属于（ ）知识。","options":["陈述性知识","条件性知识","程序性知识","策略性知识"],"answer":"A","explanation":"“三角形任意两边长之和都大于第三边”是一个命题，属于陈述性知识。"},{"id":"2-8-5","subject":"心理学","chapter":"第八章 知识的学习与迁移","number":5,"stem":"研究表明，表征程序性知识的方式是（ ）","options":["命题","直观","图式","概念"],"answer":"C","explanation":"陈述性知识的主要表征形式有命题、命题网络、表象系统以及图式、脚本；程序性知识是以产生式和产生式系统的方式表征的。"},{"id":"2-8-6","subject":"心理学","chapter":"第八章 知识的学习与迁移","number":6,"stem":"程序性知识主要以( )进行表征","options":["产生式","命题","命题网络","信号"],"answer":"A","explanation":"程序性知识是关于“怎么办”的知识，以产生式来表征。陈述性知识是“是什么”的知识，以命题及其命题网络来表征。"},{"id":"2-8-7","subject":"心理学","chapter":"第八章 知识的学习与迁移","number":7,"stem":"关于如何学习和如何思维的知识是（ ）","options":["程序性知识","策略性知识","操作性知识","陈述性知识"],"answer":"B","explanation":"策略性知识是关于“如何学习、如何思维”的知识，是调节自己的注意、记忆、思维的能力的知识，是如何运用陈述性知识和程序性知识的技能，是控制自己的学习与认知过程的知识。"},{"id":"2-8-8","subject":"心理学","chapter":"第八章 知识的学习与迁移","number":8,"stem":"学生技能和能力形成和发展的基础是（ ）","options":["符号学习","概念学习","命题学习","知识学习"],"answer":"D","explanation":"根据头脑内知识的不同形式或学习任务的复杂程度分为：符号学习，概念学习，命题学习。知识学习是学生技能和能力形成和发展的基础，科学知识学习是人们认识世界和改造世界的手段。"},{"id":"2-8-9","subject":"心理学","chapter":"第八章 知识的学习与迁移","number":9,"stem":"( )是一种最简单的学习，是各种复杂学习的基础。","options":["符号学习","概念学习","命题学习","词汇学习"],"answer":"A","explanation":"符号学习是指学习单个符号或一组符号的意义，或者说学习符号本身代表什么。符号学习的内容是词汇学习、非语言符号（如实物、图像、图表、图形等）和事实性知识，是一种最简单的学习。"},{"id":"2-8-10","subject":"心理学","chapter":"第八章 知识的学习与迁移","number":10,"stem":"学习英语单词属于( )","options":["概念学习","符号学习","命题学习","原理学习"],"answer":"B","explanation":"符号学习又译符号表征学习，指学习单个符号或一组符号的意义，也就是说学习他们代表什么。符号表征学习的主要内容是词汇学习，即学习单词代表什么意思。"},{"id":"2-8-11","subject":"心理学","chapter":"第八章 知识的学习与迁移","number":11,"stem":"掌握同类事物的共同的关键特征和本质属性的学习是（ ）","options":["符号学习","感性学习","命题学习","概念学习"],"answer":"D","explanation":"概念学习就是学习把具有共同属性的事物集合在一起并冠以一个名称，把不具有此类属性的事物排除出去。"},{"id":"2-8-12","subject":"心理学","chapter":"第八章 知识的学习与迁移","number":12,"stem":"掌握若干概念之间的关系的学习称为（ ）","options":["符号学习","概念学习","命题学习","推理学习"],"answer":"C","explanation":"符号学习的主要内容是词汇学习，即学习单个词汇的意思。概念学习实质是掌握同类事物的共同的关键特征和本质属性。命题是学习表示若干概念之间的关系概念。推理学习是由一个或几个已知的判断(前提)，推导出一个未知的结论的学习过程。"},{"id":"2-8-13","subject":"心理学","chapter":"第八章 知识的学习与迁移","number":13,"stem":"儿童在知道“菠菜”.“萝卜”和“洋葱”等概念之后，再学习“蔬菜”概念，这种学习是( )","options":["上位学习","下位学习","并列结合学习","归属学习"],"answer":"A","explanation":"上位学习也称总括学习，是指在认知结构中原有的几个观念的基础上学习一个包容性程度更高的命题，即原有的观念是从属观念，而新学习的观念是总括性观念。"},{"id":"2-8-14","subject":"心理学","chapter":"第八章 知识的学习与迁移","number":14,"stem":"学习认知结构的不断分化所依靠的学习形式是（ ）","options":["上位学习","下位学习","并列结合学习","发现学习"],"answer":"B","explanation":"下位学习是一种把新的观念归属于认识的结构中原有观念的某一部位，并使之相互联系的过程。"},{"id":"2-8-15","subject":"心理学","chapter":"第八章 知识的学习与迁移","number":15,"stem":"学习策略是学习者制定的学习计划，由( )构成。","options":["意识和能力","规则和技能","经验和方法","认知策略"],"answer":"B","explanation":"学习策略由规划和技能构成。"},{"id":"2-8-16","subject":"心理学","chapter":"第八章 知识的学习与迁移","number":16,"stem":"学习策略可以分为认知策略.元认知策略和（ ）","options":["组织策略","资源管理策略","学习方法","精细加工策略"],"answer":"B","explanation":"学习策略可以分为认知策略、元认知策略和资源管理策略。"},{"id":"2-8-17","subject":"心理学","chapter":"第八章 知识的学习与迁移","number":17,"stem":"( )是加工信息的一些方法和技术，有助于有效地从记忆中提取信息。","options":["认知策略","元认知策略","基本策略","辅助性策略"],"answer":"A","explanation":"题干是对认知策略的解释。"},{"id":"2-8-18","subject":"心理学","chapter":"第八章 知识的学习与迁移","number":18,"stem":"（ ）包括个体挖掘自己的注意.学习.记忆和创造性思维的能力，它是学会学习的核心成份。","options":["学习策略","认知策略","元认知","学习方法"],"answer":"B","explanation":"认知策略是学习者加工信息的一些方法和技术，其基本功能有两个方面：一是对信息进行有效的加工与整理；二是对信息进行分门别类的系统储存。"},{"id":"2-8-19","subject":"心理学","chapter":"第八章 知识的学习与迁移","number":19,"stem":"工作记忆中为了保持信息，运用内部言语在脑中重现学习材料或刺激，以便将注意力维持在学习材料上的方法是（ ）","options":["复述策略","精细加工策略","组织策略","调节策略"],"answer":"A","explanation":"复述策略是指在工作记忆中为了保持信息，运用内部语言在大脑中重现学习材料或刺激，以便将注意力维持在学习材料上的方法。"},{"id":"2-8-20","subject":"心理学","chapter":"第八章 知识的学习与迁移","number":20,"stem":"利用画线突出关键内容的方法是（ ）","options":["学习工具的利用策略","学习努力和心境管理策略","复述策略","精细加工策略"],"answer":"C","explanation":"利用画线突出关键内容是复述策略的一种方法，故选C。"},{"id":"2-8-21","subject":"心理学","chapter":"第八章 知识的学习与迁移","number":21,"stem":"首字连词法属于（ ）","options":["复述策略","组织策略","精加工策略","元认知策略"],"answer":"C","explanation":"精细加工策略的方法主要有：人为联想策略、形象联想法、谐音联想法、首字连词法。"},{"id":"2-8-22","subject":"心理学","chapter":"第八章 知识的学习与迁移","number":22,"stem":"做笔记属于( )","options":["组织策略","复数策略","元认知策略","精细加工策略"],"answer":"D","explanation":"精细加工策略：是一种将新学材料与头脑中已有知识联系起来从而增加新信息的意义的深层加工策略。常用方法有，运用记忆术、做笔记、提问等。"},{"id":"2-8-23","subject":"心理学","chapter":"第八章 知识的学习与迁移","number":23,"stem":"利用二十四节气歌熟记各个季节，可显著提高记忆效率，这种策略是（ ）","options":["计划策略","组织策略","精细加工策略","学习环境管理策略"],"answer":"C","explanation":"这属于精细加工策略中的歌诀记忆法，把记忆的对象，编成歌诀，读起来抑扬顿挫，唱起来合辙押韵，比较好记。"},{"id":"2-8-24","subject":"心理学","chapter":"第八章 知识的学习与迁移","number":24,"stem":"下列选项中属于精细加工策略的是( )","options":["划线","复述","谐音联想法","列提纲"],"answer":"C","explanation":"常用的精细加工策略有：①记忆术；②做笔记；③提问；④生成性学习；⑤利用背景知识、联系实际。"},{"id":"2-8-25","subject":"心理学","chapter":"第八章 知识的学习与迁移","number":25,"stem":"整合所学新知识之间的内在联系形成新的知识结构学习策略称为（ ）","options":["复述策略","组织策略","调节策略","计划策略"],"answer":"B","explanation":"组织策略即根据知识经验之间的关系，对学习材料进行系统、有序的分类、整理与概括，使之结构合理化。应用组织策略可以对学习材料进行深入的加工，进而促进对所学内容的理解和记忆。"},{"id":"2-8-26","subject":"心理学","chapter":"第八章 知识的学习与迁移","number":26,"stem":"利用网络关系图可以图解解各种观点是如何相互联系的，这种认知策略属于（ ）","options":["组织策略","精细加工策略","复述策略","认识策略"],"answer":"A","explanation":"常见的组织策略主要有：列提纲、利用图形、利用表格、概括和归纳。"},{"id":"2-8-27","subject":"心理学","chapter":"第八章 知识的学习与迁移","number":27,"stem":"学习课文时分段.总结段意属于（ ）","options":["复述策略","计划策略","组织策略","精细加工策略"],"answer":"C","explanation":"组织策略即根据知识经验之间的关系，对学习材料进行系统、有序的分类、整理与概括，使之结构合理化。学习课文时分段、总结段意是对学习材料进行分类和整理。"},{"id":"2-8-28","subject":"心理学","chapter":"第八章 知识的学习与迁移","number":28,"stem":"下列哪一项不属于组织策略（ ）","options":["表格","摘录","列提纲","过度学习"],"answer":"D","explanation":"常见的组织策略主要有：列提纲、利用图形、利用表格、概括和归纳。过度学习属于复述策略。"},{"id":"2-8-29","subject":"心理学","chapter":"第八章 知识的学习与迁移","number":29,"stem":"一个学生根据自己的学习总目标，对学习时间作出总安排，并列出学习日程安排表。这种学习策略属于( )","options":["认知策略","元认知策略","资源管理策略","精细加工策略"],"answer":"C","explanation":"资源管理策略辅助学生管理可用的环境和资源的策略，对学生的动机有重要的作用。它主要包括时间管理策略、学习环境管理策略、努力管理策略、寻求支持策略等。"},{"id":"2-8-30","subject":"心理学","chapter":"第八章 知识的学习与迁移","number":30,"stem":"对有效完成任务所需的技能.策略及其来源的意识称为（ ）","options":["元认知能力","元认知策略","元认知计划","元认知知识"],"answer":"D","explanation":"元认知知识主要包括三方面的内容：有关个人作为学习者的知识、有关任务的知识、有关学习策略及其使用方面的知识。"},{"id":"2-8-31","subject":"心理学","chapter":"第八章 知识的学习与迁移","number":31,"stem":"元认知这一概念的提出者是（ ）","options":["弗洛伊德","弗拉维尔","比纳","德鲁克"],"answer":"B","explanation":"元认知是弗拉维尔于20世纪70年代提出的一个概念，元认知，就是对认知的认知，具体地说，是关于个人自己认知过程的认识和调节这些过程的能力：对思维和学习活动的认识和控制。"},{"id":"2-8-32","subject":"心理学","chapter":"第八章 知识的学习与迁移","number":32,"stem":"（ ）向学生提供有关认知活动或活动进展的信息。","options":["学习策略","认知策略","元认知策略","学习方法"],"answer":"C","explanation":"弗拉维尔认为，认知策略的主要功能是在学生从事的认知活动中，帮助学生达到认知目标，元认知的主要功能是向学生提供有关认知活动或活动进展的信息。"},{"id":"2-8-33","subject":"心理学","chapter":"第八章 知识的学习与迁移","number":33,"stem":"元认知的实质是对认知活动的自我意识和( )","options":["自我控制","自我调节","自我激励","自我学习"],"answer":"A","explanation":"元认知包括元认知知识和元认知控制。例如在教学心理学中常提到“学习如何学习”，指的就是这种次认知。元认知的实质是对认知活动的自我意识和自我调节。"},{"id":"2-8-34","subject":"心理学","chapter":"第八章 知识的学习与迁移","number":34,"stem":"设置学习目标.浏览阅读材料，产生待回答的问题以及分析如何完成学习途径属于（ ）","options":["组织策略","计划策略","监视策略","精细加工策略"],"answer":"B","explanation":"计划策略包括设置学习目标、浏览阅读材料、产生待回答的问题以及分析如何完成学习任务。"},{"id":"2-8-35","subject":"心理学","chapter":"第八章 知识的学习与迁移","number":35,"stem":"考试时注意自己答题速度和时间，属于( )","options":["组织策略","计划策略","学习时间管理策略","监视策略"],"answer":"D","explanation":"监控策略包括阅读时对注意加以跟踪、对材料进行自我提问、考试时监视自己的速度和时间。"},{"id":"2-8-36","subject":"心理学","chapter":"第八章 知识的学习与迁移","number":36,"stem":"帮助学生矫正其学习行为，以补救理解上的不足，属于( )","options":["组织
