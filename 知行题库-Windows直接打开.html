策略","调节策略","监视策略","精细加工策略"],"answer":"B","explanation":"调节策略是根据对认知活动的结果的检查，如发现问题则采取相应的补救措施，根据对认知策略的效果的检查，及时更正、调整认知策略。"},{"id":"2-8-37","subject":"心理学","chapter":"第八章 知识的学习与迁移","number":37,"stem":"在学习过程中根据对认知活动监视的结果，找出认知偏差，及时调整策略或修正目标是( )","options":["领会监控","调节监控","集中注意","计划策略"],"answer":"B","explanation":"调节策略是根据对认知活动的结果的检查，如发现问题则采取相应的补救措施，根据对认知策略的效果的检查，及时更正、调整认知策略。监控策略是指学生对自己学习过程的有效监视和控制，故选B。"},{"id":"2-8-38","subject":"心理学","chapter":"第八章 知识的学习与迁移","number":38,"stem":"下列不属于元认知策略的一项是（ ）","options":["组织策略","监视策略","调节策略","计划策略"],"answer":"A","explanation":"元认知策略包括监视策略、调节策略和计划策略。"},{"id":"2-8-39","subject":"心理学","chapter":"第八章 知识的学习与迁移","number":39,"stem":"利用课余时间读短篇文章或阅读报纸杂志，拓宽自己的知识面，属于( )","options":["计划策略","组织策略","学习时间管理策略","调节策略"],"answer":"C","explanation":"时间管理策略包括统筹安培学习时间，高效利用最佳时间、灵活利用零碎时间。读短篇或看报刊杂志，拓宽自己的知识面，或者背诵诗词和外文单词，这实际上等于在进行分散复习，可提高记忆效率。"},{"id":"2-8-40","subject":"心理学","chapter":"第八章 知识的学习与迁移","number":40,"stem":"已经获得的知识.动作技能.情感和态度等对新的学习的影响称为学习的( )","options":["迁移","动机","策略","技巧"],"answer":"A","explanation":"学习迁移也称训练迁移，是指一种学习对另一种学习的影响，或习得的经验对完成其他活动的影响。迁移广泛存在于各种知识、技能、行为规范与态度的学习中。"},{"id":"2-8-41","subject":"心理学","chapter":"第八章 知识的学习与迁移","number":41,"stem":"根据迁移的性质可以把迁移分为（ ）","options":["水平迁移与垂直迁移","正迁移与负迁移","一般迁移与具体迁移","顺向迁移与逆向迁移"],"answer":"B","explanation":"根据迁移顺序的不同进行划分，迁移分为顺向迁移与逆向迁移。根据迁移的影响效果或性质不同，迁移分为正迁移和负迁移。根据迁移内容的不同，抽象与概括水平，迁移可分为水平迁移与垂直迁移。根据迁移发生的方式上，迁移可分为一般迁移和具体迁移。"},{"id":"2-8-42","subject":"心理学","chapter":"第八章 知识的学习与迁移","number":42,"stem":"一种学习对另一种学习起到积极的促进作用的迁移称为( )","options":["负迁移","正迁移","横向迁移","纵向迁移"],"answer":"B","explanation":"一种学习对另一种学习起到积极的促进作用的迁移称为正迁移。"},{"id":"2-8-43","subject":"心理学","chapter":"第八章 知识的学习与迁移","number":43,"stem":"数学学习中审题技能的掌握可能会促进物理.化学等其他学科审题技能的应用，这是一种( )","options":["正迁移","负迁移","顺向迁移","水平迁移"],"answer":"A","explanation":"正迁移也叫“助长性迁移”，是指一种学习对另一种学习起到积极的促进作用。如学习数学有利于学习物理，学习珠算有利于心算等。对学习起到干扰或抑制作用的则称之为负迁移。顺向迁移是指先前学习对后继学习发生的影响。逆向迁移是指后面的学习影响前面的学习。"},{"id":"2-8-44","subject":"心理学","chapter":"第八章 知识的学习与迁移","number":44,"stem":"地方方言影响学习普通话，这是一种( )","options":["正迁移","负迁移","顺向迁移","逆向迁移"],"answer":"B","explanation":".【解析】负迁移指两种学习之间相互干扰、阻碍，题中所述应为负迁移。"},{"id":"2-8-45","subject":"心理学","chapter":"第八章 知识的学习与迁移","number":45,"stem":"汉语拼音的学习干扰了英语音标的学习。根据迁移的性质，这种迁移属于( )","options":["正迁移","负迁移","垂直迁移","水平迁移"],"answer":"B","explanation":"负迁移一般是指一种学习对另一种学习起干扰或抑制作用。负迁移通常表现为一种学习使另一种学习所需的学习时间或所需的练习次数增加或阻碍另一种学习的顺利进行以及知识的正确掌握。"},{"id":"2-8-46","subject":"心理学","chapter":"第八章 知识的学习与迁移","number":46,"stem":"从迁移的观点看，“温故知新”属于( )","options":["顺向正迁移","顺向负迁移","逆向正迁移","逆向负迁移"],"answer":"A","explanation":"先前的学习对后来的学习的影响，称为顺向迁移，同时还具有促进作用，所以属于顺向正迁移。"},{"id":"2-8-47","subject":"心理学","chapter":"第八章 知识的学习与迁移","number":47,"stem":"心理学家陆钦斯的“量杯实验”证明了( )","options":["迁移现象","学习现象","一般迁移现象","负迁移现象"],"answer":"D","explanation":"陆钦斯的量杯实验是定势影响迁移的典型例证，这种定势阻碍了将其他方法迁移于目前问题的解决，因此表现为一种负迁移。"},{"id":"2-8-48","subject":"心理学","chapter":"第八章 知识的学习与迁移","number":48,"stem":"陆钦斯的量杯实验是( )影响迁移的一个典型例证。","options":["思维","认知","定势","心向"],"answer":"C","explanation":"陆钦斯的量杯实验是定势影响迁移的典型例证，这种定势阻碍了将其他方法迁移于目前问题的解决，因此表现为一种负迁移。"},{"id":"2-8-49","subject":"心理学","chapter":"第八章 知识的学习与迁移","number":49,"stem":"从迁移的观点看“温故而知新”属于( )","options":["顺向正迁移","顺向负迁移","逆向正迁移","逆向负迁移"],"answer":"A","explanation":"“温故而知新”是先前学习对后继学习的促进作用，属于顺向正迁移。"},{"id":"2-8-50","subject":"心理学","chapter":"第八章 知识的学习与迁移","number":50,"stem":"由具有较高概括水平的上位经验与具有较低概括水平的下位经验之间的相互影响而生的迁移称为（ ）","options":["顺向迁移","逆向迁移","水平迁移","垂直迁移"],"answer":"D","explanation":"考查垂直迁移的定义。"},{"id":"2-8-51","subject":"心理学","chapter":"第八章 知识的学习与迁移","number":51,"stem":"根据迁移方向的不同进行划分，迁移分为( )","options":["正迁移与负迁移","顺向迁移与逆向迁移","水平迁移与垂直迁移","一般迁移与具体迁移"],"answer":"B","explanation":"根据迁移顺序的不同进行划分，迁移分为顺向迁移与逆向迁移。根据迁移的影响效果或性质不同，迁移分为正迁移和负迁移。根据迁移内容的不同，抽象与概括水平，迁移可分为水平迁移与垂直迁移。根据迁移发生的方式上，迁移可分为一般迁移和具体迁移。"},{"id":"2-8-52","subject":"心理学","chapter":"第八章 知识的学习与迁移","number":52,"stem":"一种学习中习得的一般原理.方法.策略和态度等迁移到另一种学习中去，是（ ）","options":["垂直迁移","水平迁移","一般迁移","具体迁移"],"answer":"C","explanation":"考查一般迁移的概念。"},{"id":"2-8-53","subject":"心理学","chapter":"第八章 知识的学习与迁移","number":53,"stem":"乘法口诀的掌握可以广泛迁移于各种情景之中，这是一种( )","options":["水平迁移","垂直迁移","一般迁移","具体迁移"],"answer":"C","explanation":"一般迁移是将一种学习中习得的一般原理、方法、策略和态度迁移到另一种学习当中去。用乘法口诀解决日常问题属于一般迁移。"},{"id":"2-8-54","subject":"心理学","chapter":"第八章 知识的学习与迁移","number":54,"stem":"学会写“木.石.口”，有助于学习写“森.磊.品”，这是一种（ ）","options":["顺向迁移","水平迁移","一般迁移","具体迁移"],"answer":"D","explanation":"具体迁移是一种学习中习得的具体的、特殊的经验直接迁移到另一种学习中去，此题中“木、石、口分别为“森、磊、品”的一部分，故选D。"},{"id":"2-8-55","subject":"心理学","chapter":"第八章 知识的学习与迁移","number":55,"stem":"英语学习中，当学完单词“eye”(眼睛)后，再学习“eyeball”(眼球)时，即可以产生( )。","options":["正迁移","负迁移","一般迁移","特殊迁移"],"answer":"D","explanation":"具体迁移也称为特殊迁移，指一种学习中习得的具体的、特殊的经验直接迁移到另一种学习中去，或经过某种要素的重新组合，以迁移到新情境中去。如英语学习中，当学完单词“eye”(眼睛)后，再学习“eyeball”(眼球)时，即可以产生特殊迁移。因此，答案选D。"},{"id":"2-8-56","subject":"心理学","chapter":"第八章 知识的学习与迁移","number":56,"stem":"自发.自动形成的迁移是( )","options":["一般迁移","低路迁移","水平迁移","高路迁移"],"answer":"B","explanation":"低路迁移指经过充分练习的技能自动迁移，不需要反省性思维。例如，开惯了自家车的人可以很轻松地开从朋友那里借来的车。"},{"id":"2-8-57","subject":"心理学","chapter":"第八章 知识的学习与迁移","number":57,"stem":"学校作业越难，学习就越有效。有了这样的训练，会使学生在以后学习和工作中受益无穷。体现的是( )的基本观点。","options":["形式训练说","相同要素说","概括说","奥苏贝尔的认知观"],"answer":"A","explanation":"根据形式训练说理论，在学校教育中，传递知识远不如训练官能来的重要。知识的价值在于作为训练官能的材料。"},{"id":"2-8-58","subject":"心理学","chapter":"第八章 知识的学习与迁移","number":58,"stem":"形式训练迁移理论的代表人物是（ ）","options":["桑代克","贾德","沃尔夫","奥苏伯尔"],"answer":"C","explanation":"沃尔夫是形式训练说的代表人物，形式训练说的心理学基础是官能心理学。它认为心理官能只有通过训练才得以发展，迁移就是心理官能得到训练而发展的结果。"},{"id":"2-8-59","subject":"心理学","chapter":"第八章 知识的学习与迁移","number":59,"stem":"( )首先在形状知觉方面进行了迁移训练的实验研究。","options":["詹姆士","桑代克","伍德沃斯","奥苏贝尔"],"answer":"B","explanation":"形状知觉指对物体的轮廓和边界的整体知觉，桑代克首先对其进行了实验研究。"},{"id":"2-8-60","subject":"心理学","chapter":"第八章 知识的学习与迁移","number":60,"stem":"桑代克和武德沃斯提出的迁移理论是( )","options":["经验类化说","认知结构说","相同要素说","关系转换说"],"answer":"C","explanation":"桑代克和伍德沃斯提出了共同要素说。"},{"id":"2-8-61","subject":"心理学","chapter":"第八章 知识的学习与迁移","number":61,"stem":"相同的刺激与反应的联结，刺激相似，而且反应也相似时，两情境的迁移才能产生，相同联结越多，迁移越大，这种迁移理论是( )","options":["形式训练说","共同要素说","经验类化理论","关系转换理论"],"answer":"B","explanation":"相同要素说认为，一学习之所以有助于另一学习是因为两种学习具有相同因素的原因。若两种情境含有共同因素，不管学习者是否觉察到这种因素的共同性，总有迁移现象发生。"},{"id":"2-8-62","subject":"心理学","chapter":"第八章 知识的学习与迁移","number":62,"stem":"美国心理学家贾德提出的学习迁移理论称为( )","options":["认知结构说","关系转换说","经验类化说","相同要素说"],"answer":"C","explanation":"贾德认为，在先期学习中所获得的东西，之所以能迁移到后期的学习，是因为在先期学习时获得了一般原理，这种原理被称为经验类化说。"},{"id":"2-8-63","subject":"心理学","chapter":"第八章 知识的学习与迁移","number":63,"stem":"根据“水下击靶”实验提出的迁移理论是（ ）","options":["概括化理论","相同要素说","关系理论","产生式理论"],"answer":"A","explanation":"贾德的水中打靶实验，学生对不同深度的靶子都能很快作出调整和适应，他认为是因为学过原理的一组已经把折射原理概括化。"},{"id":"2-8-64","subject":"心理学","chapter":"第八章 知识的学习与迁移","number":64,"stem":"关系转换理论是由( )提出来的迁移理论。","options":["格式塔心理学家","桑代克","布鲁纳","奥苏伯尔"],"answer":"A","explanation":"关系转换理论是格式塔心理学家1929年提出的学习迁移理论。格式塔心理学家从理解事物关系的角度对经验类化的迁移理论进行了重新解释，代表人物是苛勒。"},{"id":"2-8-65","subject":"心理学","chapter":"第八章 知识的学习与迁移","number":65,"stem":"格式塔心理学派认为迁移的决定因素是（ ）","options":["相同要素","心灵的官能","认知结构","顿悟"],"answer":"D","explanation":"格式塔心理学家认为，经顿悟学习而获得的方法既能长久保持，又有利于迁移到新的情境，解决问题。"},{"id":"2-8-66","subject":"心理学","chapter":"第八章 知识的学习与迁移","number":66,"stem":"下列属于影响迁移的个人因素有（ ）","options":["认知结构和态度","智力和学习环境","年龄和学习材料","学习目标和态度"],"answer":"A","explanation":"认知结构、态度、年龄、智力属个人因素。"},{"id":"2-8-67","subject":"心理学","chapter":"第八章 知识的学习与迁移","number":67,"stem":"由于先前活动而形成的心理的一种特殊准备状态称为( )","options":["迁移","固着","定势","原型影响"],"answer":"C","explanation":"考查定势的定义。"},{"id":"2-8-68","subject":"心理学","chapter":"第八章 知识的学习与迁移","number":68,"stem":"下列不属于影响迁移的客观因素的是( )","options":["教师指导","媒体","认知结构","学习的材料特性"],"answer":"C","explanation":"影响迁移的客观因素主要有学习材料的特性、教师的指导、学习情境的相似性、迁移的媒体。C认知结构属于影响迁移的个人因素。"},{"id":"2-9-1","subject":"心理学","chapter":"第九章 学习动机","number":1,"stem":"激发.维持和指引个体学习活动的心理动因或内部动力称为( )","options":["学习需要","学习期待","学习动机","学习态度"],"answer":"C","explanation":"学习动机是指激发个体进行学习活动/维持已引起的学习活动，并使行为朝向一定的学习目标的一种内在过程或内部心理状态。"},{"id":"2-9-2","subject":"心理学","chapter":"第九章 学习动机","number":2,"stem":"个体在学习活动中所要达到目标的主观估计称为( )","options":["学习动机","学习期待","学习归因","学习效能"],"answer":"B","explanation":"学习期待就是学习目标在个体头脑中的反映。"},{"id":"2-9-3","subject":"心理学","chapter":"第九章 学习动机","number":3,"stem":"为了获得他人的赞许.认可和亲近而努力学习的动机是( )","options":["社会交往动机","成就动机","求知动机","自我提高动机"],"answer":"A","explanation":"社会交往动机是在交往需要基础上产生的社会性动机。交往需要表现为每个人都有团体归属感，每个人都希望得到别人的关心、支持、友谊、合作与奖赏。这种需要促使人们结交朋友，寻找支持，参加群体活动，因而形成交往动机。"},{"id":"2-9-4","subject":"心理学","chapter":"第九章 学习动机","number":4,"stem":"激励个体对自己所认为重要的或有价值的工作乐意去做，并努力达到完善地步的一种内部推动力量是( )","options":["成就动机","成功需要","学习动机","满足需要"],"answer":"A","explanation":"成就动机是个体追求自认为重要的有价值的工作，并使之达到完美状态的动机，即一种以高标准要求自己力求取得活动成功为目标的动机。如：具有这种动机因素的学生，就能刻苦努力，战胜学习中的种种困难和障碍﹐取得优良成绩。"},{"id":"2-9-5","subject":"心理学","chapter":"第九章 学习动机","number":5,"stem":"个体的成就动机中含有两种成分：追求成功的倾向和( )","options":["追求利益的倾向","回避失败的倾","回避困难的倾向","追求刺激的向"],"answer":"B","explanation":"个体的成就动机中含有追求成功的倾向和回避失败的倾向两种成分。"},{"id":"2-9-6","subject":"心理学","chapter":"第九章 学习动机","number":6,"stem":"根据学习动机内容的社会意义，可以把学习动机分为( )","options":["直接动机和间接动机","近景的直接性动机和远景的间接性动","内部动机和外部动机","高尚的动机和低级的动机"],"answer":"D","explanation":"根据学习动机内容的社会意义，可以把学习动机分为高尚的动机和低级的动机。"},{"id":"2-9-7","subject":"心理学","chapter":"第九章 学习动机","number":7,"stem":"按学习动机起作用时间的长短，学习动机的种类为( )","options":["高尚的动机与低级的动机","近景的直接动机和远景的间接性动机","主导性动机与辅助性动机","内部学习动机与外部学习动机"],"answer":"B","explanation":"按照学习动机内容的社会意义分为高尚的/正确的学习动机和低级的/错 误的学习动机。按照学习动机起作用的时间长短分为直接的近景性动机和间接的远景性动机。按照学习动机起作用的大小分为主导性学习动机和辅助性学习动机。故选B。"},{"id":"2-9-8","subject":"心理学","chapter":"第九章 学习动机","number":8,"stem":"“为中华之崛起而读书”，这样的学习动机属于( )","options":["近景性内部动机","近景性外部动机","远景性内部动机","远景性外部动机"],"answer":"D","explanation":"内部动机是由内部心理因素转化而成，近景、远景是由学习动机与学习活动的关系及其作用情境来划分的。"},{"id":"2-9-9","subject":"心理学","chapter":"第九章 学习动机","number":9,"stem":"与长远目标相联系的一类动机，具有较高的稳定性和持久性，可称为( )。","options":["直接的近景性动机","间接的近景性动机","远景性动机","直接的远景性动机"],"answer":"C","explanation":"考查远景性动机定义。"},{"id":"2-9-10","subject":"心理学","chapter":"第九章 学习动机","number":10,"stem":"有的中学生“为老师的鼓励而努力学习”.“为家长的奖励而努力学习”.“为同学们瞧得起自己而努力学习”等，这类学习动机属于( )。","options":["直接的近景性动机","间接的近景性动机","直接的远景性动机","间接的远景性动机"],"answer":"B","explanation":"间接近景性动机是社会观念、父母意愿以及教师期望在学生头脑中的反映。例如，有的小学生“为老师的鼓励而努力学习”、“为家长的奖励而努力学习”、“为同学们瞧得起自己而努力学习”等，就属于间接近景性动机，这种学习动机具有不稳定的特性，持久性差。因此，答案选B。"},{"id":"2-9-11","subject":"心理学","chapter":"第九章 学习动机","number":11,"stem":"学生读自己喜欢的故事，解答自己感兴趣的数学题等体现的都是学习动机中的( )。","options":["内部学习动机","外部学习动机","附属内驱力","自我提高内驱力"],"answer":"A","explanation":"内部学习动机是学生对学习本身的一种内在兴趣。"},{"id":"2-9-12","subject":"心理学","chapter":"第九章 学习动机","number":12,"stem":"小明学习不是为了获得家长的赞许，也不是为了赢得名次，只是他发觉知识学习过程本身就有乐趣。根据奥苏伯尔关于学校情境中的成就动机理论，小明的学习动机属于( )","options":["认知内驱力","自我提高内驱力","附属内驱力","自我效能感"],"answer":"A","explanation":"认知內驱力是一种要求了解和理解的需要，以及系统的阐述问题并解决问题的需要，多半从好奇的倾向中派生出来。"},{"id":"2-9-13","subject":"心理学","chapter":"第九章 学习动机","number":13,"stem":"以获得知识为目的的学习动机是( )。","options":["社会交往动机","成就动机","求知动机","自我提高动机"],"answer":"C","explanation":"求知认知又称为认知内驱力，是一种以获得知识为目的的学习动机。"},{"id":"2-9-14","subject":"心理学","chapter":"第九章 学习动机","number":14,"stem":"小学低年级儿童的学习动机主要是( )。","options":["社会交往动机","成就动机","求知动机","自我提高动机"],"answer":"A","explanation":"针对低年级儿童的特点培养和发展学习动机初入学儿童学习动机的特点，主要表现在对学习过程的形式感兴趣。“背起书包上学校”和上课活动本身，对他们有很大的吸引力，成为他们最初的学习动力。"},{"id":"2-9-15","subject":"心理学","chapter":"第九章 学习动机","number":15,"stem":"学生在学习上力争取得好成绩的主观愿望在心理上称作( )","options":["成功需要","学习动机","学业动机","自我实现需要"],"answer":"C","explanation":"学习动机指学生的学习愿望或意向，是学习活动的动力，注重学习本身。而学业动机是学生对学习成果和成就的期望，侧重学习结果和成就感。故选C。"},{"id":"2-9-16","subject":"心理学","chapter":"第九章 学习动机","number":16,"stem":"( )把动机分为认知内驱力.自我提高内驱力和附属内驱力。","options":["布鲁姆","布鲁纳","奥苏伯尔","加涅"],"answer":"C","explanation":"奥苏伯尔认为学校情景中的成就动机由认知内驱力、自我提高内驱力和附属内驱力三个方面组成。"},{"id":"2-9-17","subject":"心理学","chapter":"第九章 学习动机","number":17,"stem":"在儿童早期，( )动机最为突出","options":["认知内驱力","附属内驱力","自我提高内驱力","内部学习动机"],"answer":"B","explanation":"附属内驱力是一个人为了保持长者们（如家长、教师等）的赞许或认可而表现出来的把工作做好的一种需要。"},{"id":"2-9-18","subject":"心理学","chapter":"第九章 学习动机","number":18,"stem":"个体由自己的学业成就而获得相应的地位和威望的需要是( )","options":["认知内驱力","自我提高的内驱力","附属内驱力","成就动机"],"answer":"B","explanation":"成就动机是个体追求自认为重要的有价值的工作，并使之达到完美状态的动机，即一种以高标准要求自己力求取得活动成功为目标的动机。"},{"id":"2-9-19","subject":"心理学","chapter":"第九章 学习动机","number":19,"stem":"自我提高和附属内驱力都不直接指向学习任务本身，是一种间接的学习需要，这属于( )动机。","options":["主导性","辅助性","内部","外部"],"answer":"D","explanation":"自我提高和附属内驱力都不需要外力的驱动，属于内部动机。内部动机指的是人自发的对所从事的活动的一种认知。内部动机直接与活动本身有关，由于做某种事能激发人的兴趣，令人愉快，活动本身就是行动者所追求的目的。"},{"id":"2-9-20","subject":"心理学","chapter":"第九章 学习动机","number":20,"stem":"一般来说，动机程度与学习效率之间呈( )关系。","options":["U型","倒U型","直线型","无规律型"],"answer":"B","explanation":"心理学家的研究指出，动机强度与学习效率的关系并不是线性的关系，而是成倒U型曲线关系。也就是说，学习动机的强度有一个最佳水平，此时学习效率最高；一旦超过了顶峰状态，动机程度过强时就会对活动的结果产生一定的阻碍作用。"},{"id":"2-9-21","subject":"心理学","chapter":"第九章 学习动机","number":21,"stem":"下列关于动机强度与学习效率的关系中，论述正确的是( )","options":["学习动机强度越高，说明学习积极性也越高，学习效果越好","在学校教育中，教师对学生提出的要求越高越有利于学生学习","学习动机强度的最佳水平是固定不变的","动机强度与学习效率的关系不是线性关系，而是呈倒“U”形曲线关系"],"answer":"D","explanation":"动机强度与学习效率的关系并不是线性的关系，而是成倒U型曲线关系。也就是说，学习动机的强度有一个最佳水平，此时学习效率最高；一旦超过了顶峰状态，动机程度过强时就会对活动的结果产生一定的阻碍作用。"},{"id":"2-9-22","subject":"心理学","chapter":"第九章 学习动机","number":22,"stem":"和简单学习相比，( )的动机水平能促进对困难和复杂内容的学习。","options":["相同","较高","较低","很高"],"answer":"C","explanation":"在一般情况下，动机水平增加，学习效果也会提高。但是，动机水平也并不是越高越好，动机水平超过一定限度，学习效果反而更差。任务较容易，最佳动机水平较高；任务难度中等，最佳动机水平也适中；任务越困难，最佳动机水平越低。"},{"id":"2-9-23","subject":"心理学","chapter":"第九章 学习动机","number":23,"stem":"学习动机强度的最佳水平根据( )的不同而不同。","options":["学习效率","教学要求","学习毅力","任务性质"],"answer":"D","explanation":"心理学家耶基斯和多德森的研究表明，学习动机强度的最佳水平不是固定不 变的，而是根据任务性质的不同而不同，在难度不同的任务中，动机的强度影响解决问题的效率。"},{"id":"2-9-24","subject":"心理学","chapter":"第九章 学习动机","number":24,"stem":"一般来讲，容易.简单.枯燥的学习对动机水平的要求，比复杂.思维卷入过多.需要一定的创造性的学习对动机水平的要求 ( )","options":["高","低","一样","因个体的差异而不同"],"answer":"A","explanation":"在学习较容易、较简单的课题时，应尽量使学生保持较高的动机水平，在学习较复杂的课题时，应尽量使气氛轻松自由。"},{"id":"2-9-25","subject":"心理学","chapter":"第九章 学习动机","number":25,"stem":"根据动机水平与学习效果的关系研究，假如考试难度较小，要想取得好成绩，学生学习动机的最佳水平一般应该( )","options":["极高","偏高","中等","偏低"],"answer":"B","explanation":"动机强度与学习效率的关系并不是线性的关系，而是成倒U型曲线关系。也就是说，学习动机的强度有一个最佳水平，此时学习效率最高;一旦超过了顶峰状态，动机程度过强时就会对活动的结果产生一定的阻碍作用。因为动机水平过强，会造成人们内心过度焦虑和紧张的状态，以致干扰了正常的学习记忆和思维活动。"},{"id":"2-9-26","subject":"心理学","chapter":"第九章 学习动机","number":26,"stem":"一般情况下，( )程度的动机激起水平最有利于学习效果的提高。","options":["高等","中等","一般","低等"],"answer":"B","explanation":"美国心理学家耶克斯和多德森认为，中等程度的动机激起水平最有利于学习效果的提高。同时，他们还发现，最佳的动机激起水平与作业难度密切相关：任务较容易，最佳动机激起水平较高；任务难度中等，最佳动机激起水平适中；任务越困难，最佳动机激起水平越低。在学习较容易的内容时，动机水平较高，最有利于学习。"},{"id":"2-9-27","subject":"心理学","chapter":"第九章 学习动机","number":27,"stem":"倾向于选择既存在成功可能性又有足够挑战性的中等难度的任务，这是一种( )动机。","options":["学习","力求成功","避免失败","内在"],"answer":"B","explanation":"阿特金森把个体的成就分成两类：一类是力求成功的动机；另一类是避免失败的动机。力求成功者的目的是获取成功，所以他们会选择既存在的成功可能性又有足够挑战性的中等难度的任务；当他们面对完全不可能或稳操胜券的任务时，动机水平反而会下降。相反，避免失败者则倾向于选择非常容易或非常困难的任务，因为选择容易的任务可以保证成功，使自己免遭失败；而选择极其困难的任务，即使失败，也可以找到适当的借口，得到自己喝他人的原谅，从而减少失败感。"},{"id":"2-9-28","subject":"心理学","chapter":"第九章 学习动机","number":28,"stem":"一种认识或积极趋近某事物的倾向，是成就动机的重要部分的是( )","options":["理想","兴趣","毅力","信念"],"answer":"B","explanation":"兴趣是一种认识或积极趋近某事物的倾向，是成就动机的重要组成部分。"},{"id":"2-9-29","subject":"心理学","chapter":"第九章 学习动机","number":29,"stem":"美国心理学家( )对行为结果的归因进行了系统探讨。","options":["班杜拉","奥苏伯尔","维纳","阿特金森"],"answer":"C","explanation":"美国心理学家维纳对行为结果的归因进行了系统探讨，并把归因分为三个维度：内外源、稳定性和控制性。"},{"id":"2-9-30","subject":"心理学","chapter":"第九章 学习动机","number":30,"stem":"有人把学业失败的原因说成是努力不够，这种归因属于( )","options":["内部而稳定的归因","外部而不稳定的归因","外部而稳定的归因","内部而不稳定的归因"],"answer":"D","explanation":"根据韦纳的归因理论，努力属于内部、可控、不稳定的因素。"},{"id":"2-9-31","subject":"心理学","chapter":"第九章 学习动机","number":31,"stem":"习得性无助是因为个体把失败总是归因于( )","options":["努力程度","工作难度","能力","运气"],"answer":"C","explanation":"习得性无助让人们自设樊篱，把失败的原因归结为自身不可改变的因素，放弃继续尝试的勇气和信心。破罐子破摔，比如，认为学习成绩差是因为自己智力不好，失恋是因为自己本身就令人讨厌等。"},{"id":"2-9-32","subject":"心理学","chapter":"第九章 学习动机","number":32,"stem":"人们对自己能否成功地从事某一成就行为的主观判断称为( )","options":["自我成就感","自我归因感","自我期待感","自我效能感"],"answer":"D","explanation":"自我效能感指个体对自己是否有能力完成某一行为所进行的推测与判断。"},{"id":"2-9-33","subject":"心理学","chapter":"第九章 学习动机","number":33,"stem":"自我效能感理论最早由( )提出。","options":["阿特金森","奥苏伯尔","班杜拉","维纳"],"answer":"C","explanation":"社会学习理论的创始人班杜拉从社会学习的观点出发，在1982年提出了自我效能理论，用以解释在特殊情景下动机产生的原因。自我效能感是个人对自己完成某方面工作能力的主观评估。评估的结果如何，将直接影响到一个人的行为动机。"},{"id":"2-10-1","subject":"心理学","chapter":"第十章 教师心理","number":1,"stem":"角色扮演的先决条件是( )","options":["角色认知","角色期待","角色认同","角色信念"],"answer":"A","explanation":"角色认知是角色扮演的先觉条件，个人能否成功扮演某种角色，首先取决于其对这一角色的认知程度。"},{"id":"2-10-2","subject":"心理学","chapter":"第十章 教师心理","number":2,"stem":"成熟地扮演教师角色的情感基础是( )","options":["角色认知","角色认同","角色期待","角色信念"],"answer":"B","explanation":"对教师角色的认同，是成熟地扮演教师角色的情感基础，新手型教师在向熟手型教师转化过程中可体验到这种情感。"},{"id":"2-10-3","subject":"心理学","chapter":"第十章 教师心理","number":3,"stem":"个体亲身体验并接受教师角色所承担的社会职责,用以控制和衡量自己的行为。这是( )","options":["角色认知","角色期待","角色认同","角色信念"],"answer":"C","explanation":"略。"},{"id":"2-10-4","subject":"心理学","chapter":"第十章 教师心理","number":4,"stem":"老赵自从当上班主任之后,花在工作上的时间大大增加,辛勤的付出终于换来了班级面貌的改变。可是儿子的叛逆以及高考的落榜让他很内疚,自己虽然是个合格的教师,却不是个合格的父亲。在赵身上出现了( )","options":["角色期望","角色冲突","角色认识","角色失败"],"answer":"B","explanation":"角色冲突是指个人经常要求扮演与他们的价值系统不一致的角色，或同时扮演两种以上相互冲突的角色.老赵身上体现的是“合格的教师”与“合格的父亲”的角色冲突。"},{"id":"2-10-5","subject":"心理学","chapter":"第十章 教师心理","number":5,"stem":"教师职业信念是指教师对成为一个成熟的教育教学专业工作者的( )","options":["向往和追求","了解和认识","认识和应用","认同和内化"],"answer":"A","explanation":"教师的职业信念是指教师对成为一个成熟的教育教学专业工作者的向往和追求，它为教师提供了奋斗的目标，是推动教师成长的巨大动力。"},{"id":"2-10-6","subject":"心理学","chapter":"第十章 教师心理","number":6,"stem":"教师知识结构的核心是（ ）","options":["具有精深的专业知识","具备广博的知识","必备的教育科学理论","丰富的个体实践知识"],"answer":"A","explanation":"精深的专业知识。这是教师知识结构的核心，也是教师用以向学生传授知识的必备基础。教师为了出色地完成教学任务，必须精通所教学科的基础知识，熟悉学科的基本结构和各部分知识之间的内在联系，了解学科的发展动向和最新研究方向。"},{"id":"2-10-7","subject":"心理学","chapter":"第十章 教师心理","number":7,"stem":"（ ）是从事教学工作的基础。","options":["敏锐的观察能力","较强的言语表达能力","灵活的组织教学能力","知识创新能力"],"answer":"A","explanation":"敏锐的观察能力是从事教学工作的基础。敏锐的观察力需要教师利用课堂教学和课后与学生的交往进行刻意锻炼才能形成。"},{"id":"2-10-8","subject":"心理学","chapter":"第十章 教师心理","number":8,"stem":"教育行为是教育素质的（ ）形式。","options":["内化","外化","示范","仿效"],"answer":"B","explanation":"教学行为是教师素质的外化形式，它既是一种技术，更是一种艺术。"},{"id":"2-10-9","subject":"心理学","chapter":"第十章 教师心理","number":9,"stem":"教师认为自己能够有效地影响学生,相信自己具有教好学生的能力。这是( )","options":["一般教学效能感","特殊教学效能感","个人教学效能感","普通教学效能感"],"answer":"C","explanation":"教学效能感分为:一般教学效能感和个人教学效能感.前者指教师对教与学的关系、教育在学生身心发展中的作用等问题的一般看法和判断，后者指教师认为自己能够有效地影响学生，相信自己具有教好学生的能力。"},{"id":"2-10-10","subject":"心理学","chapter":"第十章 教师心理","number":10,"stem":"皮格马利翁效应的实验者是( )","options":["布鲁纳","加涅","罗森塔尔","波斯纳"],"answer":"C","explanation":"罗森塔尔等人提出了皮格马利翁效应。"},{"id":"2-10-11","subject":"心理学","chapter":"第十章 教师心理","number":11,"stem":"罗森塔尔效应体现了教师的( )对学生的影响.","options":["知识结构","人格特征","能力结构","期望"],"answer":"D","explanation":"罗森塔尔效应又叫皮革马利翁效应，在此指教师的期望对学生学习的影响。"},{"id":"2-10-12","subject":"心理学","chapter":"第十章 教师心理","number":12,"stem":"经过暑假的努力学习,小英的英语成绩突飞猛进,他的班主任却对其进步持怀疑态度。这一现象是( )","options":["教师期望效应","皮格马利翁效应","自我应验","维持性期望效应"],"answer":"D","explanation":"老师认为学生将维持以前的发展模式，而对学生特别是差生的改变视而不见，甚至否认的现象就是维持期望效应。"},{"id":"2-10-13","subject":"心理学","chapter":"第十章 教师心理","number":13,"stem":"教师的领导风格对课堂管理( )","options":["有直接影响","有间接影响","没有影响","有一定影响"],"answer":"A","explanation":"教师不同的领导风格对课堂管理有直接的影响。"},{"id":"2-10-14","subject":"心理学","chapter":"第十章 教师心理","number":14,"stem":"处于关注( )阶段的教师会关心“学生喜欢我吗”“同事们如何看我”等问题。","options":["教材","学生","情境","生存"],"answer":"D","explanation":"处于关注生存阶段的一般是新教师，他们非常关注自己的生存适应性，最担心的问题是“学生喜欢我吗”“同事们如何看我”“领导是否觉得我干得不错”等。"},{"id":"2-10-15","subject":"心理学","chapter":"第十章 教师心理","number":15,"stem":"新教师一般处于( )","options":["关注情境阶段","关注学生阶段","关注教学阶段","关注生存阶段"],"answer":"D","explanation":"新教师在开始时一般都处于关注生存阶段。"},{"id":"2-10-16","subject":"心理学","chapter":"第十章 教师心理","number":16,"stem":"教师关心的是如何教好每一堂课的内容，则该教师处于( )。","options":["关注生存阶段","关注情境阶段","关注学生阶段","关注发展阶段"],"answer":"B","explanation":"当教师感到自己完全能够生存时，便把关注的焦点投向了提高学生的成绩即进入了关注情境阶段。在此阶段教师关心的是如何教好每一堂课的内容。"},{"id":"2-10-17","subject":"心理学","chapter":"第十章 教师心理","number":17,"stem":"能否（ ）是衡量一个教师是否成长成熟的重要标志之一。","options":["关注生存","关注情境","关注学生","关注学风"],"answer":"C","explanation":"教师成长分为三个阶段：关注生存阶段、关注情境阶段、关注学生阶段。能否自觉关注学生是衡量一个教师是否成熟的重要标志之一。"},{"id":"2-10-18","subject":"心理学","chapter":"第十章 教师心理","number":18,"stem":"专家型教师和新手型教师之间最基本的差异在于( )","options":["实践力方面","观察力方面","反思力方面","专业知识方面"],"answer":"D","explanation":"专家与新手之间最基本的差异在于专业知识方面。"},{"id":"2-10-19","subject":"心理学","chapter":"第十章 教师心理","number":19,"stem":"下列选项中，不是专家教师与新教师在课堂过程中的差异的一项是（ ）","options":["课堂规则的制定与执行","教材的呈现","课时计划的安排","课堂练习"],"answer":"C","explanation":"专家教师与新教师在课堂过程中的差异主要表现为课堂规则的制定与执行、教材的呈现、课堂练习、吸引学生的注意力、教学策略的运用。"},{"id":"2-10-20","subject":"心理学","chapter":"第十章 教师心理","number":20,"stem":"专家型教师通常是用( )方法,慢慢地引人要讲的教学内容.","options":["开门见山式","迂回曲折式","导入式","实验"],"answer":"C","explanation":"略。"},{"id":"2-10-21","subject":"心理学","chapter":"第十章 教师心理","number":21,"stem":"专家型教师的课时计划简洁.灵活，以( )为中心，并有预见性","options":["学生","教师","教材","教学思想"],"answer":"A","explanation":"对教师课时计划的分析表明，与新教师相比，专家教师的课时计划简洁、灵活、以学生为中心，并具有预见性，这也是新教师在课时计划的制定上需要进行改进和发展的。"},{"id":"2-10-22","subject":"心理学","chapter":"第十章 教师心理","number":22,"stem":"在解决困难问题时,专家型教师用于表征问题的时间与新手型教师相比( )","options":["更长","更短","一样","说不清"],"answer":"B","explanation":"善于解决问题的专家与新手的区别，就在于前者具备有关问题的大量知识并善于实际应用这些知识来解决问题.因此，专家型教师表征问题的时间相对比较短。"},{"id":"2-10-23","subject":"心理学","chapter":"第十章 教师心理","number":23,"stem":"以人的先天禀赋为基础，通过师资训练和自我提高而形成的身心特征与职业修养是指（ ）","options":["教师品质","教师职业道德","教师职业修养","教师素质"],"answer":"D","explanation":"考查教师素质的定义。教学素质是指以人的先天禀赋为基础。通过师资训练和自我提高而形成的身心特征与职业修养。它主要体现在教育观念、个性修养、职业道德、知识水平、教学经验、组织能力、行为效能等方面。"},{"id":"2-10-24","subject":"心理学","chapter":"第十章 教师心理","number":24,"stem":"个体在长期的职业压力下，缺乏应对资源和应对能力而产生的身心耗竭状态是( )","options":["角色冲突","角色混乱","职业倦态","职业压力"],"answer":"C","explanation":"职业倦怠指个体在长期的职业压力下，缺乏应对资源和应对能力而产生的身心耗竭状态。"},{"id":"2-10-25","subject":"心理学","chapter":"第十章 教师心理","number":25,"stem":"一个老师总觉得自己工作没有意义和价值,这种情况属于职业倦怠中的( )","options":["情绪耗竭","波斯纳","玛勒斯","罗斯塔尔"],"answer":"C","explanation":"玛勒斯等人认为职业倦怠主要表现在三个方面:情绪耗竭、去人性化、个人成就感低.第三个表现为消极地评价自己，贬低自己工作的意义和价值。"},{"id":"2-10-26","subject":"心理学","chapter":"第十章 教师心理","number":26,"stem":"面对职业压力所采用的认知和行为方式的改变以及情绪的调整,称为( )","options":["应对","解决","消除","缓解"],"answer":"A","explanation":"应对是指面对职业压力所采用的认知和行为方式的改变以及情绪的调整.应对策略包括:直接行动法和缓解方法。"},{"id":"2-10-27","subject":"心理学","chapter":"第十章 教师心理","number":27,"stem":"个体心理活动在自身及环境条件许可范围内所能达到的最佳功能状态是( )","options":["心理健康","自我意识","心理状态","心理发展"],"answer":"A","explanation":"心理健康是个体心理活动在自身及环境条件许可范围内所能达到的最佳功能状态.心理健康的个体能够充分发挥自己的最大潜能，要善处理和适应人与人之间、人与社会环境之间的相互关系。"},{"id":"2-10-28","subject":"心理学","chapter":"第十章 教师心理","number":28,"stem":"在下列教师行为中,属于心理健康表现的是( )","options":["交往中,将关系建立在互惠的基础上","冷静的处理课堂上的突发事件","将生活中的不愉快情绪带入课堂,迁怒于学生","偏爱甚至袒护学习或者成绩好的学生"],"answer":"B","explanation":"略。"},{"id":"3-1-1","subject":"教育政策与法规","chapter":"教育政策与法规","number":1,"stem":"中小学教师资格由( )人民政府教育行政主管部门认定。","options":["省级以上","市级以上","县级以上","乡级以上"],"answer":"C","explanation":"本题是对《中华人民共和国教师法》重要条文的考查。《中华人民共和国教师法》第十三条规定，中小学教师资格由县级以上地方人民政府教育行政部门认定。"},{"id":"3-1-2","subject":"教育政策与法规","chapter":"教育政策与法规","number":2,"stem":"《中华人民共和国未成年人保护法》中的“未成年人”是指未满( )周岁。","options":["10","14","16","18"],"answer":"D","explanation":"见《中华人民共和国未成年人保护法》第二条。"},{"id":"3-1-3","subject":"教育政策与法规","chapter":"教育政策与法规","number":3,"stem":"( )年颁布的《中华人民共和国宪法》第46条规定：“国家培养青年、少年、儿童在品德、智力、体质等方面全面发展。”这是我国当代历史上第一个以法的面貌出现的教育目的。","options":["1954","1975","1978","1982"],"answer":"D","explanation":"见1982年《中华人民共和国宪法》第46条。"},{"id":"3-1-4","subject":"教育政策与法规","chapter":"教育政策与法规","number":4,"stem":"根据《未成年人保护法》和《预防未成年人犯罪法》的规定，对未成年人犯罪一律不公开审理的年龄是( )","options":["14周岁以下","14周岁以上不满16周岁","16周岁以上不满17周岁","18周岁以下"],"answer":"B","explanation":"《未成年人保护法》和《预防未成年人犯罪法》的规定，对未成年人犯罪一律不公开审理的年龄是14周岁以上不满16周岁。"},{"id":"3-1-5","subject":"教育政策与法规","chapter":"教育政策与法规","number":5,"stem":"王某担任某县高二英语教师期间通过了硕士研究生入学考试，学校以王某服务期未满、学校英语教师不足为由不予批准王某在职学习。王某欲以剥夺其参加进修权利为由提出申诉，受理申诉的机构应当( )","options":["当地县教育局","当地县人民政府","地市教育局","省教育厅"],"answer":"A","explanation":"对教师提出的申诉的受理机构是当地教育行政部门。王某在某县就职，因此王某的申诉由当地县教育局受理。"},{"id":"3-1-6","subject":"教育政策与法规","chapter":"教育政策与法规","number":6,"stem":"《教育法》规定，明知校舍或者教育教学设施有危险，而不采取措施，造成人员伤亡或者重大财产损失的，对直接负责的主管人员和其他直接责任人员，依法追究( )","options":["民事责任","刑事责任","一般责任","行政责任"],"answer":"B","explanation":"见《教育法》第七十三条。"},{"id":"3-1-7","subject":"教育政策与法规","chapter":"教育政策与法规","number":7,"stem":"根据我国《宪法》的规定，国务院有权制定和发布( )","options":["教育法律","教育行政法规","教育政府规章","教育单行条例"],"answer":"B","explanation":"国务院只能发布法规性文件，法律只能由人大来制定。"},{"id":"3-1-8","subject":"教育政策与法规","chapter":"教育政策与法规","number":8,"stem":"某寄宿小学派车接送学生，途中有学生提出要上厕所，司机在路边停车5分钟，5分钟过后，司机没有清点人数就将车开走。小学生王某从厕所出来发现车已经开走，急忙追赶。在追赶过程中摔倒在地，将门牙跌落三颗。王某的伤害由谁承担责任？( )","options":["司机负责","某寄宿学校负责","司机和某寄宿学校共同负责","司机和王某共同负责"],"answer":"B","explanation":"寄宿小学，这个时候对孩子的监管权是由学校来承担，学校应履行义务，但学校没有履行义务，所以学校应承担全部责任。"},{"id":"3-1-9","subject":"教育政策与法规","chapter":"教育政策与法规","number":9,"stem":"《义务教育法》规定接受义务教育的初始阶段的法定年龄为( )","options":["6周岁","5周岁","7周岁","8周岁"],"answer":"A","explanation":"凡年满六周岁的儿童，其父母或者其他法定监护人应当送其入学接受并完成义务教育。"},{"id":"3-1-10","subject":"教育政策与法规","chapter":"教育政策与法规","number":10,"stem":"( )是现代教育的重要特征。","options":["以法制教","依法治教","校长负责制","教职工代表大会"],"answer":"B","explanation":"依法治教是时代发展的要求现代社会是法制社会，现代社会的教育是在法制轨道上运行的教育，教育法制是现代教育的重要特征。"},{"id":"3-1-11","subject":"教育政策与法规","chapter":"教育政策与法规","number":11,"stem":"一学生王某课外活动时在操场上翻单杠，单杠因年久失修突然断裂，王某从单杠上落在硬地上，造成骨折，谁应对王某的伤害负担责任( )","options":["王某自己责任","王某的父母或其它监护人负责","学校负责","以上各方均不负责"],"answer":"C","explanation":"学校对未成年人的人身安全应采取措施予以保护，对未成年人在校内发生人身伤害事故时，应及时救护、妥善处理。故林某的伤害应由学校负责。"},{"id":"3-1-12","subject":"教育政策与法规","chapter":"教育政策与法规","number":12,"stem":"下列各项中，不属于教育法规的是( )","options":["《义务教育法》","《学校体育工作条例》","《教师法》","《劳动法》"],"answer":"D","explanation":"《劳动法》属于经济法。"},{"id":"3-1-13","subject":"教育政策与法规","chapter":"教育政策与法规","number":13,"stem":"按照制定的时间先后顺序排列下列各项( ) ①《教育法》②《教师法》 ③《义务教育法》 ④《未成年人保护法》⑤《预防未成年人犯罪法》","options":["①②③④⑤","③④②①⑤","⑤④③②①","③④①②⑤"],"answer":"B","explanation":"《中华人民共和国教育法》1995年3月18日通过，自1995年9月1日起施行；《中华人民共和国教师法》1993年10月31日通过，自1994年1月1日起施行；《中华人民共和国未成年人保护法》1991年9月4日通过，自1992年1月1日起施行；《中华人民共和国义务教育法》1986年4月12日通过，自1986年7月1日起施行；《中华人民共和国预防未成年人犯罪法》于1999年6月28日通过公布，自1999年11月1日起施行。"},{"id":"3-1-14","subject":"教育政策与法规","chapter":"教育政策与法规","number":14,"stem":"在学校实施的教育教学活动或者学校组织的校外活动中，以及在学校负有管理责任的校舍、场地、其他教育教学设施、生活设施内发生的，由于学校、教师疏忽没有预见或者已经预见而轻信能够避免而造成学生人身损害后果的事故，叫做( )","options":["意外事故","学校事故","学生事故","教育事故"],"answer":"B","explanation":"根据《学生意外伤害处理办法》，此事故称为学校事故。"},{"id":"3-1-15","subject":"教育政策与法规","chapter":"教育政策与法规","number":15,"stem":"《未成年人保护法》27条规定“任何人不得在中小学、幼儿园、托儿所的教室、寝室或其他未成年人集中活动的室内吸烟。”这是为了保障儿童的( )。","options":["生存权利","受教育权利","受尊重权利","安全权利"],"answer":"D","explanation":"为保障儿童的安全权利，《中华人民共和国未成年人保护法》规定任何人不得在中小学、幼儿园、托儿所的教室、寝室、活动室或其他未成年人集体活动的室内吸烟”"},{"id":"3-1-16","subject":"教育政策与法规","chapter":"教育政策与法规","number":16,"stem":"“任何组织和个人不得披露未成年人的个人隐私。”反映了我国法律所规定的少年儿童合法权利中的( )","options":["受教育的权利","受尊重的权利","安全的权利","生存的权利"],"answer":"B","explanation":"“任何组织和个人不得披露未成年人的个人隐私。”反映了我国法律所规定的少年儿童合法权利中的受尊重的权利。"},{"id":"3-1-17","subject":"教育政策与法规","chapter":"教育政策与法规","number":17,"stem":"如果学校或教师在工作中有某些过失，但这些过失不是构成学生伤害事故的原因，而仅是发生事故的一种条件，则学校或教师( )责任。","options":["完全不承担","几乎不承担","承担部分","承担全部"],"answer":"C","explanation":"在这种情况下，学校或教师承担部分责任。"},{"id":"3-1-18","subject":"教育政策与法规","chapter":"教育政策与法规","number":18,"stem":"学校按政策就近入学，各校办学是有计划按需进行，适龄者都可享有教育权利，校际之间不受竞争影响。体现了学校组织的哪一种特征？( )","options":["程序性","垄断性","非自愿性","公益性"],"answer":"D","explanation":"体现了学校组织的公益性特征。"},{"id":"3-1-19","subject":"教育政策与法规","chapter":"教育政策与法规","number":19,"stem":"教师对学校或者其他教育机构侵犯其合法权益的，或者对学校或者其他教育机构作出的处理不服的，可以向教育行政部门提出申诉，教育行政部门应当在接到申诉的次日起____内作出处理。( )","options":["15 日","20 日","30 日","60 日"],"answer":"C","explanation":"《教师法》第三十九规定：“教师对学校或者其他教育机构侵犯其合法权益的，或者对学校或者其他教育机构作出的处理不服的，可以向教育行政部门提出申诉，教育行政部门应当在接到申诉的三十日内，作出处理。"},{"id":"3-1-20","subject":"教育政策与法规","chapter":"教育政策与法规","number":20,"stem":"在学生伤害事故处理中，学校责任适用的归责原则是：( )","options":["过错责任原则","无过错责任原则","严格责任原则","公平原则"],"answer":"A","explanation":"本题是对《学生伤害事故处理办法》的考查。在学生伤害事故处理中，对学校归责时，应适用过错责任原则为主，兼顾公平原则。即只有校方对校园事故发生的确有过错时才承担责任，对事故发生当事人无过错时——可按公平原则由当事人适当分担经济损失。"},{"id":"3-1-21","subject":"教育政策与法规","chapter":"教育政策与法规","number":21,"stem":"《教师法》是( )年1月1日起，正式实施的。","options":["1991年","1992年","993年","1994年"],"answer":"D","explanation":"《中华人民共和国教师法》1993年10月31日通过，自1994年1月1日起施行。"},{"id":"3-1-22","subject":"教育政策与法规","chapter":"教育政策与法规","number":22,"stem":"我国于( )在六届人大四次会议上通过《义务教育法》","options":["1986年5月","1986年4月","1987年4月","1988年5月"],"answer":"A","explanation":"《中华人民共和国义务教育法》1986年4月12日通过，自1986年7月1日起施行"},{"id":"3-1-23","subject":"教育政策与法规","chapter":"教育政策与法规","number":23,"stem":"为保护未成年人的身心健康，促进义务教育的实施，维护未成年人的合法权益，以下不属于制定《禁止使用童工规定》依据的是。( )","options":["宪法","教育法","劳动法","未成年人保护法"],"answer":"B","explanation":"根据《禁止使用童工规定》第一条：为保护未成年人的身心健康，促进义务教育制度的实施，维护成年人的合法权益，根据宪法和劳动法，未成年保护法，制定本规定。"},{"id":"3-1-24","subject":"教育政策与法规","chapter":"教育政策与法规","number":24,"stem":"《教师资格条例》是( )","options":["教育基本法律","教育行政法规","政府规章","教育单行法律"],"answer":"B","explanation":"行政法规是国务院为领导和管理国家各项行政工作，根据宪法和法律，并且按照《行政法规制定程序条例》的规定而制定的政治、经济、教育、科技、文化、外事等各类法规的总称。所以《教师资格条例》是由国务院颁布的，在全国范围内施行的行政法规。"},{"id":"3-1-25","subject":"教育政策与法规","chapter":"教育政策与法规","number":25,"stem":"2008年( )，教育部发布了《中小学教师职业道德规范（2008年修订）》。","options":["9月1日","9月2日","9月3日","9月10日"],"answer":"A","explanation":"2008年9月1日 教育部发布了《中小学教师职业道德规范（2008年修订）》"},{"id":"3-1-26","subject":"教育政策与法规","chapter":"教育政策与法规","number":26,"stem":"《中小学教师职业道德规范（2008年修订）》首次把“( )”列入其中，并增加了“关心学生健康”“关心集体”等内容。","options":["忠诚于人民教育事业","循循善诱，诲人不倦","严于律己，以身作则","保护学生安全"],"answer":"D","explanation":"见《中小学教师职业道德规范（2008年修订）》。"},{"id":"3-1-27","subject":"教育政策与法规","chapter":"教育政策与法规","number":27,"stem":"下列情形导致学生伤害，学校行为并无不当，不承担事故责任的是( )","options":["学校教师体罚或者变相体罚学生。","学生在校期间突发疾病或者受到伤害，学校发现，但未根据实际情况及时采取相应措施，导致不良后果加重的。","在学生自行上学、放学、返校、离校途中发生的。","学校向学生提供的药品、食品、饮用水等不符合国家或者行业的有关标准、要求的。"],"answer":"C","explanation":"下列情形下发生的造成学生人身损害后果的事故，学校行为并无不当的，不承担事故责任；事故责任应当按有关法律法规或者其他有关规定认定：(一)在学生自行上学、放学、返校、离校途中发生的；(二)在学生自行外出或者擅自离校期间发生的；(三)在放学后、节节假日或者假期等学校工作时间以外，学生自行滞留学校或者自行到校发生的；(四)其他在学校管理职责范围外发生的。"},{"id":"3-1-28","subject":"教育政策与法规","chapter":"教育政策与法规","number":28,"stem":"下列不能作为教育法律关系主体的是( )","options":["家庭","国家","自然人","法人"],"answer":"A","explanation":"教育法律关系主体 指教育法律关系的参加者，即在教育法律关系中享有权利和承担义务者，是教育法律关系的构成要素之一。可以成为教育法律关系主体的自然人和法人有：教育行政机关，其他国家机关，学校及其他教育机构、教育者、学生及其他受教育者、企事业单位、社会组织和其他公民等。在华的外国人、无国籍人，财团法人也可以成为我国教育法律关系的主体。"},{"id":"3-1-29","subject":"教育政策与法规","chapter":"教育政策与法规","number":29,"stem":"明知校舍有问题而不加以修缮属于( )","options":["作为","不作为","事件","选择性作为"],"answer":"B","explanation":"属于不作为。"},{"id":"3-1-30","subject":"教育政策与法规","chapter":"教育政策与法规","number":30,"stem":"我国最早提出实行九年义务教育的文件是( )","options":["《关于教育工作的指示》","《中共中央关于教育体制改革的决定》","《中国教育改革和发展纲要》","《中共中央.国务院关于深化教育改革，全面推进素质教育的决定》"],"answer":"B","explanation":"1985年5月 《中共中央关于教育体制改革的决定》提出，我们完全有必要也有可能把实行九年制义务教育当作关系民族素质提高和国家兴旺的大事，突出地提出来，动员全党、全社会和全国各族人民，用最大的努力，积极地、有步骤地予以实施。为此，需要制订义务教育法，经全国人大审议通过后颁行。"},{"id":"3-1-31","subject":"教育政策与法规","chapter":"教育政策与法规","number":31,"stem":"有一位体育教师品行不良，在自己情绪不好时常侮辱学生，影响恶劣，一次课中将学生踢伤，情节严重，构成犯罪。根据《中华人民共和国教师法》应( )。","options":["给予行政处分","解聘","依法追究刑事责任","承担民事责任"],"answer":"C","explanation":"此行为已构成犯罪，据《中华人民共和国教师法》应依法追究刑事责任。"},{"id":"3-1-32","subject":"教育政策与法规","chapter":"教育政策与法规","number":32,"stem":"《中华人民共和国教师法》颁布于( )。","options":["1993、10、31","1992、10、31","1994、1、1","1986、4、12"],"answer":"A","explanation":"《中华人民共和国教师法》1993年10月31日通过，自1994年1月1日起施行。"},{"id":"3-1-33","subject":"教育政策与法规","chapter":"教育政策与法规","number":33,"stem":"《教育规划纲要》提出，把________作为教育工作的根本要求。( )","options":["以学生为主体","以教师为主导","充分发挥学生的主动性","育人为本"],"answer":"D","explanation":"见《教育规划纲要》。"},{"id":"3-1-34","subject":"教育政策与法规","chapter":"教育政策与法规","number":34,"stem":"教育发展的强大动力是( )","options":["改革创新","教师培训","科学管理","提高质量"],"answer":"A","explanation":"教育的发展在于改革,教育的改革在于创新,教育的改革过程就是一个吐故纳新、优胜劣汰的创新过程,改革创新是教育发展的强大动力。"},{"id":"3-1-35","subject":"教育政策与法规","chapter":"教育政策与法规","number":35,"stem":"教育公平的重点是( )①机会公平 ②保障公民依法享有受教育的权利 ③促进义务教育均衡发展④扶持困难群体","options":["①②","②③","①③","③④"],"answer":"B","explanation":"教育公平的重点是保障公民依法享有受教育的权利、进义务教育均衡发展。"},{"id":"3-1-36","subject":"教育政策与法规","chapter":"教育政策与法规","number":36,"stem":"招生选拔的标准和途径过于单一，以统一的一次性考试成绩作为学生升学的唯一标准，造成的弊端是( )","options":["教学水平低","学生厌学","一考定终身","教师职业倦怠"],"answer":"C","explanation":"此种选拔标准最大的弊端是一考定终身。"},{"id":"3-1-37","subject":"教育政策与法规","chapter":"教育政策与法规","number":37,"stem":"义务教育的战略性任务是( )","options":["全面发展","均衡发展","能力为重","德育为先"],"answer":"B","explanation":"均衡发展是我国义务教育的战略性任务，是义务教育本质属性的要求，是政府公共服务的法定职责，更是促进教育公平、构建社会主义和谐社会的重要举措，将为全面实施素质教育提供宽松的环境。"},{"id":"3-1-38","subject":"教育政策与法规","chapter":"教育政策与法规","number":38,"stem":"《教育规划纲要》提出，立德树人，把______ 融入国民教育全过程。（ ）","options":["爱国主义","集体主义","民主法制","社会主义核心价值体系"],"answer":"D","explanation":"见《教育规划纲要》。"},{"id":"3-1-39","subject":"教育政策与法规","chapter":"教育政策与法规","number":39,"stem":"过重的课业负担严重损害儿童身心健康。《教育规划纲要》提出要把减负落实到中小学教育全过程，促进学生生动活泼学习、健康快乐成长。率先实现______减负。( )","options":["小学生","初中生","高中生","大学生"],"answer":"A","explanation":"《教育规划纲要》提出要率先实现小学生减负。"},{"id":"3-1-40","subject":"教育政策与法规","chapter":"教育政策与法规","number":40,"stem":"《教育规划纲要》提出，建立统一的中小学教师职务（职称）系列，在中小学设置______教师职务（职称）。（ ）","options":["正高级","副高级","中级","特级教师"],"answer":"A","explanation":"针对广大教师普遍反映的职称评定问题，《教育规划纲要》明确：建立统一的中小学教师职务（职称）系列，在中小学设置正高级教师职务（职称）。探索在职业学校设置正高级教师职务（职称）。"},{"id":"3-1-41","subject":"教育政策与法规","chapter":"教育政策与法规","number":41,"stem":"师德教育要以“________”为核心,引导教师热爱教育，关心学生。( )","options":["爱与责任","严谨笃学","淡薄名利","终身学习"],"answer":"A","explanation":"教师的道德是社会对教师提出的一种特殊的道德要求，核心是热爱学生。"},{"id":"3-1-42","subject":"教育政策与法规","chapter":"教育政策与法规","number":42,"stem":"学校一切工作的出发点和落脚点是( )","options":["一切为了学生","学生健康成长","减轻学生负担","创新发展"],"answer":"B","explanation":"国家中长期教育改革和发展规划纲要表示，坚持以人为本、推进素质教育的根本要求，是要以学生为主体,把促进学生健康成长作为学校一切工作的出发点和落脚点。"},{"id":"3-1-43","subject":"教育政策与法规","chapter":"教育政策与法规","number":43,"stem":"适龄儿童、少年因身体状况需要延缓入学或者休学的，其父母或者其他法定监护人应当提出申请，由当地( )人民政府教育行政部门批准。","options":["市级或省级","县级或市级","乡镇或者县级","村级或者乡镇"],"answer":"C","explanation":"《中华人民共和国义务教育法》第十一条规定凡年满六周岁的儿童，其父母或者其他法定监护人应当送其入学接受并完成义务教育；条件不具备的地区的儿童，可以推迟到七周岁。适龄儿童、少年因身体状况需要延缓入学或者休学的，其父母或者其他法定监护人应当提出申请，由当地乡镇人民政府或者县级人民政府教育行政部门批准。"},{"id":"3-1-44","subject":"教育政策与法规","chapter":"教育政策与法规","number":44,"stem":"“国家实行教育与宗教相分离”体现了我国教育的( )原则。","options":["方向性","公共性","平等性","终身性"],"answer":"B","explanation":"《中华人民共和国宪法》第八条规定：“教育活动必须符合国家和社会公共利益。国家实行教育与宗教相分离。任何组织和个人不得利用宗教进行妨碍国家教育制度的活动。”《中华人民共和国义务教育法》第十六条规定：“不得利用宗教进行妨碍义务教育实施的活动。”"},{"id":"3-1-45","subject":"教育政策与法规","chapter":"教育政策与法规","number":45,"stem":"《教育法》第3条规定“国家坚持以马克思列宁主义、毛泽东思想和建设有中国特色社会主义理论为指导，遵循宪法确定的基本原则，发展社会主义的教育事业。”体现了我国教育的( )原则。","options":["方向性","公共性","平等性","终身性"],"answer":"A","explanation":"《教育法》第三条规定:“国家坚持以马克思列宁主义、毛泽东思想和建设有中国特色社会主义理论为指导，遵循宪法确定的基本原则，发展社会主义的教育事业。”这一规定既指明了我国教育的指导思想、基本原则和性质，又指明了我国教育应当坚持的社会主义方向。"},{"id":"3-1-46","subject":"教育政策与法规","chapter":"教育政策与法规","number":46,"stem":"《教育法》第9条规定“中华人民共和国公民有受教育的权利和义务。公民不分民族、种族、性别、职业、财产状况、宗教信仰等，依法享有平等的受教育机会。”体现了我国教育的( )原则。","options":["方向性","公共性","平等性","终身性"],"answer":"C","explanation":"《教育法》第九条规定:“中华人民共和国公民有受教育的权利和义务。”“公民不分民族、种族、性别、职业、财产状况、宗教信仰等，依法享有平等的受教育机会。”这一规定确定了公民受教育机会平等的基本原则。"},{"id":"3-1-47","subject":"教育政策与法规","chapter":"教育政策与法规","number":47,"stem":"《教育法》第11条规定“国家适应社会主义市场经济发展和社会进步的需要，推进教育改革，促进各级各类教育协调发展，建立和完善终身教育体系。”体现了我国教育的( )原则。","options":["方向性","公共性","平等性","终身性"],"answer":"D","explanation":"《教育法》以法律的形式肯定了终身教育原则，其中第十一条第一款规定:“国家适应社会主义市场经济发展和社会进步的需要，推进教育改革，促进各级各类教育协调发展，建立和完善终身教育体系。”另外，第十九条第三款规定:“国家鼓励发展多种形式的成人教育，使公民接受适当形式的政治、经济、文化、科学、技术、业务教育和终身教育。”第四十一条规定:“国家鼓励学校及其他教育机构、社会组织采取措施,为公民接受终身教育创造条件。”"},{"id":"3-1-48","subject":"教育政策与法规","chapter":"教育政策与法规","number":48,"stem":"《民法通则》规定，不满( )周岁的公民是无民事行为能力人。","options":["10","14","16","18"],"answer":"A","explanation":"见《民法通则》。"},{"id":"3-1-49","subject":"教育政策与法规","chapter":"教育政策与法规","number":49,"stem":"学校侵犯了教师的合法权益，受理老师申诉的机关是( )。","options":["当地人民政府","当地人民法院","当地人民检察院","教育行政主管部门"],"answer":"D","explanation":"对教师提出的申诉的受理机构是当地教育行政部门。"},{"id":"3-1-50","subject":"教育政策与法规","chapter":"教育政策与法规","number":50,"stem":"为了保护未成年人的身心健康及其合法权益，促进未成年人健康成长，根据宪法，我国制定了《中华人民共和国未成年人保护法》，下列描述与《未成年人保护法》不一致的是( )。","options":["保护未成年人，主要是学校老师和家长共同的责任。","教育与保护相结合是保护未成年人工作应遵循的基本原则。","学校应当尊重未成年学生受教育的权利，关心、爱护学生，对品行有缺点、学习有困难的学生，应当耐心教育、帮助，不得歧视，不得违反法律和国家规定开除未成年学生。","未成年人享有生存权、发展权、受保护权、参与权等权利，国家根据未成年人身心发展特点给予特殊、优先保护，保障未成年人的合法权益不受侵犯。"],"answer":"A","explanation":"未成年人保护法明确规定了家庭、学校、社会、司法等方面对未成年人应负的责任。"},{"id":"3-1-51","subject":"教育政策与法规","chapter":"教育政策与法规","number":51,"stem":"《中华人民共和国教育法》自( )之日起开始实施。","options":["1990年9月1日","1995年9月1日","1996年9月1日","1996 年10月1日"],"answer":"B","explanation":"《中华人民共和国教育法》1995年3月18日通过，自1995年9月1日起施行。"},{"id":"3-1-52","subject":"教育政策与法规","chapter":"教育政策与法规","number":52,"stem":"《中华人民共和国教育法》的制定机关是( )","options":["全国人民代表大会","国务院教育行政部门","全国人民代表大会常务委员会","国务院"],"answer":"A","explanation":"全国人民代表大会是我国的立法机关。"},{"id":"3-1-53","subject":"教育政策与法规","chapter":"教育政策与法规","number":53,"stem":"《中华人民共和国教育法》 在教育法体系中属于( )范畴。","options":["教育单行法律","教育基本法律","教育行政法规","教育部门规章"],"answer":"B","explanation":"《教育法》在教育法规体系中属于基本法律范畴"},{"id":"3-1-54","subject":"教育政策与法规","chapter":"教育政策与法规","number":54,"stem":"下列各题中，( )是教育法律关系的主体。","options":["校舍","学校","教学设施","教学成果"],"answer":"B","explanation":"教育法律关系主体是指教育法律关系的参加者，即在教育法律关系中享有权利或承担义务的人。教育法律关系主体的种类繁多，有国家、教育行政机关及其工作人员、学校及其他教育机构、教职员工、学生及其家长、用人单位、其他国家机关、企事业单位、社会团体组织，还有外国人和无国籍人。"},{"id":"3-1-55","subject":"教育政策与法规","chapter":"教育政策与法规","number":55,"stem":"学校对故意不完成教育教学任务给教育教学工作造成损失的教师，可以给予( )","options":["行政处罚","行政处分或解聘","追究其他法律责任","罚金或拘役"],"answer":"B","explanation":"《教师法》第三十七条规定：教师有下列情形之一的，由所在学校、其他教育机构或者教育行政部门给予行政处分或者解聘。（一）故意不完成教育教学任务给教育教学工作造成损失的；（二）体罚学生，经教育不改的；（三）品行不良、侮辱学生，影响恶劣的。"},{"id":"3-1-56","subject":"教育政策与法规","chapter":"教育政策与法规","number":56,"stem":"《教育法》规定，受教育者对学校给予的处分不服向有关部门提出申诉，对学校、教师侵犯其人身权、财产权等合法权益( )","options":["只能提出申诉","只能依法提起诉讼","可以提出申诉或者依法提起诉讼","既不能提出申诉，也不能提起诉讼"],"answer":"C","explanation":"见《中华人民共和国教育法》。"},{"id":"3-1-57","subject":"教育政策与法规","chapter":"教育政策与法规","number":57,"stem":"《教育法》规定，“教育活动必须符合国家和社会公共利益。”这一规定体现了( )","options":["教育的科学性原则","教育的公益性原则","教育与宗教相分离原则","教育的中立性原则"],"answer":"B","explanation":"见《中华人民共和国宪法》第八条。"},{"id":"3-1-58","subject":"教育政策与法规","chapter":"教育政策与法规","number":58,"stem":"按照中华人民共和国教育法的规定，对在校园内结伙斗殴寻衅滋事，扰乱学校及其他教育机构教育教学秩序或者破坏校舍、场地及其他财产的，由( )来处罚。","options":["学校","教育主管部门","家长","由公安机关给予治安管理处罚"],"answer":"D","explanation":"见《中华人民共和国教育法》。"},{"id":"3-1-59","subject":"教育政策与法规","chapter":"教育政策与法规","number":59,"stem":"《教育法 赋予了学校自主管理权，但自主管理权不是无限的，而应该有一个基本的遵循，因此，( )是学校自主管理的基本依据。","options":["教师","校长","学生","章程"],"answer":"D","explanation":"根据我国《教育法》第二十八条的规定，学校享有按照章程自主管理的权利。学校根据本机构的章程，在不违背国家法律的前提下，可以自主组织实施管理活动，作出管理决策，并建立完善自身的管理系统，而无须事无巨细，请示主管行政部门。"},{"id":"3-1-60","subject":"教育政策与法规","chapter":"教育政策与法规","number":60,"stem":"我国《教育法》规定，国家实行教师资格、职务、( )制度。","options":["任用","任命","聘任","雇用"],"answer":"C","explanation":"1995 年《教育法》 规定,国家实行教师资格职务聘任制度。"},{"id":"3-1-61","subject":"教育政策与法规","chapter":"教育政策与法规","number":61,"stem":"《教育法》规定，明知校舍或者教育教学设施有危险，而不采取措施，造成人员伤亡或者重大财产损失的，对直接负责的主管人员和其他直接责任人员，依法追究( )。","options":["民事责任","经济责任","行政责任","刑事责任"],"answer":"D","explanation":"见《中华人民共和国教育法》。"},{"id":"3-1-62","subject":"教育政策与法规","chapter":"教育政策与法规","number":62,"stem":"新修订的《中华人民共和国义务教育法》实行时间为( )","options":["2006、9、1","2007、1、1","2007、9、1","2008、1、1"],"answer":"A","explanation":"新修订的《中华人民共和国义务教育法》实行时间为2006、9、1。"},{"id":"3-1-63","subject":"教育政策与法规","chapter":"教育政策与法规","number":63,"stem":"根据《义务教育法》关于学校设置规划的要求，新建居民区需要设置学校的，应当( )","options":["早于居民区的建设","晚于居民区的建设","与居民区的建设同步进行","待居民区的建设完毕后进行"],"answer":"C","explanation":"《义务教育法》 第十五条规定，县级以上地方人民政府根据本行政区域内居住的适龄儿童、少年的数量和分布状况等因素，按照国家有关规定，制定、调整学校设置规划。新建居民区需要设置学校的，应当与居民区的建设同步进行。"},{"id":"3-1-64","subject":"教育政策与法规","chapter":"教育政策与法规","number":64,"stem":"我国实行的是九年义务教育制度。新修订的《中华人民共和国义务教育法》 共有( )章六十三条。","options":["八","七","六","九"],"answer":"A","explanation":"新修订的《中华人民共和国义务教育法》 共有八章六十三条。"},{"id":"3-1-65","subject":"教育政策与法规","chapter":"教育政策与法规","number":65,"stem":"义务教育实行_____领导，_______统筹规划实施，_____为主的管理体制。( )","options":["国务院，省、自治区、直辖市人民政府，县级人民政府","省、自治区、直辖市人民政府，县级人民政府，乡级人民政府","国务院，省、自治区，直辖市人民政府","省、自治区，直辖市人民政府，县级人民政府"],"answer":"A","explanation":"新修订的《义务教育法》第七条规定：“义务教育实行国务院领导，省、自治区、直辖市人民政府统筹规划实施，县级人民政府为主管理的体制。”"},{"id":"3-1-66","subject":"教育政策与法规","chapter":"教育政策与法规","number":66,"stem":"我国《义务教育法》规定，学校应当把( )放在首位。","options":["智育","德育","体育","美育"],"answer":"B","explanation":"见《义务教育法》。"},{"id":"3-1-67","subject":"教育政策与法规","chapter":"教育政策与法规","number":67,"stem":"国家建立统一的义务教育教师职务制度，教师职务分为( )","options":["三级、二级、一级","初级、中级、高级","初级、高级、特级","初级、中级、特级"],"answer":"B","explanation":"新《义务教育法》规定，国家建立统一的义务教育教师职务制度。教师职务分为初级职务、中级职务和高级职务。"},{"id":"3-1-68","subject":"教育政策与法规","chapter":"教育政策与法规","number":68,"stem":"实施义务教育，不收( )","options":["课本费","校服费","学费、杂费","住宿费"],"answer":"C","explanation":"国家实行九年义务教育制度。义务教育是国家统一实施的所有适龄儿童、少年必须接受的教育，是国家必须予以保障的公益性事业。实施义务教育，不收学费、杂费。"},{"id":"3-1-69","subject":"教育政策与法规","chapter":"教育政策与法规","number":69,"stem":"义务教育法总则第一条规定，为了保障适龄儿童、少年接受义务教育的权利，保证义务教育的实施，提高全民族素质，根据( )，制定本法。","options":["宪法和教育法","宪法和未成年人保护法","宪法和预防未成年人犯罪法","教育法和未成年人保护法"],"answer":"A","explanation":"见义务教育法总则第一条。"},{"id":"3-1-70","subject":"教育政策与法规","chapter":"教育政策与法规","number":70,"stem":"我国《义务教育法》规定，在民族地区和边远贫困地区工作的教师享有( )津贴。","options":["特殊岗位补助","生活补助","艰苦贫困地区补助","特殊奉献补助"],"answer":"C","explanation":"见《义务教育法》。"},{"id":"3-1-71","subject":"教育政策与法规","chapter":"教育政策与法规","number":71,"stem":"对未完成义务教育的未成年人和被采取强制性教育措施的未成年人应当进行义务教育，所需经费由( )予以保障。","options":["国家","社会","学校","人民政府"],"answer":"D","explanation":"《义务教育法》 第二十一条，对未完成义务教育的未成年犯和被采取强制性教育措施的未成年人应当进行义务教育。所需经费由人民政府予以保障。"},{"id":"3-1-72","subject":"教育政策与法规","chapter":"教育政策与法规","number":72,"stem":"义务教育法规定，教师的工资水平应当( )当地公务员的平均水平。","options":["相当于","不低于","略高于","略低于"],"answer":"B","explanation":"见《义务教育法》。"},{"id":"3-1-73","subject":"教育政策与法规","chapter":"教育政策与法规","number":73,"stem":"义务教育是国家统一实施的所有适龄儿童、少年必须接受的教育，是国家必须予以保障的( )事业。","options":["行政性","公共性","经营性","公益性"],"answer":"D","explanation":"《中华人民共和国义务教育法》：义务教育是国家统一实施的所有适龄儿童、少年必须接受的教育，是国家必须予以保障的公益性事业。"},{"id":"3-1-74","subject":"教育政策与法规","chapter":"教育政策与法规","number":74,"stem":"义务教育阶段适龄儿童、少年( )。","options":["考试、就近入学","免试、就近入学","免试、到离家最近的学校上学","考试、到离家最近的学校上学"],"answer":"B","explanation":"义务教育法实施办法草案 提出我国实行免试就近入学制度"},{"id":"3-1-75","subject":"教育政策与法规","chapter":"教育政策与法规","number":75,"stem":"“学校下学年生源锐减，教师严重超编，不愿意上早晚自修和补课的同志可以去其他学校另谋高就！”这种说法违反了( )","options":["《学校管理条例》","《教师法》","《教育法》","《义务教育法》"],"answer":"B","explanation":"随意地解雇教师违反了《教师法》的相关规定。"},{"id":"3-1-76","subject":"教育政策与法规","chapter":"教育政策与法规","number":76,"stem":"《中华人民共和国教师法》由第八届全国人大常委会第四次会议颁布，于( )开始实施。","options":["1993年10月31日","1994年1月1日","1996年9月1日","1999年月l日"],"answer":"B","explanation":"《中华人民共和国教师法》已由中华人民共和国第八届全国人民代表大会常务委员会第四次会议于1993年10月31日通过,自1994年1月1日起施行。"},{"id":"3-1-77","subject":"教育政策与法规","chapter":"教育政策与法规","number":77,"stem":"教师义务的实质是教师的职责( )","options":["在行为上的体现","在意志上的体现","在信念上的体现","在意识上的体现"],"answer":"A","explanation":"教师义务的实质是教师的职责在行为上的体现"},{"id":"3-1-78","subject":"教育政策与法规","chapter":"教育政策与法规","number":78,"stem":"我国《教师法》规定，教师是履行教育教学职责的( )","options":["国家干部","专业人员","公务人员","劳动者"],"answer":"B","explanation":"依据《教师法》第三条教师是履行教育教学职责的专业人员"},{"id":"3-1-79","subject":"教育政策与法规","chapter":"教育政策与法规","number":79,"stem":"根据《教师法》第14 条的规定，下面哪种情况不能取得教师资格；已取得教师资格的，丧失教师资格。( )","options":["故意犯罪受到有期徒刑以上刑事处罚的","故意犯罪受到刑事处罚的","过失犯罪受到有期徒刑以上刑事处罚的","过失犯罪受到刑事处罚的"],"answer":"A","explanation":"见《教师法》第14 条。"},{"id":"3-1-80","subject":"教育政策与法规","chapter":"教育政策与法规","number":80,"stem":"对依法提出申诉、控告、检举的教师进行打击报复的，情节严重的，可以根据具体情况给予( )","options":["纪律处分","行政处分","经济处罚","警告处分"],"answer":"B","explanation":"《教师法》第36条规定∶“对依法提出申诉、控告、检举的教师进行打击报复的，由其所在单位或者上级机关责令改正；情节严重的，可以根据具体情况给予行政处分”。"},{"id":"3-1-81","subject":"教育政策与法规","chapter":"教育政策与法规","number":81,"stem":"各级人民政府应当采取措施，加强教师的思想政治教育和业务培训，改善教师的工作条件和生活条件，保障教师的合法权益，提高教师的( )地位。","options":["政治","经济","法律","社会"],"answer":"D","explanation":"《中华人民共和国教师法》第四条规定各级人民政府应当采取措施，加强教师的思想政治教育和业务培训，改善教师的工作条件和生活条件，保障教师的合法权益，提高教师的社会地位。"},{"id":"3-1-82","subject":"教育政策与法规","chapter":"教育政策与法规","number":82,"stem":"教育政策法规的基本功能是( )","options":["规范功能","保障功能","制约功能","激励功能"],"answer":"B","explanation":"保障功能是教育政策法规的基本功能。"},{"id":"3-1-83","subject":"教育政策与法规","chapter":"教育政策与法规","number":83,"stem":"学校和教师签定聘任合同时，教师的权利与义务应当由( )","options":["学校确定","教师确定","学校和教师双方协商确定","教育行政部门规定"],"answer":"C","explanation":"教师法规定，教师聘任制应当遵循双方地位平等的原则，由学校和教师签订聘任合同，明确规定双方的权利、义务和责任。这里应该强调的是，学校和教师双方必须意思表示一致，才能形成聘任合同关系。"},{"id":"3-1-84","subject":"教育政策与法规","chapter":"教育政策与法规","number":84,"stem":"教师向教育行政部门提出申诉，教育行政部门应当在接到申诉的( )日内，作出处理。","options":["十五","三十","六十","九十"],"answer":"B","explanation":"教师向教育行政部门提出申诉，教育行政部门应当在接到申诉的30日内，作出处理。"},{"id":"3-1-85","subject":"教育政策与法规","chapter":"教育政策与法规","number":85,"stem":"( ）主管全国的教师工作。","options":["国务院","国务院教育行政部门","全国人大","全国人大教科文卫委员会"],"answer":"B","explanation":"教师法第五条：国务院教育行政部门主管全国的教师工作。"},{"id":"3-1-86","subject":"教育政策与法规","chapter":"教育政策与法规","number":86,"stem":"教师对学校教育教学、管理工作和教育行政部门的工作提出意见和建议，通过( )，参与学校的民主管理。","options":["学校行政部门","教职工代表大会或者其他形式","学校工会","学校党组织"],"answer":"B","explanation":"教师享有“对学校教育教学、管理工作和教育行政部门的工作提出意见和建议，通过教职工代表大会或者其他形式，参与学校的民主管理”的权利。"},{"id":"3-1-87","subject":"教育政策与法规","chapter":"教育政策与法规","number":87,"stem":"侮辱、殴打教师的，情节严重，构成犯罪的，依法( )","options":["给予治安管理处罚","承担民事责任","追究刑事责任","给予行政处分"],"answer":"C","explanation":"构成犯罪应追究刑事责任。"},{"id":"3-1-88","subject":"教育政策与法规","chapter":"教育政策与法规","number":88,"stem":"教师考核应遵循的原则是( )","options":["客观、公开、即时","客观、公正、准确","客观、实效、合理","公开、公平、公正"],"answer":"B","explanation":"教师法规定，在考核教师工作中应当遵循的原则是：客观、公正、准确。"},{"id":"3-1-89","subject":"教育政策与法规","chapter":"教育政策与法规","number":89,"stem":"在民族地区和边远贫困地区工作的教师享有( )津贴。","options":["特殊岗位补助","生活补助","艰苦贫困地区补助","特殊奉献补助"],"answer":"C","explanation":"《中华人民共和国义务教育法 》第三十一条规定：特殊教育教师享有特殊岗位补助津贴。在民族地区和边远贫困地区工作的教师享有艰苦贫困地区补助津贴。"},{"id":"3-1-90","subject":"教育政策与法规","chapter":"教育政策与法规","number":90,"stem":"根据《教师法》 的规定，以下不属于学校可以解聘教师的法定情形是( )","options":["故意不完成教育教学任务给教育教学工作造成损失的","品行不良，侮辱学生，影响恶劣的","体罚学生，经教育不改的","不能团结同事，其他教师不愿与之共事的"],"answer":"D","explanation":"《教师法》第三十七条规定：“教师有下列情形之一的，由所在学校、其他教育机构或教育行政部门给予行政处分或者解聘：（一）故意不完成教育教学任务给教育教学工作造成损失的；（二）体罚学生，经教育不改的；（三）品德不良、侮辱学生，影响恶劣的。”"},{"id":"3-1-91","subject":"教育政策与法规","chapter":"教育政策与法规","number":91,"stem":"以下哪项不是教育法律规范的构成要素( )。","options":["法定条件","权利与义务","行为准则","法律后果"],"answer":"B","explanation":"法定条件、行为准则、法律后果是教育法律的构成要素。"},{"id":"3-1-92","subject":"教育政策与法规","chapter":"教育政策与法规","number":92,"stem":"学校与教育局之间属于( )。","options":["平权型法律关系","隶属型法律关系","教育外部法律关系","调整型法律关系"],"answer":"B","explanation":"隶属型法律关系，是一方当事人可依据职权而直接要求他方当事人为或不为一定行为的法律关系。学校与教育局之间属于隶属型法律关系 。"},{"id":"3-1-93","subject":"教育政策与法规","chapter":"教育政策与法规","number":93,"stem":"记过是( )的一种","options":["行政处罚","行政处分","民事法律责任","刑事法律责任"],"answer":"B","explanation":"行政处分种类有：警告、记过、记大过、降级、撤职、开除（六种）。"},{"id":"3-1-94","subject":"教育政策与法规","chapter":"教育政策与法规","number":94,"stem":"以下哪项是民事法律责任适用的处罚方式( )","options":["赔偿损失","记过","罚款","撤销教师资格"],"answer":"A","explanation":"承担民事责任的方式主要有：（一）停止侵害；（二）排除妨碍；（三）消除危险；（四）返还财产；（五）恢复原状；（六）修理、重作、更换；（七）赔偿损失；（八）支付违约金；（九）消除影响、恢复名誉；（十）赔礼道歉。"},{"id":"3-1-95","subject":"教育政策与法规","chapter":"教育政策与法规","number":95,"stem":"以下不属于教师申诉制度范围的是( )","options":["学校侵犯教师权益","家长侵犯教师权益","对学校做出的处理决定不服","教育行政部门侵犯教师权益"],"answer":"B","explanation":"以下情况，教师可以提出申诉：（1）教师认为所在级部（处室）、学校侵犯其合法权益的，可以提出申诉。包括教师在职务聘任、教学科研、工作条件、民主管理、培训进修、考核奖惩、工资福利待遇、退休等各方面的合法权益。（2）是否确实侵犯了教师的合法权益，要通过申诉后的查办，才能确认。（3）教师对受理申诉的级部（处室）直至学校的处理决定不服的，可以提出申诉。"},{"id":"3-1-96","subject":"教育政策与法规","chapter":"教育政策与法规","number":96,"stem":"以下有关学生申诉制度的说法不正确的是( )","options":["具有非诉讼性","被申诉人是学校或教师","提出申诉的人必须是学生","申诉的事项必须符合我国《教育法》规定的受理范围"],"answer":"C","explanation":"受理申诉一般由学生本人提起，无民事行为能力人或者限制行为能力人的申诉可以由其法定监护人带为提起。"},{"id":"3-1-97","subject":"教育政策与法规","chapter":"教育政策与法规","number":97,"stem":"教育行政复议的复议期限是( )","options":["15日","30日","60日","45日"],"answer":"C","explanation":"教育行政复议的复议期限是60日。"},{"id":"3-1-98","subject":"教育政策与法规","chapter":"教育政策与法规","number":98,"stem":"把学生赶出课堂侵犯了学生的( )","options":["人身权","受教育权","财产权","著作权"],"answer":"B","explanation":"受教育权包括两个基本要素：一是公民均有上学接受教育的权利；二是国家提供教育设施，培养教师，为公民受教育创造必要机会和物质条件。"},{"id":"3-1-99","subject":"教育政策与法规","chapter":"教育政策与法规","number":99,"stem":"《中共中央关于教育体制改革的决定》发布于( )","options":["1988年","1987年","1986年","1985年"],"answer":"D","explanation":"《中共中央关于教育体制改革的决定》发布于1985年。"},{"id":"3-1-100","subject":"教育政策与法规","chapter":"教育政策与法规","number":100,"stem":"新修订的《中华人民共和国义务教育法》施行始于( )","options":["2006、6、29","2006、7、1","2006、9、1","2007、9、1"],"answer":"C","explanation":"《中华人民共和国义务教育法》由中华人民共和国第十届全国人民代表大会常务委员会第二十二次会议于2006年6月29日修订通过。自2006年9月1日起正式施行的。"},{"id":"3-1-101","subject":"教育政策与法规","chapter":"教育政策与法规","number":101,"stem":"《中国教育改革和发展纲要》发布于( )","options":["1992年","1993年","1994年","1995年"],"answer":"B","explanation":"1993年党中央国务院颁布《中国教育改革和发展纲要》。"},{"id":"3-1-102","subject":"教育政策与法规","chapter":"教育政策与法规","number":102,"stem":"适用对违反学校纪律和规章制度的学生的主要教育惩罚手段或方法是( )","options":["人身罚","能力罚","财产罚","申诫罚"],"answer":"D","explanation":"申诫罚是教育行政机关对违法相出方的名誉、荣誉、信誉或精神上的利益造成—定损害以示警诫的行政处罚。又称为声誉罚或精神罚。其主要形式有警告、通报批评等。"},{"id":"3-1-103","subject":"教育政策与法规","chapter":"教育政策与法规","number":103,"stem":"《浙江省中小学校学生人身安全事故预防与处理办法》认定，学校对学生安全负有的职责是( )","options":["教育、教学和监护","教育、管理和保护","教育、教学和监管","教育、监管和救护"],"answer":"B","explanation":"见《浙江省中小学校学生人身安全事故预防与处理办法》。"},{"id":"3-1-104","subject":"教育政策与法规","chapter":"教育政策与法规","number":104,"stem":"根据我国教师法规的有关规定，“弄虚作假、骗取教师资格的”与“品德不良、侮辱学生、影响恶劣的”教师，其教师资格将( )","options":["给予撤销","宣告中止","永远丧失","公告无效"],"answer":"A","explanation":"见《中华人民共和国教师法》。"},{"id":"3-1-105","subject":"教育政策与法规","chapter":"教育政策与法规","number":105,"stem":"《面向21世纪教育振兴行动计划》发布于( )","options":["2000年","1999年","1998年","1997年"],"answer":"C","explanation":"《面向21世纪教育振兴行动计划》发布于1998年。"},{"id":"3-1-106","subject":"教育政策与法规","chapter":"教育政策与法规","number":106,"stem":"在处理学校事故侵权纠纷的问题上一般采用的举证责任原则是","options":["谁主张谁举证","举证责任倒置","第三方举证","证人举证"],"answer":"B","explanation":"校园伤害事故侵权纠纷案件中，可以而且应该根据案件的具体情况，裁量采用举证责任倒置原则。"},{"id":"3-1-107","subject":"教育政策与法规","chapter":"教育政策与法规","number":107,"stem":"教师法定的最基本权利( )","options":["获取工资福利权","科学研究，学术交流权","教育教学权","参与学校的民主管理权"],"answer":"C","explanation":"依据《教师法》规定，我国教师享有以下基本权利：教育教学权、科学研究权、管理学生权、获取报酬待遇权、民主管理权、进修培训权。其中教育教学权是教师最基本的权利。"},{"id":"3-1-108","subject":"教育政策与法规","chapter":"教育政策与法规","number":108,"stem":"法规类型《教师资格条例》属于( )条例","options":["行政规章","地方性法规","行政法规","单行条例"],"answer":"C","explanation":"《教师资格条例》属于行政法规。"},{"id":"3-1-109","subject":"教育政策与法规","chapter":"教育政策与法规","number":109,"stem":"对教师品行不良、侮辱学生、影响恶劣的( )","options":["行政处罚","行政处分","撤销教师资格","追究民事法律责任"],"answer":"C","explanation":"《教育行政处罚暂行实施办法》第十八条规定：教师品行不良、侮辱学生，影响恶劣的，由教育行政部门给予撤销教师资格、自撤销之日起五年内不得重新申请认定教师资格的处罚： 。"},{"id":"3-1-110","subject":"教育政策与法规","chapter":"教育政策与法规","number":110,"stem":"《基础教育课程改革纲要》规定小学阶段以( )为主","options":["分科与综合课程相结合","分科课程","综合课程","通识课程"],"answer":"C","explanation":"见《基础教育课程改革纲要》。"},{"id":"3-1-111","subject":"教育政策与法规","chapter":"教育政策与法规","number":111,"stem":"我国的《教育法》和《教师法》开始实施的时间分别是( )","options":["1995、 9、 l和 1994、 1、 1","1995、 3、 18和 1993、 10、 31","1994、 1、 1和 1995、 9、 1","1993、 3、 18和 1995、 10、 31"],"answer":"A","explanation":"我国的《教育法》和《教师法》开始实施的时间分别是1995年9月l日和1994年1月1 日。"},{"id":"3-1-112","subject":"教育政策与法规","chapter":"教育政策与法规","number":112,"stem":"制定《中华人民共和国教育法》的根本依据是( )","options":["党的政策","中央指示","我国宪法","国家法令"],"answer":"C","explanation":"《中华人民共和国教育法》总则第一条：为了发展教育事业，提高全民族的素质，促进社会主义物质文明和精神文明建设，根据宪法，制定本法。"},{"id":"3-1-113","subject":"教育政策与法规","chapter":"教育政策与法规","number":113,"stem":"期末考试前一个月，学校突然决定将音体美课程提前考查，将课时留给语数外科目，学校的做法( )。","options":["正确，有利于教师组织教学","正确，有利于提高学生成绩","错误，不利于校际公平竞争","错误，不利于学生全面发展"],"answer":"D","explanation":"这违背了促进学生全面发展的原则。"},{"id":"3-1-114","subject":"教育政策与法规","chapter":"教育政策与法规","number":114,"stem":"小学教师王某劝退了两个成绩比较落后的学生，教师王某的做法( )","options":["合法，教师有管理学生的权利","不合法，侵犯了学生的荣誉权","合法，教师有劝退学生的权利","不合法，侵犯了学生受教育权"],"answer":"D","explanation":"受教育权是一项基本人权，受教育权是中国公民所享有的并由国家保障实现的接受教育的权利，是宪法赋予的一项基本权利，也是公民享受其他文化教育的前提和基础。"},{"id":"3-1-115","subject":"教育政策与法规","chapter":"教育政策与法规","number":115,"stem":"某小学规定，女教师必须在学校工作3年后方可怀孕，否则产假按事假对待，该规定( )","options":["合法，体现了学校的自主办学权利","合法，保障了学校的正常教学秩序","不合法，侵犯了女教师的人权","不合法，侵犯了女教师的身体权"],"answer":"C","explanation":"教师享有法律规定的公民基本权利。"},{"id":"3-1-116","subject":"教育政策与法规","chapter":"教育政策与法规","number":116,"stem":"成年人杨某对7岁的小明说：“你敢砸人家玻璃，你就是英雄。”小明听后，拿起一块石头就砸破了小刚家的玻璃。对小刚家的损失应承担责任的是( )","options":["杨某和小明的监护人","小明的监护人","小明","杨某"],"answer":"D","explanation":"未成年人保护法明确规定了家庭、学校、社会、司法等方面对未成年人应负的责任。"},{"id":"3-1-117","subject":"教育政策与法规","chapter":"教育政策与法规","number":117,"stem":"小学生小光放学回家被妈妈责骂了一顿，一气之下跑到好朋友家里要求借宿一晚，小亮的父母答应了，关于小亮的父母对小光的留宿行为，下列选项中不正确的是( )","options":["小亮的父母应及时向当地公安机关报告","小亮的父母可以留宿小光以保护小光的人身安全","小亮的父母应在二十四小时内及时通知小光的父母","小亮的父母应在二十四小时内及时通知小光所在学校"],"answer":"B","explanation":"小亮的父母有责任保障小光的人身安全。"},{"id":"3-1-118","subject":"教育政策与法规","chapter":"教育政策与法规","number":118,"stem":"某小学生在课堂上吵架不休，班主任一怒之下用胶带贴住该生嘴巴，该班主任的做法( )","options":["正确，班主任有维护班级秩序的职责","正确，班主任有批评教育学生的权利","不正确，违反了不得体罚学生的规定","不正确，侵犯了学生的言论自由权"],"answer":"C","explanation":"这种行为违反了不得体罚学生的规定。"},{"id":"3-1-119","subject":"教育政策与法规","chapter":"教育政策与法规","number":119,"stem":"为了保护学生的隐私，某小学规定语文教师不得在课堂上点评学生的作文。该校的做法( )","options":["正确，学校有权对教师提出工作要求","正确，学校应该满足学生的自尊要求","不正确，学校侵犯了教师的专业权利","不正确，学校限制了教师的言论自由"],"answer":"C","explanation":"教师有权利进行教育教学活动，开展教育教学改革和实验。这是教师最基本的权利，是教师这一职业所特有的活动内容。教育教学活动是一项十分复杂的系统工程，它包括课程、教材教法、考试和评价、课外活动、思想教育、劳动教育、校园文化、学校与家庭配合教育等方面。"},{"id":"3-1-120","subject":"教育政策与法规","chapter":"教育政策与法规","number":120,"stem":"《国家中长期教育改革和发展规划纲要（2010-2020年）》提出健全统筹有力，权力明确的教育管理机制，深化教育管理机制改革的重点是( )","options":["加强省级政府的教育统筹","规范政府管理权限和职责","建立依法办学的学校制度","转变政府职能和简政放权"],"answer":"D","explanation":"见 《国家中长期教育改革和发展规划纲要（2010-2020年）》。"}];

</script>
  <script>
(() => {
  'use strict';

  const questions = window.QUESTION_BANK || [];
  const byId = new Map(questions.map(question => [question.id, question]));
  const storageKey = 'zhixing-practice-v1';
  const subjects = ['全部科目', ...new Set(questions.map(question => question.subject))];
  const letters = ['A', 'B', 'C', 'D'];
  const $ = id => document.getElementById(id);

  function loadState() {
    try {
      const saved = JSON.parse(localStorage.getItem(storageKey));
      if (saved && typeof saved === 'object') return saved;
    } catch { /* Local files may have storage disabled in some browsers. */ }
    return {};
  }

  const persisted = loadState();
  const state = {
    subject: subjects.includes(persisted.subject) ? persisted.subject : '全部科目',
    chapter: persisted.chapter || '全部章节',
    mode: ['all', 'unanswered', 'wrong', 'saved'].includes(persisted.mode) ? persisted.mode : 'all',
    size: ['20', '50', 'all'].includes(persisted.size) ? persisted.size : '20',
    records: persisted.records && typeof persisted.records === 'object' ? persisted.records : {},
    wrong: new Set((persisted.wrong || []).filter(id => byId.has(id))),
    saved: new Set((persisted.saved || []).filter(id => byId.has(id))),
    session: persisted.session && Array.isArray(persisted.session.ids) ? persisted.session : null,
  };
  if (state.session) {
    state.session.ids = state.session.ids.filter(id => byId.has(id));
    state.session.answers ||= {};
    state.session.index = Math.min(Math.max(Number(state.session.index) || 0, 0), Math.max(0, state.session.ids.length - 1));
  }

  function saveState() {
    try {
      localStorage.setItem(storageKey, JSON.stringify({
        subject: state.subject, chapter: state.chapter, mode: state.mode, size: state.size,
        records: state.records, wrong: [...state.wrong], saved: [...state.saved], session: state.session,
      }));
    } catch { toast('浏览器未能保存进度，请使用“导出进度”备份'); }
  }

  let toastTimer;
  function toast(message) {
    const node = $('toast');
    node.textContent = message;
    node.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => node.classList.remove('show'), 3200);
  }

  function chapters() {
    return [...new Set(questions.filter(q => state.subject === '全部科目' || q.subject === state.subject).map(q => q.chapter))];
  }

  function pool() {
    return questions.filter(question => {
      if (state.subject !== '全部科目' && question.subject !== state.subject) return false;
      if (state.chapter !== '全部章节' && question.chapter !== state.chapter) return false;
      if (state.mode === 'unanswered' && state.records[question.id]) return false;
      if (state.mode === 'wrong' && !state.wrong.has(question.id)) return false;
      if (state.mode === 'saved' && !state.saved.has(question.id)) return false;
      return true;
    });
  }

  function startSession(order) {
    const items = pool().slice();
    if (order === 'random') {
      for (let i = items.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [items[i], items[j]] = [items[j], items[i]];
      }
    } else if (state.mode === 'all') {
      items.sort((a, b) => Number(Boolean(state.records[a.id])) - Number(Boolean(state.records[b.id])));
    }
    const limit = state.size === 'all' ? items.length : Number(state.size);
    state.session = { ids: items.slice(0, limit).map(item => item.id), answers: {}, index: 0, order };
    saveState();
    render();
    if (!items.length) toast('当前范围没有题目');
  }

  function setSubject(subject) {
    state.subject = subject;
    state.chapter = '全部章节';
    closeSidebar();
    startSession('sequential');
  }

  function setChapter(chapter) {
    state.chapter = chapter;
    closeSidebar();
    startSession('sequential');
  }

  function setMode(mode) {
    state.mode = mode;
    startSession('sequential');
  }

  function answer(letter) {
    const session = state.session;
    const id = session?.ids[session.index];
    if (!id || session.answers[id]) return;
    const question = byId.get(id);
    const correct = letter === question.answer;
    session.answers[id] = letter;
    const record = state.records[id] || { attempts: 0, correct: 0 };
    record.attempts++;
    if (correct) record.correct++;
    state.records[id] = record;
    if (!correct) state.wrong.add(id);
    saveState();
    render();
  }

  function el(tag, className, content) {
    const node = document.createElement(tag);
    if (className) node.className = className;
    if (content !== undefined) node.textContent = content;
    return node;
  }

  function renderSidebar() {
    const subjectList = $('subject-list');
    subjectList.replaceChildren();
    for (const subject of subjects) {
      const count = subject === '全部科目' ? questions.length : questions.filter(q => q.subject === subject).length;
      const button = el('button', `subject-button${state.subject === subject ? ' active' : ''}`);
      button.type = 'button';
      button.append(el('span', '', subject), el('small', '', String(count)));
      button.onclick = () => setSubject(subject);
      subjectList.append(button);
    }
    const chapterList = $('chapter-list');
    chapterList.replaceChildren();
    const allChapters = chapters();
    $('chapter-count').textContent = `${allChapters.length} 章`;
    for (const chapter of ['全部章节', ...allChapters]) {
      const count = chapter === '全部章节'
        ? questions.filter(q => state.subject === '全部科目' || q.subject === state.subject).length
        : questions.filter(q => q.chapter === chapter && (state.subject === '全部科目' || q.subject === state.subject)).length;
      const button = el('button', `chapter-button${state.chapter === chapter ? ' active' : ''}`);
      button.type = 'button';
      button.append(el('span', '', chapter.replace(/\s+/g, ' ')), el('small', '', String(count)));
      button.onclick = () => setChapter(chapter);
      chapterList.append(button);
    }
  }

  function renderHeader() {
    const records = Object.values(state.records).filter(record => record && typeof record.attempts === 'number');
    const attempts = records.reduce((sum, record) => sum + record.attempts, 0);
    const correct = records.reduce((sum, record) => sum + (record.correct || 0), 0);
    $('header-done').textContent = String(records.length);
    $('header-accuracy').textContent = attempts ? `${Math.round(correct / attempts * 100)}%` : '--';
    $('scope-label').textContent = [state.subject, state.chapter !== '全部章节' ? state.chapter.replace(/\s+/g, ' ') : null].filter(Boolean).join(' · ');
    $('session-size').value = state.size;
    for (const button of $('mode-tabs').querySelectorAll('button')) {
      const active = button.dataset.mode === state.mode;
      button.classList.toggle('active', active);
      button.setAttribute('aria-selected', String(active));
    }
  }

  function renderSession() {
    const session = state.session;
    const ids = session?.ids || [];
    const answered = ids.filter(id => session.answers[id]);
    const correct = answered.filter(id => session.answers[id] === byId.get(id).answer).length;
    const wrong = answered.length - correct;
    $('session-status').textContent = session?.order === 'random' ? '随机练习' : '顺序练习';
    $('session-progress-text').textContent = `${answered.length} / ${ids.length}`;
    $('progress-bar').style.width = `${ids.length ? answered.length / ids.length * 100 : 0}%`;
    $('round-count').textContent = `${ids.length} 题`;
    $('round-done').textContent = String(answered.length);
    $('round-correct').textContent = String(correct);
    $('round-wrong').textContent = String(wrong);
    $('question-position').textContent = ids.length ? `第 ${session.index + 1} / ${ids.length} 题` : '暂无题目';
    $('prev-button').disabled = !ids.length || session.index === 0;
    $('next-button').disabled = !ids.length || session.index >= ids.length - 1;

    const palette = $('question-palette');
    palette.replaceChildren();
    ids.forEach((id, index) => {
      const selected = session.answers[id];
      const result = selected ? (selected === byId.get(id).answer ? 'correct' : 'wrong') : '';
      const button = el('button', `${result}${index === session.index ? ' current' : ''}`, String(index + 1));
      button.type = 'button';
      button.title = `第 ${index + 1} 题${selected ? `，${result === 'correct' ? '正确' : '错误'}` : ''}`;
      button.onclick = () => { session.index = index; saveState(); render(); };
      palette.append(button);
    });
  }

  function renderQuestion() {
    const area = $('question-area');
    area.replaceChildren();
    const session = state.session;
    const id = session?.ids[session.index];
    if (!id) {
      const empty = el('div', 'empty-state');
      empty.append(el('h2', '', state.mode === 'wrong' ? '没有待复习的错题' : state.mode === 'saved' ? '还没有收藏题目' : '当前范围没有题目'));
      empty.append(el('p', '', state.mode === 'unanswered' ? '这一范围的题目已经练完。' : '切换科目、章节或题目范围继续练习。'));
      if (state.mode !== 'all') {
        const reset = el('button', '', '查看全部题目');
        reset.type = 'button';
        reset.onclick = () => setMode('all');
        empty.append(reset);
      }
      area.append(empty);
      return;
    }

    const question = byId.get(id);
    const selected = session.answers[id];
    const meta = el('div', 'question-meta');
    meta.append(el('span', 'number', `题目 ${String(session.index + 1).padStart(2, '0')}`), el('span', '', `${question.subject} · ${question.chapter.replace(/\s+/g, ' ')} · 原题 ${question.number}`));
    area.append(meta, el('h2', 'question-title', question.stem));

    const options = el('div', 'option-list');
    question.options.forEach((option, index) => {
      const letter = letters[index];
      const result = selected ? (letter === question.answer ? ' correct' : letter === selected ? ' wrong' : ' muted') : '';
      const button = el('button', `option-button${result}`);
      button.type = 'button';
      button.disabled = Boolean(selected);
      button.append(el('span', 'option-letter', letter), el('span', '', option));
      button.onclick = () => answer(letter);
      options.append(button);
    });
    area.append(options);

    if (selected) {
      const correct = selected === question.answer;
      const feedback = el('div', `feedback${correct ? '' : ' incorrect'}`);
      feedback.append(el('div', 'feedback-heading', correct ? '回答正确' : '回答错误'));
      feedback.append(el('div', 'feedback-answer', `正确答案：${question.answer} · ${question.options[letters.indexOf(question.answer)]}`));
      if (question.explanation) feedback.append(el('div', 'feedback-explanation', question.explanation));
      area.append(feedback);
    }

    const actions = el('div', 'question-actions');
    const saveButton = el('button', `text-action${state.saved.has(id) ? ' active' : ''}`, state.saved.has(id) ? '★ 已收藏' : '☆ 收藏本题');
    saveButton.type = 'button';
    saveButton.onclick = () => {
      if (state.saved.has(id)) state.saved.delete(id); else state.saved.add(id);
      saveState(); render();
    };
    actions.append(saveButton);
    if (state.wrong.has(id)) {
      const remove = el('button', 'text-action', '移出错题');
      remove.type = 'button';
      remove.onclick = () => { state.wrong.delete(id); saveState(); render(); toast('已移出错题'); };
      actions.append(remove);
    }
    area.append(actions);
  }

  function render() {
    renderSidebar();
    renderHeader();
    renderSession();
    renderQuestion();
  }

  function closeSidebar() {
    $('sidebar').classList.remove('open');
    $('sidebar-backdrop').classList.remove('open');
  }

  $('mobile-filter-button').onclick = () => { $('sidebar').classList.add('open'); $('sidebar-backdrop').classList.add('open'); };
  $('sidebar-close').onclick = closeSidebar;
  $('sidebar-backdrop').onclick = closeSidebar;
  $('mode-tabs').onclick = event => { if (event.target.dataset.mode) setMode(event.target.dataset.mode); };
  $('session-size').onchange = event => { state.size = event.target.value; startSession(state.session?.order || 'sequential'); };
  $('start-sequential').onclick = () => startSession('sequential');
  $('start-random').onclick = () => startSession('random');
  $('prev-button').onclick = () => { state.session.index--; saveState(); render(); };
  $('next-button').onclick = () => { state.session.index++; saveState(); render(); };

  $('export-button').onclick = () => {
    const backup = {
      version: 1, subject: state.subject, chapter: state.chapter, mode: state.mode, size: state.size,
      records: state.records, wrong: [...state.wrong], saved: [...state.saved], session: state.session,
    };
    const blob = new Blob([JSON.stringify(backup, null, 2)], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const link = document.createElement('a');
    link.href = url;
    link.download = `知行题库进度-${new Date().toISOString().slice(0, 10)}.json`;
    link.click();
    setTimeout(() => URL.revokeObjectURL(url), 1000);
    toast('进度已导出');
  };
  $('import-button').onclick = () => $('import-file').click();
  $('import-file').onchange = async event => {
    const file = event.target.files[0];
    if (!file) return;
    try {
      const imported = JSON.parse(await file.text());
      if (imported.version !== 1 || !imported.records || !Array.isArray(imported.wrong) || !Array.isArray(imported.saved)) throw Error('invalid');
      localStorage.setItem(storageKey, JSON.stringify(imported));
      location.reload();
    } catch { toast('进度文件格式不正确'); }
    event.target.value = '';
  };

  document.addEventListener('keydown', event => {
    if (event.altKey || event.ctrlKey || event.metaKey || ['INPUT', 'SELECT', 'TEXTAREA'].includes(document.activeElement?.tagName)) return;
    if (['1', '2', '3', '4'].includes(event.key)) answer(letters[Number(event.key) - 1]);
    if (event.key === 'ArrowRight' && !$('next-button').disabled) $('next-button').click();
    if (event.key === 'ArrowLeft' && !$('prev-button').disabled) $('prev-button').click();
  });

  if (!state.session?.ids.length) startSession('sequential'); else render();
})();

</script>
</head>
<body>
  <div class="app-shell">
    <header class="app-header">
      <div class="brand"><span class="brand-mark">知</span><span>知行题库</span><small>教师考试练习</small></div>
      <div class="header-stats" aria-label="学习概况">
        <div><strong id="header-done">0</strong><span>已练</span></div>
        <div><strong id="header-accuracy">--</strong><span>正确率</span></div>
      </div>
      <button class="mobile-filter-button" id="mobile-filter-button" type="button">筛选章节</button>
    </header>

    <div class="workspace">
      <aside class="sidebar" id="sidebar" aria-label="题库范围">
        <div class="sidebar-heading"><span>题库范围</span><button class="sidebar-close" id="sidebar-close" type="button" aria-label="关闭筛选">×</button></div>
        <div class="subject-list" id="subject-list"></div>
        <div class="sidebar-divider"></div>
        <div class="section-heading">章节 <span id="chapter-count"></span></div>
        <div class="chapter-list" id="chapter-list"></div>
        <div class="sidebar-footer">题目与解析来自原始资料，法规题请以现行规定为准。</div>
      </aside>

      <main class="main-content">
        <div class="page-title-row">
          <div><div class="eyebrow" id="scope-label">全部题库</div><h1>刷题练习</h1></div>
          <div class="data-actions"><button id="export-button" type="button">导出进度</button><button id="import-button" type="button">导入进度</button><input id="import-file" type="file" accept="application/json,.json" hidden></div>
        </div>

        <section class="practice-controls" aria-label="练习设置">
          <div class="mode-tabs" id="mode-tabs" role="tablist" aria-label="题目范围">
            <button class="active" type="button" data-mode="all" role="tab" aria-selected="true">全部</button>
            <button type="button" data-mode="unanswered" role="tab" aria-selected="false">未做</button>
            <button type="button" data-mode="wrong" role="tab" aria-selected="false">错题</button>
            <button type="button" data-mode="saved" role="tab" aria-selected="false">收藏</button>
          </div>
          <div class="session-controls">
            <label>每轮 <select id="session-size"><option value="20">20 题</option><option value="50">50 题</option><option value="all">全部</option></select></label>
            <button id="start-sequential" class="secondary-command" type="button">顺序练习</button>
            <button id="start-random" class="primary-command" type="button">随机练习</button>
          </div>
        </section>

        <div class="session-summary"><span id="session-status">准备开始</span><span id="session-progress-text">0 / 0</span></div>
        <div class="progress-track"><div id="progress-bar"></div></div>

        <section id="question-area" class="question-area" aria-live="polite"></section>

        <nav class="question-nav" aria-label="题目导航">
          <button id="prev-button" type="button">← 上一题</button>
          <span id="question-position">第 0 题</span>
          <button id="next-button" type="button">下一题 →</button>
        </nav>
      </main>

      <aside class="right-panel" aria-label="本轮进度">
        <div class="panel-heading"><span>本轮进度</span><strong id="round-count">0 题</strong></div>
        <div class="round-stats"><div><strong id="round-done">0</strong><span>已作答</span></div><div><strong id="round-correct">0</strong><span>答对</span></div><div><strong id="round-wrong">0</strong><span>答错</span></div></div>
        <div class="palette-label">题目</div>
        <div id="question-palette" class="question-palette"></div>
        <div class="palette-key"><span><i class="key-current"></i>当前</span><span><i class="key-correct"></i>正确</span><span><i class="key-wrong"></i>错误</span></div>
      </aside>
    </div>
  </div>
  <div class="sidebar-backdrop" id="sidebar-backdrop"></div>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
</body>
</html>
